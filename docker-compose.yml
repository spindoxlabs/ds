# Shared infrastructure — postgres, caddy, keycloak.
# Start this first, then bring up provider and/or consumer stacks.
#
#   docker compose up -d
#   task rec:start
#   task third-party:start

networks:
  dataspaces:
    name: dataspaces
    driver: bridge

volumes:
  postgres_data:
  # Enrolment codes, from the trust anchor's bootstrap to each participant's.
  #
  # A **named volume** rather than `./data/enrolment`, which is the one place the
  # root guide's "everything generated goes under data/" rule is deliberately not
  # followed. Two reasons, and the first is decisive: the containers run as uid
  # 10001 and a bind-mounted host directory belongs to the developer, so the
  # anchor could not write it (observed — `Permission denied`, and the bootstrap
  # reported success anyway). The second is that these are short-lived,
  # single-use credentials; a docker-managed volume keeps them off the host
  # filesystem entirely, which is where a credential belongs least.
  enrolment:

services:
  # ── Reverse proxy — the single :80 gateway, routed by Host header ────────────
  #
  # One published port for every virtual host. :80 is not optional: a portless
  # `did:web` DID resolves to `http://<host>/.well-known/did.json` and no
  # resolver will try another port, so a gateway on 9010 could never serve the
  # DID documents the participants are identified by. If another stack on this
  # machine wants :80, front both with a host-level proxy rather than moving
  # this one.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      dataspaces:
        aliases:
          - rec.dataspaces.localhost
          - third-party.dataspaces.localhost
          - trust-anchor.dataspaces.localhost
          # The second provider (`DID-15`). Its host is its `did:web` identity,
          # so the alias is what lets a counterparty inside the network resolve
          # it at all.
          - grid-operator.dataspaces.localhost
          # `users.dataspaces.localhost` was here until `DID-11` step 2. A
          # person's DID now lives in their custodian's namespace
          # (`did:web:<participant>:users:<id>`), so it resolves on that
          # participant's host and needs no alias of its own — which is also
          # what makes it resolvable at all: the flat host had no site block and
          # every subject DID 404'd (`personal-data.md` `D-22`).
          # oauth2-proxy performs OIDC discovery against the *browser-facing*
          # issuer, because that is the `iss` the tokens carry and the URL the
          # user is redirected to. These aliases let it reach that URL from inside
          # the network — Caddy listens on the same :80 internally as it does on
          # the host — so no extra_hosts entry and no second issuer URL is needed.
          - keycloak.dataspaces.localhost
          - sso.dataspaces.localhost
          - portal.dataspaces.localhost

  # ── Shared PostgreSQL (one database per service, all on port 35432) ──────────
  postgres:
    image: postgres:17.4-alpine
    restart: unless-stopped
    ports:
      - "35432:5432"
    environment:
      POSTGRES_USER: postgres
      # `secrets:generate` produces POSTGRES_PASSWORD and `secrets:check` fails
      # when it is still `postgres` — while compose hardcoded the literal here
      # and in every DATABASE_URL, so setting the variable changed nothing and
      # the guard demanded a value the topology could not use. Dev is unchanged:
      # the default is the same literal.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [dataspaces]

  # ── Identity Registry — DID lifecycle, VC issuance, STS, credential service ─
  identity-registry-db-create:
    image: postgres:17
    command: |
      sh -c 'n=0; until pg_isready -h 172.17.0.1 -p 35432 -U postgres; do
      n=$$((n+1)); [ $$n -lt 60 ] || { echo "postgres 172.17.0.1:35432 not ready after 60s"; exit 1; }; sleep 1; done &&
      psql -h 172.17.0.1 -p 35432 -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='"'"'identity_registry'"'"'" |
      grep -q 1 || psql -h 172.17.0.1 -p 35432 -U postgres -c "CREATE DATABASE identity_registry"'
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [dataspaces]

  identity-registry-db-init:
    build:
      context: .
      dockerfile: services/identity-registry/Dockerfile
    command: ["alembic", "--config", "alembic.ini", "upgrade", "head"]
    working_dir: /app
    restart: "no"
    depends_on:
      identity-registry-db-create:
        condition: service_completed_successfully
    environment:
      IDENTITY_REGISTRY_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@172.17.0.1:35432/identity_registry
    networks: [dataspaces]

  identity-registry:
    build:
      context: .
      dockerfile: services/identity-registry/Dockerfile
    restart: unless-stopped
    ports:
      - "30005:30005"
    env_file:
      - path: .env.celine
        required: false
    environment:
      # Compose IS the development topology, so it declares the unsafe mode
      # explicitly. ProductionGuard defaults to `production`; a service that
      # never hears about DS_ENV now refuses to start on a dev default
      # instead of quietly accepting one.
      DS_ENV: ${DS_ENV:-dev}
      IDENTITY_REGISTRY_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@172.17.0.1:35432/identity_registry
      IDENTITY_REGISTRY_TRUST_ANCHOR_DOMAIN: trust-anchor.dataspaces.localhost
      # A presentation query is authorized by the *verifier's* self-issued token,
      # whose signature is checked against the key in the verifier's DID
      # document — so this service resolves did:web, and dev serves it over
      # plain HTTP through Caddy on :80. The same choice the EDCs state as
      # `edc.iam.did.web.use.https=false`; the two must agree or one side
      # cannot fetch what the other publishes. Production keeps the default
      # (true) and the ProductionGuard refuses to start otherwise.
      IDENTITY_REGISTRY_DID_WEB_USE_HTTPS: "false"
      # Provisioning bundles: the externally reachable registry URL a third party
      # configures against, and the realm admin credentials used to create its
      # connector's Keycloak client. Unset, the bundle is still issued — without
      # Keycloak credentials in it.
      # Also the base of every StatusList URL written into an issued credential,
      # so it must be reachable by a *verifier* — which is an EDC in a container,
      # a host process, or a counterparty. The Caddy host is the one address that
      # is all three, and it is the same shape production uses.
      IDENTITY_REGISTRY_IDENTITY_REGISTRY_PUBLIC_URL: http://trust-anchor.dataspaces.localhost
      # Told when the participant registry changes, so an operator does not
      # watch a stale list for a minute after a promote. Best-effort: a
      # connector that cannot be reached just keeps its 60s TTL.
      IDENTITY_REGISTRY_CONNECTOR_URLS: http://172.17.0.1:30001,http://172.17.0.1:31001,http://172.17.0.1:32001
      IDENTITY_REGISTRY_KEYCLOAK_TOKEN_URL: http://172.17.0.1:9080/realms/dataspaces/protocol/openid-connect/token
      IDENTITY_REGISTRY_OIDC_GROUP_ALIASES: ${IDENTITY_REGISTRY_OIDC_GROUP_ALIASES:-}
      KEYCLOAK_ADMIN_URL: http://172.17.0.1:9080
      KEYCLOAK_ISSUER_URL: http://keycloak.dataspaces.localhost/realms/dataspaces
      KEYCLOAK_REALM: dataspaces
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    depends_on:
      identity-registry-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:30005/health', timeout=2)\""]
      interval: 10s
      start_period: 15s
      retries: 10
    networks: [dataspaces]
    extra_hosts:
      # **Participant hosts, resolved through the gateway rather than a Docker
      # network alias.** A `did:web` DID resolves at the host it names, and this
      # container fetches those documents itself — at enrolment, and on every
      # presentation query. The alias list on the `caddy` service works only when
      # *this* project's Caddy is the one running; in a dev machine where a
      # shared edge proxy owns :80, it is somebody else's compose file. Pointing
      # at the host gateway works either way.
      - "rec.dataspaces.localhost:host-gateway"
      - "third-party.dataspaces.localhost:host-gateway"
      - "grid-operator.dataspaces.localhost:host-gateway"
      - "trust-anchor.dataspaces.localhost:host-gateway"

  # ── Identity Registry bootstrap — trust anchor, participants, dev users ──────
  identity-registry-bootstrap:
    build:
      context: .
      dockerfile: services/identity-registry/Dockerfile
    restart: "no"
    depends_on:
      identity-registry:
        condition: service_healthy
    environment:
      IDENTITY_REGISTRY_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@172.17.0.1:35432/identity_registry
      IDENTITY_REGISTRY_TRUST_ANCHOR_DOMAIN: trust-anchor.dataspaces.localhost
      # This container is what *issues* the credentials, so the StatusList URL
      # baked into each one comes from here — not from the service above. Missing
      # it, every dev credential carried `https://trust-anchor…/status/1`, a URL
      # dev serves on no port, and each one was unverifiable from birth.
      IDENTITY_REGISTRY_IDENTITY_REGISTRY_PUBLIC_URL: http://trust-anchor.dataspaces.localhost
    volumes:
      - ./services/identity-registry/seed:/seed:ro
      # Where the enrolment codes are written for the participant instances to
      # read. See the `enrolment` volume definition for why this is not a bind
      # mount under `data/`.
      - enrolment:/enrolment
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        ir-cli bootstrap
        # Owners first: a participant enrols **as** a verified organisation, so
        # the organisation has to exist before the code that admits it.
        ir-cli owner import --file /seed/owners.dev.yaml
        # `participant add` used to live here, and it minted each participant's
        # keypair and STS secret in *this* database (`DID-09`). It no longer
        # does: the anchor issues an enrolment code, and each participant
        # generates its own key and presents it. The code is written where the
        # participant's own bootstrap can read it — `data/` is the one place for
        # anything a process produces, and the CLI prints the code to stdout
        # alone so this redirect captures it cleanly.
        mkdir -p /enrolment
        ir-cli org enrolment-token --alias example-org \
          --roles provider \
          --scope dataspaces.query --scope dataspaces.admin \
          --label "dev provider bootstrap" > /enrolment/example-org.code
        ir-cli org enrolment-token --alias consumer-org \
          --roles consumer \
          --scope dataspaces.query --scope owner:example-org:member \
          --label "dev consumer bootstrap" > /enrolment/consumer-org.code
        # **The second provider** (`D-54`, `DID-15`). A DSO shares its own grid
        # data and has no members, which is the structural difference the
        # fixture exists for — a platform tested against one provider quietly
        # assumes every participant has a member store.
        ir-cli org enrolment-token --alias grid-operator \
          --roles provider \
          --scope dataspaces.query \
          --label "dev grid-operator bootstrap" > /enrolment/grid-operator.code
        ir-cli agreement import --file /seed/agreements.dev.yaml
        # **`P-1`'s last step**, and it had no seed path until `ir-cli conformity
        # check` reported that no dev participant had ever accepted anything.
        # `owner import` records who an organisation is; accepting the terms is a
        # separate act, and one the rulebook requires before promotion.
        for org in example-org consumer-org grid-operator; do
          ir-cli agreement accept --owner "$$org" --accepted-by dev-seed
        done
        echo "Identity bootstrap complete"
    networks: [dataspaces]


  # ── Dev users, after the participants exist ─────────────────────────────────
  #
  # **Split out of `identity-registry-bootstrap` by `DID-11` step 2**, and the
  # ordering is now load-bearing rather than cosmetic. A person's credential is
  # delivered to the organisation that holds it, so that organisation has to
  # have enrolled first — its DID document, and the `CredentialService` entry the
  # anchor delivers to, do not exist until it does.
  #
  # Run by `task identity:users` after `rec:start` and `third-party:start`.
  # Running it early does not corrupt anything: the credentials are issued and
  # the delivery is reported as failed, which is the state a re-run repairs.
  identity-users-bootstrap:
    build:
      context: .
      dockerfile: services/identity-registry/Dockerfile
    restart: "no"
    depends_on:
      identity-registry:
        condition: service_healthy
    environment:
      IDENTITY_REGISTRY_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@172.17.0.1:35432/identity_registry
      IDENTITY_REGISTRY_TRUST_ANCHOR_DOMAIN: trust-anchor.dataspaces.localhost
      IDENTITY_REGISTRY_IDENTITY_REGISTRY_PUBLIC_URL: http://trust-anchor.dataspaces.localhost
      # Delivery resolves nothing over did:web — it reads the endpoint the
      # participant published at enrolment — but the endpoint itself is a Caddy
      # host, so this container has to be able to reach it.
      IDENTITY_REGISTRY_DID_WEB_USE_HTTPS: "false"
    extra_hosts:
      - "rec.dataspaces.localhost:host-gateway"
      - "third-party.dataspaces.localhost:host-gateway"
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        ir-cli credential issue-data-subject \
          --subject-id consumer-user --role ConsumerUser \
          --linked-participant-did did:web:third-party.dataspaces.localhost
        ir-cli keycloak map-user \
          --did did:web:third-party.dataspaces.localhost:users:consumer-user \
          --realm dataspaces \
          --user-id 00000000-0000-4000-a000-000000000002 \
          --email consumer@example.test
        ir-cli credential issue-data-subject \
          --subject-id data-subject --role DataSubject \
          --linked-participant-did did:web:rec.dataspaces.localhost
        ir-cli keycloak map-user \
          --did did:web:rec.dataspaces.localhost:users:data-subject \
          --realm dataspaces \
          --user-id 00000000-0000-4000-a000-000000000004 \
          --email subject@example.test
        # A user holding BOTH roles. Roles are additive, not exclusive — the same
        # human can be a data subject about their own consumption and a consumer
        # user acting for an organisation — and without a fixture that actually
        # holds two credentials, every guard and nav path that assumes one role
        # per person looks correct in dev.
        ir-cli credential issue-data-subject \
          --subject-id dual-user --role DataSubject \
          --linked-participant-did did:web:rec.dataspaces.localhost
        # **Both of this person's credentials at the same custodian**, and the
        # reason is a limitation worth naming: custody follows each credential
        # (`DID-11` step 2), so a person granted roles by two organisations has
        # their credentials in two stores — and a participant-side application
        # reads *its own* store, so it can only ever present the roles that
        # organisation granted. That is correct, and it means a fixture that
        # split one person across two custodians produced a state no portal can
        # serve. The cross-custodian case is exercised where it belongs, in
        # `test_member_custody.py`, and `consumer-user` remains filed under the
        # third party.
        ir-cli credential issue-data-subject \
          --subject-id dual-user --role ConsumerUser \
          --linked-participant-did did:web:rec.dataspaces.localhost
        ir-cli keycloak map-user \
          --did did:web:rec.dataspaces.localhost:users:dual-user \
          --realm dataspaces \
          --user-id 00000000-0000-4000-a000-000000000005 \
          --email dual@example.test
        ir-cli membership add \
          --user-did did:web:rec.dataspaces.localhost:users:data-subject \
          --organization example-org \
          --role consumer
        ir-cli membership add \
          --user-did did:web:third-party.dataspaces.localhost:users:consumer-user \
          --organization example-org \
          --role consumer
        ir-cli membership add \
          --user-did did:web:rec.dataspaces.localhost:users:dual-user \
          --organization example-org \
          --role consumer
        echo "Dev users bootstrapped"
    networks: [dataspaces]

  # ── Keycloak OIDC identity provider ──────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.0
    command: ["start-dev", "--import-realm", "--http-port=9080"]
    restart: unless-stopped
    ports:
      - "9080:9080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://keycloak.dataspaces.localhost
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_SPI_LOGIN_DEFAULT_REALM_NAME: dataspaces
    volumes:
      - ./services/keycloak/realm-dataspaces-dev.json:/opt/keycloak/data/import/realm-dataspaces-dev.json:ro
    healthcheck:
      # **Ask /health/ready, do not just open the socket.** `KC_HEALTH_ENABLED`
      # above turns the health endpoints on, and this check never used them: a
      # bare TCP connect to the management port succeeds as soon as the port
      # listens, which it does before the realm import finishes and even with
      # health disabled — so `condition: service_healthy` was gating on
      # "something is listening". The Keycloak image ships no curl or wget,
      # which is why this speaks HTTP over /dev/tcp by hand.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [dataspaces]

  # ── oauth2-proxy — the human login surface ──────────────────────────────────
  #
  # Caddy delegates authentication here with `forward_auth`; this process owns the
  # browser session and nothing else. Every ds service still verifies the JWT and
  # authorises on its groups, so an injected `X-Auth-Request-*` header buys an
  # attacker nothing (Caddy strips client-supplied ones on the way in).
  #
  # **No published port.** It is reachable only as `oauth2-proxy:4180` on the
  # compose network, which keeps host 4180 free for another stack's proxy and
  # means the only way in is through Caddy.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.11.0
    restart: unless-stopped
    command: ["--config=/etc/oauth2-proxy/oauth2-proxy.cfg"]
    environment:
      # The two secrets the config file deliberately does not carry. Same split
      # the chart makes — config in a ConfigMap, these two from a Secret — so
      # the file mounted below is shape only and can stay tracked.
      #
      # Defaults are the dev values, in the same category as
      # `POSTGRES_PASSWORD:-postgres` above: weak and public on purpose. They
      # are here rather than only in `.env.local` because the root compose is
      # documented as runnable by hand, and `docker compose` does not read
      # `.env.local`. `task` does, through its `dotenv:`, so overriding either
      # in `.env` reaches the container — which is what the config-file literals
      # made impossible.
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-oauth2_proxy}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-cc7f1b2e4a6d8f0b3c5e7a9d1f2b4c6e}
    volumes:
      - ./services/oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
    depends_on:
      keycloak:
        condition: service_healthy
      # Discovery goes through Caddy at the browser-facing issuer URL, so Caddy
      # has to be up first or the proxy exits on a failed OIDC discovery.
      caddy:
        condition: service_started
    networks: [dataspaces]

  # ── Keycloak sync — scopes, service clients, audience mappers ───────────────
  keycloak-sync:
    image: ghcr.io/celine-eu/celine-policies:dev
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      # The **effective** declaration — core + domain overlays, generated by
      # `task keycloak:merge`. Not the core file: the sync takes one file and
      # recomputes every client's grants from it, so syncing the core alone
      # would strip the overlay's grants (`rec-registry.lookup` off
      # `svc-ds-dataset-api`) with no flag involved, and a row filter would
      # silently resolve nobody.
      - ./services/keycloak/clients.effective.yaml:/app/clients.yaml:ro
    environment:
      CELINE_KEYCLOAK_BASE_URL: http://172.17.0.1:9080
      CELINE_KEYCLOAK_REALM: dataspaces
      # An OUTPUT path: `keycloak sync` writes the secrets it applied here. It is
      # not how secrets get in — that is the block below.
      CELINE_KEYCLOAK_SECRETS_FILE: /tmp/.secrets.yaml
      # ── The client secrets the realm is given ────────────────────────────────
      #
      # `clients.effective.yaml` carries each one as `${SVC_…_SECRET:-<client-id>}`
      # and celine-policies resolves it with `os.getenv` at load time
      # (`models.py:_resolve_env`). This container had none of them, so every
      # placeholder fell through to its default and **the realm stored each
      # client's secret as its own client id**, verified against a running
      # Keycloak.
      #
      # In dev that is invisible: the services default to the same value, so both
      # sides agree by coincidence. It breaks the moment one real secret is set —
      # the service presents it, the realm still holds the client id, and that one
      # client silently stops authenticating. A half-configured deployment is
      # worse than an unconfigured one, which is why this is a P0.
      #
      # Every name here must also exist in .env.example and `secrets:generate`,
      # or setting it is not possible in the first place.
      SVC_DS_IDENTITY_REGISTRY_SECRET: ${SVC_DS_IDENTITY_REGISTRY_SECRET:-svc-ds-identity-registry}
      SVC_DS_ONBOARDING_SECRET: ${SVC_DS_ONBOARDING_SECRET:-svc-ds-onboarding}
      SVC_DS_PORTAL_SECRET: ${SVC_DS_PORTAL_SECRET:-svc-ds-portal}
      SVC_DS_E2E_SECRET: ${SVC_DS_E2E_SECRET:-svc-ds-e2e}
      SVC_DS_CONNECTOR_SECRET: ${SVC_DS_CONNECTOR_SECRET:-svc-ds-connector}
      SVC_DS_PROVENANCE_SECRET: ${SVC_DS_PROVENANCE_SECRET:-svc-ds-provenance}
      SVC_DS_FEDERATED_CATALOG_SECRET: ${SVC_DS_FEDERATED_CATALOG_SECRET:-svc-ds-federated-catalog}
      SVC_DS_DATASET_API_SECRET: ${SVC_DS_DATASET_API_SECRET:-svc-ds-dataset-api}
      SVC_EDC_SECRET: ${SVC_EDC_SECRET:-svc-edc}
      # From the domain overlay (`clients.energy.yaml`), so it is only present in
      # the effective file — but it is in the file this container mounts, and an
      # unresolved placeholder there is the same defect as any other.
      SVC_REC_REGISTRY_SECRET: ${SVC_REC_REGISTRY_SECRET:-svc-rec-registry}
      # The realm admin, from the same two variables the Keycloak service itself
      # reads (`KC_BOOTSTRAP_ADMIN_*` above). They were hardcoded `admin`/`admin`
      # here, so a deployment that set a real admin password had a sync that
      # could not authenticate — while `.env.example` declares both and
      # `secrets:check` fails on the dev values. Passed through the environment
      # rather than on the command line: an argument is visible in `ps`.
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        celine-policies keycloak bootstrap \
          --admin-user "$$KEYCLOAK_ADMIN_USERNAME" \
          --admin-password "$$KEYCLOAK_ADMIN_PASSWORD" &&
        celine-policies keycloak sync \
          --secrets-file /tmp/.secrets.yaml
    networks: [dataspaces]

  # ── Keycloak org sync — KC native organizations from organizations.yaml ────
  keycloak-org-sync:
    build:
      context: .
      dockerfile: services/identity-registry/Dockerfile
    restart: "no"
    depends_on:
      keycloak-sync:
        condition: service_completed_successfully
    volumes:
      - ./services/keycloak/organizations.yaml:/app/organizations.yaml:ro
    environment:
      # Same two variables as `keycloak-sync` above, for the same reason.
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        ir-cli keycloak org-sync \
          --config /app/organizations.yaml \
          --keycloak-url http://172.17.0.1:9080 \
          --admin-user "$$KEYCLOAK_ADMIN_USERNAME" \
          --admin-password "$$KEYCLOAK_ADMIN_PASSWORD" \
          --strict
    networks: [dataspaces]
