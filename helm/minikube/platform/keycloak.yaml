# The bundled Keycloak of a local cluster, in development mode, with ds's dev realm
# `dataspaces` imported (services/keycloak/realm-dataspaces-dev.json: its users'
# passwords are their usernames, which is why it exists only for local clusters). The
# ds clients are then synced into it by minikube.sh realm with generated secrets. Served
# at https://keycloak.${DOMAIN} through the ingress, so tokens carry that issuer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: ${NAMESPACE}
  labels: {app.kubernetes.io/name: keycloak}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: keycloak}
  template:
    metadata:
      labels: {app.kubernetes.io/name: keycloak}
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.3
          args: ["start-dev", "--import-realm", "--http-port=8080", "--health-enabled=true"]
          env:
            - {name: KC_HOSTNAME, value: "https://keycloak.${DOMAIN}"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: {secretKeyRef: {name: keycloak-admin, key: username}}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-admin, key: password}}
          ports:
            - {containerPort: 8080, name: http}
            - {containerPort: 9000, name: management}
          readinessProbe:
            httpGet: {path: /health/ready, port: 9000}
            initialDelaySeconds: 20
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
      volumes:
        - name: realm
          configMap: {name: keycloak-realm}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: ${NAMESPACE}
spec:
  selector: {app.kubernetes.io/name: keycloak}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: ${NAMESPACE}
  annotations:
    cert-manager.io/cluster-issuer: ${ISSUER}
    nginx.ingress.kubernetes.io/proxy-buffer-size: 128k
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["keycloak.${DOMAIN}"]
      secretName: keycloak-tls
  rules:
    - host: "keycloak.${DOMAIN}"
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: keycloak, port: {number: 8080}}}}
