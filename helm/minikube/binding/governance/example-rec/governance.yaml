# The minikube community's governance. One open dataset, so the community is a
# provider with a non-empty catalogue as well as the consumer of T5.3. Its data plane is
# the same stand-in as the DSO's; the community's own plane is not rehearsed.
defaults:
  access_level: open
  classification: green
  tags: []
  retention_days: 365
  ownership:
    - name: example-rec
      type: DATA_OWNER
  dataspace:
    expose: false

sources:
  datasets.gold.om_weather_features:
    title: "Weather Features (Gold)"
    description: >-
      Hourly weather features for the community's area. Local data from the stand-in.
    license: CC-BY-4.0
    access_level: open
    classification: green
    tags: [weather, gold]
    source_system: local stand-in
    dataspace:
      expose: true
      medallion: gold
      purpose: [GridMonitoring, EnergyCommunityOperation]
      asset:
        id: "datasets.gold.om_weather_features"
        content_type: "application/json"
      data_address:
        type: HttpData
        base_url: "http://ds-data-plane.ds-platform.svc.cluster.local:30002/query"
        proxy_path: false
        proxy_query_params: true
