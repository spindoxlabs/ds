# ==============================================================================
# Dataspace deployment — operator configuration
# ==============================================================================
#
# This is the ONE file you edit. Helmfile loads it as environment values and
# derives every per-release values document from it.
#
# Secrets do NOT live here — see secrets.example.yaml → secrets.sops.yaml.
#
# Anything absent from this file has a safe default inside the charts.
# See docs/deployment/ for the operator documentation — prerequisites, the full
# key-by-key reference for this file, secrets, exposure and day-2 ops.
# ==============================================================================

global:
  # ── Public addressing ───────────────────────────────────────────────────────
  # Every public endpoint is a subdomain of baseDomain. Nothing else is exposed.
  # Participant DIDs are derived: did:web:<participant.name>.<baseDomain>
  baseDomain: ds.example.org

  hosts:
    portal: portal # portal.ds.example.org       — the only human-facing host
    trustAnchor: trust-anchor # trust-anchor.ds.example.org — DID doc + StatusList2021
    users: users # users.ds.example.org        — user DID resolution (see note)

  # ── Namespaces ──────────────────────────────────────────────────────────────
  # The authority is one trust boundary; each participant is another.
  # Per-participant namespaces default to "<prefix><participant.name>".
  namespaces:
    authority: ds-authority
    participantPrefix: ds-

  # ── Logging ─────────────────────────────────────────────────────────────────
  # Applied to every Python service through `ds.env.common`, deliberately from
  # one place: a deployment where services log at different levels or in
  # different formats is one where a single request is reconstructed from
  # several incompatible logs.
  logging:
    level: INFO # DEBUG | INFO | WARNING | ERROR | CRITICAL
    format: json # json for a log shipper, text for a person
    # Successful /health and /metrics access lines are dropped by default: a
    # probe every 10s and a scrape every 15s are the highest-volume,
    # lowest-information lines a service emits. A *failing* probe is always
    # logged. Set true to restore them.
    accessHealth: false

  # Traces — rulebook `provenance-and-logging.md` §5 step 3.
  #
  # **One endpoint, both languages.** The Python services read it through
  # `ds_obs.tracing`; the EDCs read it through the OpenTelemetry Java agent,
  # which `services/edc-connector/entrypoint.sh` attaches on the same condition.
  # So this turns tracing on for the whole exchange — including the DSP hop
  # between two participants' EDCs, which is the only part no Python span can
  # cover — and it cannot turn it on for half of it.
  #
  # **Empty by default**, like `monitoring.serviceMonitor`: a cluster with no
  # collector should get no exporter rather than one aimed at a name that does
  # not resolve, which retries on every span and surfaces as the *service's* log
  # noise.
  tracing:
    endpoint: "" # e.g. http://otel-collector.monitoring:4318
    # Anything else the SDK and the agent both read. Sampling first: the default
    # records every trace, which is a decision worth taking deliberately rather
    # than discovering under load.
    attributes: {}
    #   OTEL_TRACES_SAMPLER: parentbased_traceidratio
    #   OTEL_TRACES_SAMPLER_ARG: "0.1"

  # ── Images ──────────────────────────────────────────────────────────────────
  # ghcr.io/spindoxlabs/ds-<service>. Assumed public; pullSecrets are optional.
  #
  # Leave `tag` empty. Every chart's appVersion is stamped with the release
  # version by `task release`, so a checkout of tag vX.Y.Z already deploys
  # :X.Y.Z. To deploy a different release without editing this file:
  #   DS_IMAGE_TAG=X.Y.Z helmfile -e production apply
  image:
    registry: ghcr.io/spindoxlabs
    prefix: ds-
    tag: "" # empty → each chart's appVersion (the release version)
    pullPolicy: IfNotPresent
    pullSecrets: [] # e.g. [{name: ghcr-credentials}]

  # ── Ingress / TLS ───────────────────────────────────────────────────────────
  # cert-manager is assumed present. Set clusterIssuer to have certificates
  # issued automatically, or secretName to use a pre-created certificate.
  ingress:
    className: nginx
    annotations: {}
    tls:
      clusterIssuer: letsencrypt-prod
      secretName: "" # set → used verbatim, clusterIssuer ignored

  # ── PostgreSQL — provisioned externally with CloudNativePG ──────────────────
  # See helm/docs/cnpg-cluster.example.yaml. One database AND one
  # least-privilege role per service; credentials come from secrets.sops.yaml.
  postgres:
    host: ds-pg-rw.database.svc.cluster.local
    port: 5432
    sslMode: require
    databases:
      identityRegistry: identity_registry
      # per-participant databases are suffixed with the participant name:
      #   connector_<participant>, provenance_<participant>, edc_<participant>
      connectorPrefix: connector
      provenancePrefix: provenance
      edcPrefix: edc

  # ── Keycloak — externally managed, never installed by these charts ──────────
  # See docs/deployment/keycloak.md for the realm/client contract.
  keycloak:
    realm: dataspaces
    issuerUrl: https://sso.example.org/realms/dataspaces
    adminUrl: https://sso.example.org
    tokenUrl: https://sso.example.org/realms/dataspaces/protocol/openid-connect/token
    sync:
      # Opt-in provisioning of service clients / organizations into the external
      # Keycloak. Off by default: KC is not ours to mutate.
      enabled: false
      # No `clientsConfigMap` here. It was read by no template: **no chart runs
      # `celine-policies keycloak sync`**, so there was never anything to mount
      # the clients file into. It read as a supported way to provision the realm
      # from Helm, and there is none — the realm is provisioned out-of-band from
      # every file that declares the realm — `clients.dataspaces.yaml` as the
      # base plus `clients.yaml` and each domain overlay with `--overlay` (never
      # a subset: the syncer recomputes every client's grants from what it is
      # given, so a missing file strips whatever it granted).
      organizationsConfigMap: "" # ConfigMap holding organizations.yaml

    # ── Layer B — the foreign realm's vocabulary, translated ──────────────────
    # Empty means "the realm speaks ds's names already", which is true when ds
    # owns the realm (posture A) and false the moment it does not (posture B).
    #
    # Both maps are emitted to **every** service that reads them from this one
    # block. That is deliberate: a group map wired into some services and not
    # others is a deployment where a caller's authority depends on which service
    # answered the request.
    aliases:
      # Foreign group name → ds role bundle. Values must be bundle names
      # (`ds-admin`, `ds-participant-admin`, `ds-participant-viewer`,
      # `ds-onboarding-operator`, `ds-member`) — never a raw capability. An
      # unknown target is dropped and logged rather than honoured, so a typo
      # grants nothing instead of granting something else.
      #   {"host-manager": "ds-participant-admin"}
      groups: {}
      # Foreign organisation alias → ds `Owner` id. Read by the connector's
      # per-owner perimeter only.
      #   {"host-org-alias": "example-org"}
      owners: {}
    # May the identity-registry write to the realm at *runtime*? `sync` above is
    # about boot-time provisioning; this is about promotion creating
    # `svc-ds-connector-<alias>` and handing over its secret.
    #
    #   unset/false — ds is a guest. No client is created; the provisioning bundle
    #                 carries no Keycloak block, and whoever runs the realm gives
    #                 the participant its credentials.
    #   true        — ds owns the realm. Requires the admin credentials under
    #                 `sync.enabled`, and a dev-default admin password then fails
    #                 the production guard.
    #
    # Defaults to `sync.enabled`, so a chart deployment is a guest unless it says
    # otherwise — the same posture the comment above states.
    mutate: false

  # ── Posture ─────────────────────────────────────────────────────────────────
  networkPolicy:
    enabled: true # default-deny ingress+egress, explicit allows only
  monitoring:
    serviceMonitor: false
    prometheusNamespace: monitoring
  externalSecrets:
    enabled: false # true → emit ExternalSecret CRs instead of Secrets
    secretStoreRef: {} # {name: vault-backend, kind: ClusterSecretStore}

  # Resource profile applied to every service unless overridden per-service.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# ==============================================================================
# Dataspace authority — deploy ONCE per dataspace
# ==============================================================================
authority:
  enabled: true

  identityRegistry:
    replicaCount: 1
    trustAnchorDomain: trust-anchor.ds.example.org

    # did:web resolution for user DIDs (did:web:users.<baseDomain>:<id>).
    # Only needed if REMOTE verifiers resolve your user DIDs. If all VC
    # verification is local, leave this false and drop the users host.

    # DCP credential-service presentation query. Internal by default — the
    # holder self-presents. Enable only if remote verifiers query it directly.
    credentialService:
      expose: false

    bootstrap:
      # ir-cli bootstrap + participant/owner/membership seeding, as an init
      # container. Idempotent (upsert semantics), safe on every pod start.
      enabled: true
      # Empty → the image's baked-in defaults are used.
      seedConfigMap: "" # owners.yaml / participants.yaml / memberships
      seedMountPath: /seed
      # A deployment's own governance, as a ConfigMap. Its keys become flat
      # filenames under the mount — a ConfigMap key cannot contain `/`.
      governanceConfigMap: ""
      governanceMountPath: /governance
      # How `org apply` chooses what to onboard, and on what evidence. All
      # empty is the historical invocation: a deployment's owners.yaml carries
      # no `dataspace:` block on any entry, so nothing is applied and the run
      # exits zero. See docs/deployment/configuration.md.
      orgApply:
        governance: [] # paths under governanceMountPath, or absolute
        verifiedBy: "" # required by governance/evidenceRef; refused at render
        evidenceRef: ""
        dryRun: false

# ==============================================================================
# Participants — one release group per participant
# ==============================================================================
# Public host per participant: <name>.<global.baseDomain>, serving exactly
#   /.well-known/did.json   → identity-registry (rewritten)
#   /credentials/*, /sts/*, /users/*  → identity-registry (DCP surfaces)
#   /protocol/2025-1/*      → EDC DSP
# Everything else on that host returns 404. There is no /public route: the EDC
# data-plane public context is registered by no packaged module, and a consumer
# pulls from the dataset API rather than through any EDC.
participants:
  - name: rec
    enabled: true
    role: provider # provider | consumer

    # did: "" → derived as did:web:<name>.<global.baseDomain>. Override to pin.
    did: ""

    # The dataset API is participant-operated and NOT deployed by these charts,
    # and it needs no value here: it authenticates to the connector's
    # /internal/dataplane/authorize with the EDC API key, so ds is the callee.
    # Where a consumer is sent for the data is governance.yaml's
    # data_address.base_url, carried by the governance ConfigMap.

    connector:
      replicaCount: 1
      # Webhook notifications are rejected unless the host is allowlisted.
      # **"" is none.** This was the string "null", which the connector does
      # not recognise: `build_notifier` splits on commas and matches each part
      # against "smtp"/"webhook", so every deployment logged
      # `Unknown notification backend 'null' — skipped` before falling through
      # to the no-op notifier it wanted anyway.
      notifyBackends: "" # "" | smtp | webhook (comma-separated)
      webhookAllowedHosts: [] # required if notifyBackends includes webhook
      governanceOverlayName: "" # merges governance.<name>.yaml
      # "" mounts nothing and the catalogue stays empty — there is no
      # baked-in governance.yaml in the image. A provider needs this set.
      governanceConfigMap: ""

    provenance:
      replicaCount: 1

    edc:
      replicaCount: 1

    federatedCatalog:
      enabled: true
      replicaCount: 1
      crawlInterval: 300

    portal:
      # The portal is deployed alongside exactly one participant.
      enabled: true
      replicaCount: 1

  # A **second provider**, and one shaped differently from the first (`D-54`,
  # `DID-15`): a grid operator shares its own infrastructure data and has no
  # members, so nothing downstream may assume a participant holds credentials
  # for people. Disabled by default — a deployment enables the participants it
  # actually has — but present, because a chart that can only express one
  # provider is a chart that encodes the dev fixture.
  - name: grid-operator
    enabled: false
    role: provider
    did: ""
    connector:
      replicaCount: 1
      notifyBackends: ""
      webhookAllowedHosts: []
      # Its own governance. The consent offers of the participant that *has*
      # members are not this one's to publish.
      governanceConfigMap: ""
    provenance:
      replicaCount: 1
    edc:
      replicaCount: 1
    federatedCatalog:
      enabled: false
    portal:
      enabled: false

  - name: third-party
    enabled: true
    role: consumer
    did: ""
    connector:
      replicaCount: 1
      notifyBackends: ""
      webhookAllowedHosts: []
    provenance:
      replicaCount: 1
    edc:
      replicaCount: 1
    federatedCatalog:
      enabled: false
    portal:
      enabled: false
