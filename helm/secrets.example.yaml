# ==============================================================================
# Secret values — template for secrets.sops.yaml
# ==============================================================================
#
#   cp helm/secrets.example.yaml helm/secrets.sops.yaml
#   sops --encrypt --in-place helm/secrets.sops.yaml
#
# secrets.sops.yaml is encrypted at rest and safe to commit; the DECRYPTED form
# must never be. helmfile decrypts it at render time (`helmfile.yaml` →
# environments.<env>.secrets).
#
# Generation:
#   openssl rand -hex 32                                        # API keys, client secrets
#   openssl rand -base64 32                                     # oauth2ProxyCookieSecret
#   python -c 'import secrets;print(secrets.token_urlsafe(32))' # Fernet passphrase
#   task secrets:keygen                                         # EC P-256 key material
#
# This file mirrors .env.example 1:1. A variable documented there and missing
# here is a gap.
# ==============================================================================

secrets:
  # ── Critical: each of these is a full compromise if leaked ──────────────────

  # Fernet passphrase encrypting every participant DID private key at rest.
  # Leak → impersonate any participant. LOSS → every stored private key is
  # unrecoverable. Back this up OUTSIDE the cluster; a cluster Secret is not a
  # backup. Rotation requires re-encrypting the key table — no automatic path.
  identityRegistryEncryptionKey: CHANGE_ME

  # oauth2-proxy's session cookie key — 32 random bytes, base64. Leak → forge a
  # session for any human in the deployment, carrying arbitrary identity and VC
  # claims. This replaced the portal's `authSecret`: the portal is no longer an
  # OIDC client and holds no session of its own.
  #   openssl rand -base64 32
  oauth2ProxyCookieSecret: CHANGE_ME

  # ── Keycloak service clients (services/keycloak/clients.yaml) ───────────────
  # In dev every one of these defaults to its own client_id.
  svcDsIdentityRegistrySecret: CHANGE_ME
  svcDsOnboardingSecret: CHANGE_ME
  svcDsPortalSecret: CHANGE_ME
  # `svc-ds-connector` is an audience only — no process authenticates as it
  # (each connector uses its organisation client). The realm still declares it,
  # so it still needs a real secret there.
  svcDsConnectorSecret: CHANGE_ME
  svcDsFederatedCatalogSecret: CHANGE_ME
  svcDsDatasetApiSecret: CHANGE_ME
  svcEdcSecret: CHANGE_ME

  # The realm's browser-login client — `oauth2_proxy` in clients.yaml, declared
  # in the realm import rather than created by the syncer. This is the deployment's
  # single human login surface; there is no second one.
  oauth2ProxyClientSecret: CHANGE_ME

  # Only needed when global.keycloak.sync.enabled — prefer provisioning the
  # realm out-of-band and leaving these unset.
  keycloakAdminUsername: ""
  keycloakAdminPassword: ""

  # No trust-anchor public key here since `DID-17`. The services that verify a
  # user credential resolve the anchor's DID document and read the key out of it,
  # so there is nothing to paste and nothing to keep in step when it rotates.

  # ── Database roles (one per service, per helm/docs/cnpg-cluster.example.yaml)
  # Keys are <service>_<participant> for participant-scoped services.
  postgres:
    # The trust anchor's.
    identity_registry: CHANGE_ME
    # **One per participant registry.** A participant sharing the anchor's
    # database would put every private key back in one place (`D-47`).
    identity_registry_rec: CHANGE_ME
    identity_registry_grid_operator: CHANGE_ME
    identity_registry_third_party: CHANGE_ME
    connector_rec: CHANGE_ME
    provenance_rec: CHANGE_ME
    edc_rec: CHANGE_ME
    # `-` becomes `_`: the helmfile builds these keys with
    # `replace "-" "_" $p.name`, so a participant named `grid-operator` is
    # `grid_operator` here. A mismatch renders as a missing `required` value at
    # that one release, not as anything that names the cause.
    connector_grid_operator: CHANGE_ME
    provenance_grid_operator: CHANGE_ME
    edc_grid_operator: CHANGE_ME
    connector_third_party: CHANGE_ME
    provenance_third_party: CHANGE_ME
    edc_third_party: CHANGE_ME

  # ── Per-participant material ────────────────────────────────────────────────
  # Keyed by the participant name in values.yaml.
  participants:
    rec:
      # The organisation client's secret (`svc-ds-connector-<alias>`) — this
      # participant's connector authenticates with it everywhere, including its
      # EDC's management API (v5, OAuth2; there is no management API key). EDC
      # does not check a token's audience, so a leak is contract administration
      # of this participant: keep the EDC management port off every network but
      # the connector's. Must equal the secret the realm holds for the client —
      # `ir-cli keycloak org-sync` creates it with SVC_DS_CONNECTOR_<ALIAS>_SECRET.
      organisationClientSecret: CHANGE_ME
      # The header value the EDC sends when it delivers an EDR to the connector.
      # Rendered into the EDC vault and the connector's Secret; nothing else
      # holds it.   openssl rand -hex 32
      edcCallbackKey: CHANGE_ME
      # EDC's control API — data-plane signalling, self-registration, the
      # control-plane callback. Without `web.http.control.auth.type` the whole
      # data-plane registry was readable by anything that could reach the port
      # (`ECN-01`). Nothing outside the pod holds this value, so generate it and
      # forget it; it is per participant and shared with nothing, because one
      # leak must not yield both contract administration and the data plane.
      #   openssl rand -hex 32
      edcControlApiKey: CHANGE_ME
      # This EDC's Keycloak client secret (svc-edc), for ds-connector's
      # /internal/* and /webhooks/*. The extension refuses to start without it.
      connectorClientSecret: CHANGE_ME
      # EDC vault contents. Rendered into vault.properties and mounted.
      # The committed services/connector/config/*-vault.properties are DEV
      # FIXTURES with published keys — never mount them.
      edcVault:
        # Private JWK from `task secrets:keygen` — signs Endpoint Data
        # References. Distinct from any DID private key.
        edrSigningPrivateJwk: |
          {"kty":"EC","crv":"P-256","d":"CHANGE_ME","x":"CHANGE_ME","y":"CHANGE_ME"}
      # The secret this participant's connector presents to **its own** STS.
      # Not registered by the trust anchor — the anchor mints no STS secret
      # (`D-51`), so this value is the participant's to choose and appears in
      # two places that must agree: its EDC vault and its own registry release.
      stsSecret: CHANGE_ME
      # Encrypts this participant's DID private key at rest. **Its own** — the
      # anchor's key must not be reused here, or every key is back in one place
      # and the split is cosmetic (`D-47`). Losing it means this participant
      # must re-enrol; it does not affect anybody else.
      identityRegistryEncryptionKey: CHANGE_ME
    # The DSO. A participant with no members of its own — it publishes, and the
    # `grid-operator` fixture exists to prove per-owner scoping (`DID-15`). It
    # needs exactly the same material as any other participant: **every key
    # below is per-participant on purpose**, and sharing one collapses the
    # custody boundary the split exists to create (`D-47`).
    grid-operator:
      organisationClientSecret: CHANGE_ME
      edcCallbackKey: CHANGE_ME
      # See `rec.edcControlApiKey` — per participant, never shared.
      edcControlApiKey: CHANGE_ME
      connectorClientSecret: CHANGE_ME
      edcVault:
        edrSigningPrivateJwk: |
          {"kty":"EC","crv":"P-256","d":"CHANGE_ME","x":"CHANGE_ME","y":"CHANGE_ME"}
      stsSecret: CHANGE_ME
      identityRegistryEncryptionKey: CHANGE_ME

    third-party:
      organisationClientSecret: CHANGE_ME
      edcCallbackKey: CHANGE_ME
      # See `rec.edcControlApiKey` — per participant, never shared.
      edcControlApiKey: CHANGE_ME
      connectorClientSecret: CHANGE_ME
      edcVault:
        edrSigningPrivateJwk: |
          {"kty":"EC","crv":"P-256","d":"CHANGE_ME","x":"CHANGE_ME","y":"CHANGE_ME"}
      # Its own, for the same reason as the provider's above: two participants
      # sharing an encryption key share a custody boundary (`D-47`).
      identityRegistryEncryptionKey: CHANGE_ME
      stsSecret: CHANGE_ME
