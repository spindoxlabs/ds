# Pilot-shaped values for the render tests — a deployment's own overrides on
# top of helm/values.yaml, passed down by a parent helmfile (see conftest.py).
#
# The shape of a real first deployment, with generic names: one trust anchor,
# a community that both provides and consumes (`example-rec`), a grid operator
# that only provides (`example-dso`), ds as a guest in the host platform's
# Keycloak realm (posture B), dedicated namespaces that are NOT the chart
# defaults (so a hard-coded `ds-authority` or `ds-` shows up), and the host
# platform's own services — the consent writer and the data plane — in a
# namespace of their own. Secrets are generated by the test, never committed.

global:
  baseDomain: ds.example.org
  namespaces:
    authority: example-ds
    participantPrefix: example-ds-
  keycloak:
    realm: example
    issuerUrl: https://sso.example.org/realms/example
    adminUrl: https://sso.example.org
    tokenUrl: https://sso.example.org/realms/example/protocol/openid-connect/token
    sync:
      enabled: false
      organisations: {}
    aliases:
      groups:
        example-manager: ds-participant-admin
      owners: {}
    mutate: false
  ingress:
    tls:
      clusterIssuer: example-issuer

authority:
  enabled: true
  identityRegistry:
    replicaCount: 1
    # Derived: trust-anchor.<baseDomain>.
    trustAnchorDomain: ""
    credentialService:
      expose: false
    bootstrap:
      enabled: true
      seedConfigMap: example-ds-seed
      seedMountPath: /seed
      # The deployment's agreements keep their texts in a subdirectory
      # (row 21): a ConfigMap key cannot hold `/`, so each key is mapped back
      # to its path.
      seedItems:
        - {key: agreements.yaml, path: agreements.yaml}
        - {key: participation-en.md, path: content/participation-en.md}
        - {key: owners.yaml, path: owners.yaml}
        - {key: bootstrap.sh, path: bootstrap.sh}
      governanceConfigMap: example-ds-governance
      governanceMountPath: /governance
      orgApply:
        governance:
          - example-rec.governance.yaml
          - example-dso.governance.yaml
        verifiedBy: example-deployment-staging
        evidenceRef: env/staging/owners.yaml
        dryRun: false

participants:
  - name: example-rec
    enabled: true
    role: both
    did: ""
    connector:
      replicaCount: 1
      governance:
        configMap: example-rec-governance
        overlayName: staging
        odrlProfileFile: odrl-profile.yaml
        checksum: sha256-of-the-assembled-governance-rec
      notify:
        backends: ""
        webhookAllowedHosts: []
      # The host platform's consent writer and data plane call this connector.
      networkPolicy:
        ingressFrom:
          - namespace: example-platform
            podLabels:
              app.kubernetes.io/name: onboarding
          - namespace: example-platform
            podLabels:
              app.kubernetes.io/name: dataset-api
    provenance:
      replicaCount: 1
    edc:
      replicaCount: 1
    federatedCatalog:
      enabled: false
    portal:
      enabled: true
      replicaCount: 1
      datasetApi:
        url: https://datasets.example.org
      consumer:
        defaultAssigner: did:web:example-dso.ds.example.org
        defaultCounterPartyAddress: https://example-dso.ds.example.org/protocol/2025-1

  - name: example-dso
    enabled: true
    role: provider
    did: ""
    connector:
      replicaCount: 1
      governance:
        configMap: example-dso-governance
        overlayName: staging
        odrlProfileFile: odrl-profile.yaml
        checksum: sha256-of-the-assembled-governance-dso
      # The community's consent writer registers consent at the holder, and
      # the data plane asks for authorisation.
      networkPolicy:
        ingressFrom:
          - namespace: example-platform
            podLabels:
              app.kubernetes.io/name: onboarding
          - namespace: example-platform
            podLabels:
              app.kubernetes.io/name: dataset-api
    provenance:
      replicaCount: 1
    edc:
      replicaCount: 1
    federatedCatalog:
      enabled: false
    portal:
      enabled: false
