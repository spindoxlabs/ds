# Chart defaults. Real values arrive from helm/values.yaml via helmfile.

service:
  name: portal # → ghcr.io/spindoxlabs/ds-portal
  port: 30004
  healthPath: / # SvelteKit answers on / (no /health route)

replicaCount: 1

# The participant this portal serves.
participant:
  name: provider
  role: provider

image: {registry: "", repository: "", tag: "", digest: "", pullPolicy: ""}
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount: {create: true, name: ""}
podSecurityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
containerSecurityContext: {readOnlyRootFilesystem: true}
resources: {}
probes:
  # Node cold start; give it room before the first liveness check.
  livenessInitialDelay: 20
  readinessInitialDelay: 10
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
env: {}
existingSecret: ""
networkPolicy: {egress: []}

# ── Auth ──────────────────────────────────────────────────────────────────────
# The portal is NOT an OIDC client. It was one (Auth.js, `ds-portal`, its own
# AUTH_SECRET); that client no longer exists in the realm and the app no longer
# reads those variables. Human login belongs to the ds-oauth2-proxy release.
auth:
  serviceClientId: svc-ds-portal # server-side API calls

  # Fronting the portal with oauth2-proxy via the ingress controller's
  # `auth-url`. **Disabling this does not fall back to the portal's own login —
  # there is none.** It leaves the portal open, and leaves the
  # `X-Auth-Request-*` headers it reads client-controlled. Turn it off only when
  # something else in the request path performs both jobs, and say what.
  proxy:
    enabled: true
    # Derived from the release name and namespace when empty.
    authUrl: ""
    signinUrl: ""
    # The port `ds-oauth2-proxy` listens on, used to build `authUrl` above.
    #
    # It is a **cross-chart constant**: the listener belongs to a different
    # release, so this chart cannot read that chart's `service.port`, and the
    # value was a bare `4180` inside a `printf`. Named here so the two are
    # changed together — an `auth-url` whose backend does not resolve fails
    # **closed**, and every request to the portal 500s.
    port: 4180
    # The proxy's Keycloak client id — the second cross-chart constant, and set
    # here for the same reason as the port: it belongs to the `ds-oauth2-proxy`
    # release (`auth.clientId`) and this chart cannot read it.
    #
    # Sign-out is the only thing that needs it (`REV-04`). The portal sends the
    # browser to the realm's `end_session` endpoint naming this client, and
    # Keycloak validates the return URI against *that* client's registered
    # post-logout URIs. Rename the client in one place only and sign-out stops at
    # a Keycloak error page — the SSO session survives, which is the defect the
    # whole chain exists to prevent. See docs/deployment/keycloak.md for the
    # registration this assumes.
    clientId: oauth2_proxy

# The dataset-api is external in production (no chart ships it), so it cannot be
# derived. Leave empty and the catalogue detail view, /my-data's "data held about
# you" list and the health page's dataset-api probe are unavailable — the portal
# has no in-cluster address to fall back to.
datasetApi:
  url: "" # e.g. https://datasets.internal.example.org

# ── Consumer-side wiring ──────────────────────────────────────────────────────
# The /consumer/* routes drive a connector and name a counterparty. Defaults
# target this participant's own connector, which is the per-participant reading
# of the compose topology (where one portal fronted both stacks).
consumer:
  # Override only when this portal drives a different participant's connector.
  connectorUrl: ""
  # The provider this participant negotiates with by default. Used only when the
  # catalogue entry carries no assigner or counter-party address of its own.
  defaultAssigner: ""
  defaultCounterPartyAddress: ""

ingress:
  enabled: true

  # Paths served with NO auth wall, as a second Ingress on the same host that
  # simply omits the auth annotations. Adding a path here is a deliberate hole,
  # so each one states why it cannot sit behind the wall:
  #
  #   /join            an organisation applying to join HAS no account yet. The
  #                    invite code is its only credential, and the login form it
  #                    would be bounced to is for an account that does not exist
  #                    (`routes/join/+page.server.ts` says so in as many words).
  #   /_app/immutable  SvelteKit's content-hashed build output. Gating it leaves
  #                    /join rendering without its stylesheet or scripts — the
  #                    one page a stranger is meant to see, broken. Same call,
  #                    and the same reason, as celine-dev's onboarding host.
  #
  # `/_app/immutable`, NOT `/_app`: adapter-node also serves `/_app/env.js`,
  # generated at runtime from `PUBLIC_*`, and `/_app/version.json`. Neither is
  # needed by an anonymous browser here — no client-side module imports
  # `$env/dynamic/public` (only `lib/server/*` does) — so both stay walled.
  #
  # What is deliberately NOT here, though dev's Caddy carves them out:
  # `/metrics` (Prometheus scrapes in-cluster) and the four `/api/*` prefixes
  # (the portal is SSR and calls those services over cluster DNS; publishing
  # them would contradict docs/deployment/exposure.md, and a repo-wide
  # grep finds no caller of any of the four).
  publicPaths:
    - /join
    - /_app/immutable

secrets:
  portalServiceClientSecret: "" # svc-ds-portal

global:
  baseDomain: ds.example.org
  hosts: {portal: portal}
  image: {registry: ghcr.io/spindoxlabs, prefix: ds-, tag: "", pullPolicy: IfNotPresent, pullSecrets: []}
  namespaces: {authority: ds-authority}
  keycloak: {realm: dataspaces, issuerUrl: ""}
  ingress:
    className: nginx
    annotations: {}
    tls: {clusterIssuer: "", secretName: ""}
  networkPolicy: {enabled: true}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
