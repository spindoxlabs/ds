{{- if eq (include "ds.createSecret" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ds.fullname" . }}
  labels:
    {{- include "ds.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The portal holds exactly one credential now: its service client, for the
  # server-side API calls its pages make. Session encryption and the OIDC client
  # secret moved to ds-oauth2-proxy with the login surface itself.
  PORTAL_SERVICE_CLIENT_SECRET: {{ required "secrets.portalServiceClientSecret is required" .Values.secrets.portalServiceClientSecret | quote }}
{{- end }}
