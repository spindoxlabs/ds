{{- if eq (include "ds.createSecret" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ds.fullname" . }}
  labels:
    {{- include "ds.labels" . | nindent 4 }}
type: Opaque
stringData:
  # A known cookie secret means forgeable sessions for every human in the
  # deployment — `required` rather than a default, because a weak default here
  # is indistinguishable from a strong one until someone forges a cookie.
  OAUTH2_PROXY_COOKIE_SECRET: {{ required "secrets.cookieSecret is required — 32 random bytes, base64" .Values.secrets.cookieSecret | quote }}
  OAUTH2_PROXY_CLIENT_SECRET: {{ required "secrets.clientSecret is required — the realm's oauth2_proxy client secret" .Values.secrets.clientSecret | quote }}
{{- end }}
