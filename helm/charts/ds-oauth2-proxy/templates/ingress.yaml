{{- if .Values.ingress.enabled }}
{{- $host := include "oauth2proxy.host" . }}
# =============================================================================
# /oauth2/* on the **portal's** host — sign-in, callback and sign-out.
#
# This is a second Ingress for a host the portal chart also serves. nginx merges
# rules per host and matches the longest prefix, so /oauth2/* lands here and
# everything else lands on the portal. It must NOT carry the portal's auth
# annotations: sending the login endpoints through the auth subrequest is a
# redirect loop, since a user arrives here precisely because they have no session.
#
# The TLS block is deliberately omitted — the portal's Ingress owns the
# certificate for this host, and two Ingresses issuing for one host race for the
# same solver.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ds.fullname" . }}
  labels:
    {{- include "ds.labels" . | nindent 4 }}
  {{- with ((.Values.global).ingress).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ ((.Values.global).ingress).className | default "nginx" }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: {{ include "ds.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
