{{- if ((.Values.global).networkPolicy).enabled }}
{{ include "ds.networkPolicy.defaultDeny" . }}
---
# Reached two ways, and both are ingress-controller traffic: the browser hitting
# /oauth2/* through the Ingress above, and nginx's own auth subrequest for the
# portal. Same source, so one rule covers both.
{{ include "ds.networkPolicy.fromIngressController" (dict "ctx" . "ports" (list .Values.service.port)) }}
---
# Egress: OIDC discovery, the token endpoint and JWKS at Keycloak, over TLS.
# Keycloak is external to the cluster in every posture (`global.keycloak` is an
# issuer URL, never a chart), so this is a plain 443 egress rather than a
# namespace selector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ds.fullname" . }}-egress
  labels:
    {{- include "ds.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ds.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              # The cloud metadata service — a proxy that can be made to fetch
              # arbitrary URLs must never reach instance credentials.
              - 169.254.169.254/32
      ports:
        - {protocol: TCP, port: 443}
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
