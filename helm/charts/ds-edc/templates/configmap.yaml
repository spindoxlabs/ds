{{- $did := include "edc.did" . -}}
{{- $host := include "edc.host" . -}}
{{- $ir := include "edc.irBase" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ds.fullname" . }}
  labels:
    {{- include "ds.labels" . | nindent 4 }}
data:
  # Production render of services/connector/config/<role>.properties. The
  # committed dev files carry *.localhost hosts, plaintext did:web and superuser
  # DB creds; nothing from them is mounted here.
  #
  # Secrets are NOT written here as ${PLACEHOLDER}: EDC's FsConfigurationExtension
  # is a plain Properties.load() with no interpolation, so a ${...} would be
  # stored verbatim. EDC does read the environment as config, converting
  # ENVIRONMENT_NOTATION to dot.notation (ConfigurationLoader →
  # ConfigFactory.fromEnvironment), so every secret-bearing setting is supplied
  # that way from the Secret and simply omitted from this file:
  #   WEB_HTTP_MANAGEMENT_AUTH_KEY        → web.http.management.auth.key
  #   EDC_DATASOURCE_DEFAULT_USER         → edc.datasource.default.user
  #   EDC_DATASOURCE_DEFAULT_PASSWORD     → edc.datasource.default.password
  #   DS_CONNECTOR_INTERNAL_CLIENT_SECRET → ds.connector.internal.client.secret
  edc.properties: |
    edc.participant.id={{ $did }}
    edc.iam.issuer.id={{ $did }}
    edc.hostname={{ $host }}

    # ── Web contexts ──────────────────────────────────────────────────────────
    web.http.port={{ .Values.ports.api }}
    web.http.path=/api
    web.http.management.port={{ .Values.ports.management }}
    web.http.management.path=/management
    # `auth.type` is what installs the authentication filter — EDC registers one
    # only for contexts that declare a type, so `auth.key` on its own leaves the
    # Management API (assets, policies, transfer termination, negotiation resume)
    # open to anything that can reach the port.
    web.http.management.auth.type=tokenbased
    web.http.protocol.port={{ .Values.ports.protocol }}
    web.http.protocol.path=/protocol
    web.http.control.port={{ .Values.ports.control }}
    web.http.control.path=/control
    # Data-plane signalling, data-plane self-registration and the control-plane
    # callback. Without a type there is no filter, and `GET /control/v1/dataplanes`
    # answered the full data-plane registry to anything that could reach the port.
    # Safe to enforce because the data-plane client is embedded in this runtime —
    # the control plane signals its own data plane in-process, not over this port.
    # Key from WEB_HTTP_CONTROL_AUTH_KEY, its own secret, not EDC_API_KEY's.
    web.http.control.auth.type=tokenbased
    # There is no `public` or `version` context, and adding one back would bind a
    # port with nothing behind it: `ApiContext` in this runtime declares only
    # MANAGEMENT, CONTROL and PROTOCOL, no data-plane public API is packaged, and
    # the management Version API registers on the default context.

    # ── DSP addressing (what remote participants dial) ────────────────────────
    edc.dsp.callback.address=https://{{ $host }}/protocol
    {{- with .Values.edrPublicBaseUrl }}

    # Rewrites the origin of an asset's own `base_url` into an address the
    # consumer can reach. This is the DATASET API, not this EDC: consumer-pull
    # traffic goes straight to the data plane and never through the connector.
    # Setting it to https://<host>/public — as this chart used to — pointed every
    # EDR at a port no module listens on.
    ds.edr.endpoint.public.baseurl={{ . }}
    {{- end }}

    edc.transfer.proxy.token.signer.privatekey.alias=participant-private-key
    edc.transfer.proxy.token.verifier.publickey.alias=participant-private-key

    # This participant's ds-connector (in-cluster): /internal/* during ODRL
    # policy evaluation, and /webhooks/contract-negotiation, which the extension
    # posts to directly. There is no callback-URL setting — EDC 0.16.0 has no
    # `edc.receiver.http.*`, and the static-callback extension would need a
    # fourth shared secret to authenticate.
    ds.connector.internal.url=http://{{ include "edc.connectorService" . }}:{{ .Values.connectorPort }}

    # How this EDC authenticates to ds-connector: its own Keycloak client
    # (connector.internal + connector.webhook), not EDC_API_KEY. That key is the
    # Management API key above, and sharing it across both boundaries meant one
    # leak yielded contract administration, the data-plane signing keys and the
    # subject pools together. The extension refuses to start without these.
    ds.connector.internal.token.url={{ required "keycloak.tokenUrl is required" ((.Values.global).keycloak).tokenUrl }}
    ds.connector.internal.client.id={{ .Values.connectorClientId }}

    # ── Vault (mounted from the Secret, not the committed dev fixture) ─────────
    edc.vault.fs.file=/config/vault.properties

    # ── DCP / STS / credential service (via identity-registry) ────────────────
    edc.iam.sts.oauth.token.url={{ $ir }}/sts/{{ $did }}/token
    edc.iam.sts.oauth.client.id={{ $did }}
    edc.iam.sts.oauth.client.secret.alias=sts-client-secret
    # No `edc.credential.service.url`: read by no class in connector.jar. A
    # counterparty finds this participant's credential service through the
    # `CredentialService` entry in its DID document, which identity-registry
    # publishes and the `-dcp` Ingress below routes.
    edc.iam.trusted-issuer.0.id={{ include "edc.trustAnchorDid" . }}
    edc.iam.dcp.scopes.membership.id=membership
    edc.iam.dcp.scopes.membership.type=default
    edc.iam.dcp.scopes.membership.value=org.eclipse.dspace.dcp.vc.type:MembershipCredential:read
    edc.iam.dcp.scopes.membership.profile=*

    # did:web resolution over HTTPS — a DID document carries trust keys.
    edc.iam.did.web.use.https={{ .Values.didWebUseHttps }}

    # ── PostgreSQL ────────────────────────────────────────────────────────────
    edc.datasource.default.url=jdbc:postgresql://{{ ((.Values.global).postgres).host }}:{{ ((.Values.global).postgres).port }}/{{ include "ds.db.edc" . }}?sslmode={{ ((.Values.global).postgres).sslMode | default "require" }}
    edc.datasource.default.pool.maxIdleConnections=3
    edc.datasource.default.pool.maxTotalConnections=10
    edc.datasource.default.pool.testConnectionOnReturn=true
    edc.sql.schema.autocreate={{ .Values.sqlSchemaAutocreate }}
