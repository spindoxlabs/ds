{{- $did := include "edc.did" . -}}
{{- $host := include "edc.host" . -}}
{{- $ir := include "edc.irBase" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ds.fullname" . }}
  labels:
    {{- include "ds.labels" . | nindent 4 }}
data:
  # Production render of services/connector/config/<role>.properties. The
  # committed dev files carry *.localhost hosts, plaintext did:web and superuser
  # DB creds; nothing from them is mounted here.
  #
  # Secrets are NOT written here as ${PLACEHOLDER}: EDC's FsConfigurationExtension
  # is a plain Properties.load() with no interpolation, so a ${...} would be
  # stored verbatim. EDC does read the environment as config, converting
  # ENVIRONMENT_NOTATION to dot.notation (ConfigurationLoader →
  # ConfigFactory.fromEnvironment), so every secret-bearing setting is supplied
  # that way from the Secret and simply omitted from this file:
  #   EDC_DATASOURCE_DEFAULT_USER         → edc.datasource.default.user
  #   EDC_DATASOURCE_DEFAULT_PASSWORD     → edc.datasource.default.password
  #   DS_CONNECTOR_INTERNAL_CLIENT_SECRET → ds.connector.internal.client.secret
  edc.properties: |
    edc.participant.id={{ $did }}
    edc.participant.did={{ $did }}
    # The context id is the DID, as in the dev configs: the value the classic
    # runtime already stamped on every stored entity, and the `sub` the
    # organisation's Keycloak client carries (`svc-ds-connector-<alias>`).
    edc.participant.context.id={{ $did }}
    edc.hostname={{ $host }}

    # ── Web contexts ──────────────────────────────────────────────────────────
    web.http.port={{ .Values.ports.api }}
    web.http.path=/api
    web.http.management.port={{ .Values.ports.management }}
    web.http.management.path=/management
    # v5 behind OAuth2 (`management-api-oauth2-authentication` +
    # `management-api-authorization`): signature against the realm's JWKS, the
    # issuer, `nbf`/`exp` — never `aud` — then `sub` must name this participant
    # context and `scope` must satisfy the route. No `auth.type`: beside the OAuth2
    # filters it would demand an `x-api-key` as well. Who holds a
    # `management-api:*` scope is therefore the whole boundary; see
    # docs/services/keycloak.md, "Organisation clients".
    # `iss` is compared as a string; Keycloak never ends it with a slash.
    edc.iam.oauth2.issuer={{ required "global.keycloak.issuerUrl is required" ((.Values.global).keycloak).issuerUrl | trimSuffix "/" }}
    edc.iam.oauth2.jwks.url={{ ((.Values.global).keycloak).jwksUrl | default (printf "%s/protocol/openid-connect/certs" (((.Values.global).keycloak).issuerUrl | trimSuffix "/")) }}
    # v5 refuses a request whose `protocol` is not an enabled dataspace profile.
    # All: the runtime registers exactly one (DSP 2025-1), and naming it here would
    # be a second copy of the pin `ds_edc.DATASPACE_PROTOCOL`.
    edc.dataspace.enable.profiles.all=true
    web.http.protocol.port={{ .Values.ports.protocol }}
    web.http.protocol.path=/protocol
    web.http.control.port={{ .Values.ports.control }}
    web.http.control.path=/control
    # Data-plane signalling, data-plane self-registration and the control-plane
    # callback. Without a type there is no filter, and `GET /control/v1/dataplanes`
    # answered the full data-plane registry to anything that could reach the port.
    # Safe to enforce because the data-plane client is embedded in this runtime —
    # `LegacyDataPlaneSignalingClientExtension` returns an `EmbeddedDataPlaneClient`
    # whenever a `DataPlaneManager` is in the same runtime, so the control plane
    # signals its own data plane in-process, not over this port. That stays true at
    # 0.18.0 **because the connector excludes the DPS modules** — see
    # `services/edc-connector/build.gradle.kts`; adopt DPS and this stops being true.
    # Key from WEB_HTTP_CONTROL_AUTH_KEY, its own secret.
    web.http.control.auth.type=tokenbased
    # There is no `public`, `version` or `signaling` context, and adding one back
    # would bind a port with nothing behind it: with the DPS modules excluded,
    # `ApiContext` in this runtime serves only MANAGEMENT, CONTROL and PROTOCOL,
    # no data-plane public API is packaged, and the management Version API
    # registers on the default context.

    # ── DSP addressing (what remote participants dial) ────────────────────────
    edc.dsp.callback.address=https://{{ $host }}/protocol
    {{- with .Values.edrPublicBaseUrl }}

    # Rewrites the origin of an asset's own `base_url` into an address the
    # consumer can reach. This is the DATASET API, not this EDC: consumer-pull
    # traffic goes straight to the data plane and never through the connector.
    # Setting it to https://<host>/public — as this chart used to — pointed every
    # EDR at a port no module listens on.
    ds.edr.endpoint.public.baseurl={{ . }}
    {{- end }}

    edc.transfer.proxy.token.signer.privatekey.alias=participant-private-key
    edc.transfer.proxy.token.verifier.publickey.alias=participant-private-key

    # This participant's ds-connector (in-cluster): /internal/* during ODRL
    # policy evaluation, and /webhooks/contract-negotiation, which the extension
    # posts to directly. There is no callback-URL setting — EDC 0.18.0 has no
    # `edc.receiver.http.*`, and the static-callback extension would need a
    # fourth shared secret to authenticate.
    ds.connector.internal.url=http://{{ include "edc.connectorService" . }}:{{ .Values.connectorPort }}

    # How this EDC authenticates to ds-connector: its own Keycloak client
    # (connector.internal + connector.webhook). It used to be the Management API
    # key, and sharing one value across both boundaries meant one leak yielded
    # contract administration, the data-plane signing keys and the subject pools
    # together. The extension refuses to start without these.
    ds.connector.internal.token.url={{ required "keycloak.tokenUrl is required" ((.Values.global).keycloak).tokenUrl }}
    ds.connector.internal.client.id={{ .Values.connectorClientId }}

    # ── Vault (mounted from the Secret, not the committed dev fixture) ─────────
    ds.vault.seed.file=/config/vault.properties

    # ── DCP / STS / credential service (via identity-registry) ────────────────
    edc.iam.sts.oauth.token.url={{ $ir }}/sts/{{ $did }}/token
    edc.iam.sts.oauth.client.id={{ $did }}
    edc.iam.sts.oauth.client.secret.alias=sts-client-secret
    # No `edc.credential.service.url`: read by no class in connector.jar. A
    # counterparty finds this participant's credential service through the
    # `CredentialService` entry in its DID document, which identity-registry
    # publishes and the `-dcp` Ingress below routes.
    edc.iam.trustedissuer.0.id={{ include "edc.trustAnchorDid" . }}
    edc.iam.dcp.scopes.membership.id=membership
    edc.iam.dcp.scopes.membership.type=default
    edc.iam.dcp.scopes.membership.value=org.eclipse.dspace.dcp.vc.type:MembershipCredential:read
    edc.iam.dcp.scopes.membership.profile=*

    # ── How fast a suspension is seen ─────────────────────────────────────────
    # Membership is a claim on a credential EDC has already verified, so nothing
    # is asked per negotiation and nothing has to be invalidated. What bounds
    # *deactivation* is the StatusList2021 register cache: EDC runs `IsNotRevoked`
    # against the anchor's registers and holds each fetched register this long.
    # **Milliseconds; EDC's default is 15 minutes**, which would be a fifteen-fold
    # regression on the 60 s decision cache the retired HTTP membership check had.
    # The cost of the lower value is one conditional GET per register per runtime
    # per window against a static signed document — not per negotiation and not
    # per counterparty. See ADR-0016.
    edc.iam.credential.revocation.cache.validity={{ .Values.revocationCacheValidityMs }}

    # did:web resolution over HTTPS — a DID document carries trust keys.
    edc.iam.did.web.use.https={{ .Values.didWebUseHttps }}

    # ── EDC's own federated catalogue crawler — off ───────────────────────────
    # `controlplane-base-bom` pulls in `catalog-crawler-core` from EDC 0.18.0 and
    # it defaults to enabled: 2 crawler threads on a 60-second tick, with
    # in-memory cache and node-directory defaults, so the runtime boots and
    # crawls rather than failing. ds's federated catalogue is
    # `services/federated-catalog`; this one is off explicitly rather than by
    # relying on the target-node directory staying empty.
    edc.catalog.cache.execution.enabled=false

    # ── Consent revocation: how fast a running transfer is torn down (`D-17`) ──
    # **0.18.0 made this setting mean what it says.** At 0.16.0 the policy
    # monitor was a state machine swept on its iteration wait, so a withdrawal
    # terminated the transfer in ~3s while `edc.policy.monitor.period` (PT1H)
    # governed nothing. 0.18.0 rewrote it as a watchdog on exactly this period.
    # Unset, revocation still stops data immediately — the per-query gate reads
    # the consent table — but the transfer process survives up to an hour, which
    # is the half of `D-17` that says revocation ends a *running* transfer.
    # Raise it only with an argument about the Art. 7(3) obligation, not load.
    edc.policy.monitor.period={{ .Values.policyMonitorPeriod | default "PT5S" }}

    # ── PostgreSQL ────────────────────────────────────────────────────────────
    edc.datasource.default.url=jdbc:postgresql://{{ ((.Values.global).postgres).host }}:{{ ((.Values.global).postgres).port }}/{{ include "ds.db.edc" . }}?sslmode={{ ((.Values.global).postgres).sslMode | default "require" }}
    edc.datasource.default.pool.connections.max-idle=3
    edc.datasource.default.pool.connections.max-total=10
    edc.datasource.default.pool.connection.test.on-return=true
    edc.sql.schema.autocreate={{ .Values.sqlSchemaAutocreate }}
