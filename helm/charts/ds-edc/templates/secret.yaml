{{- if eq (include "ds.createSecret" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ds.fullname" . }}
  labels:
    {{- include "ds.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Projected into the pod under EDC's ENVIRONMENT_NOTATION names (see the
  # deployment), which EDC maps to dot.notation settings. NOT substituted into
  # edc.properties — EDC does not interpolate that file.
  # No management API key: the management context authenticates OAuth2 tokens
  # (edc.iam.oauth2.* in the ConfigMap).
  #
  # The control API's key. Nothing outside the pod holds it — the control plane
  # signals its own data plane in-process — so this is a value to generate and
  # forget, not one to distribute.
  EDC_CONTROL_API_KEY: {{ required "secrets.edcControlApiKey is required" .Values.secrets.edcControlApiKey | quote }}
  # The data-plane signalling API's key. EDC 0.18.0 moved that API off the
  # control context onto one of its own, so EDC_CONTROL_API_KEY above stopped
  # covering it. Same character as that one: generate and forget, never
  # distributed.
  # This EDC's own Keycloak client secret (svc-edc), for ds-connector's
  # /internal/* and /webhooks/*. Its own client: one credential across the
  # management API and the internal API once meant a single leak yielded
  # contract administration, the data-plane signing keys and the subject pools
  # together.
  DS_CONNECTOR_CLIENT_SECRET: {{ required "secrets.connectorClientSecret is required" .Values.secrets.connectorClientSecret | quote }}
  EDC_DB_USER: {{ .Values.secrets.dbUser | default (include "ds.db.edc" .) | quote }}
  EDC_DB_PASSWORD: {{ required "secrets.dbPassword is required" .Values.secrets.dbPassword | quote }}
  # The EDC filesystem vault, rendered from generated key material. Referenced
  # by alias from edc.properties. The committed dev fixture with its published
  # key and `insecure-dev-secret` is never mounted.
  vault.properties: |
    sts-client-secret={{ required "secrets.stsClientSecret is required" .Values.secrets.stsClientSecret }}
    participant-private-key={{ required "secrets.edrSigningPrivateJwk is required" .Values.secrets.edrSigningPrivateJwk }}
    # The header value EDC sends when it delivers an EDR to this participant's
    # connector (the transfer's callback address names this alias). The
    # ds-connector chart holds the same value as `secrets.edcCallbackKey`.
    ds-connector-callback-key={{ required "secrets.edcCallbackKey is required" .Values.secrets.edcCallbackKey }}
{{- end }}
