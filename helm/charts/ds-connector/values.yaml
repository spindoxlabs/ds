# Chart defaults. Real values arrive from helm/values.yaml via helmfile.

service:
  name: connector # → ghcr.io/spindoxlabs/ds-connector
  port: 30001
  healthPath: /health

replicaCount: 1

participant:
  name: provider
  role: provider # provider | consumer | both
  did: "" # "" → did:web:<name>.<baseDomain>

# The dataspace this participant belongs to, as the trust anchor signs it into
# every MembershipCredential's `memberOf`. "" → https://<global.baseDomain>/dataspace,
# the same expression ds-identity-registry uses, so the two agree by default.
# A mismatch denies every negotiation.
dataspaceUri: ""

image: {registry: "", repository: "", tag: "", digest: "", pullPolicy: ""}
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount: {create: true, name: ""}
podSecurityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
containerSecurityContext: {readOnlyRootFilesystem: true}
resources: {}
probes: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
env: {}
existingSecret: ""
networkPolicy:
  egress: []
  # Who else may call this connector, beyond its own portal, EDC and sync Job
  # (chart parity row 8). The host platform's consent writer and data plane run
  # in a namespace of their own; each entry admits exactly that namespace — and,
  # with `podLabels`, exactly those pods — on the service port. `namespace` is
  # required: an entry without one would be an empty selector, which admits
  # every namespace.
  #   - {namespace: host-platform, podLabels: {app.kubernetes.io/name: dataset-api}}
  ingressFrom: []

migration:
  enabled: true
  mode: initContainer

# ── Data source ───────────────────────────────────────────────────────────────
# The dataset API is participant-operated and NOT deployed by these charts. It
# is deliberately absent from this chart's values: the connector never calls it.
# The traffic goes the other way — the dataset API authenticates to
# /internal/dataplane/authorize with a **Keycloak bearer** carrying
# `connector.internal` (`svc-ds-dataset-api`), and the address a consumer is
# handed comes from governance.yaml's data_address.base_url.
#
# It is no longer the EDC API key. That branch is deleted: `/internal/*` used to
# also accept `X-Api-Key` equal to `EDC_API_KEY`, which meant one leaked value
# yielded contract administration, the data-plane signing keys and the subject
# pools at once, with every caller authenticating as the same anonymous bearer.

# ── EDC wiring ────────────────────────────────────────────────────────────────
# In-cluster address of this participant's ds-edc release.
edc:
  serviceName: "" # "" → "<release>-ds-edc" in this namespace
  # Management only. The public DSP protocol URL is not configured here: other
  # participants reach it through the ds-edc Ingress, and this connector resolves
  # a counter-party by DSP address through the identity registry.
  managementPort: 19193
  # The v5 path segment: `v5beta` on EDC 0.18.0, `v5` from 0.19.
  managementApiVersion: v5beta

# This participant's organisation client — its connector's credential for
# everything it calls. "" → svc-ds-connector-<participant.name>; set it when the
# organisation's owner alias differs from the participant name.
clientId: ""

# ── Trust anchor ──────────────────────────────────────────────────────────────
# did:web of the trust anchor; "" → did:web:<trustAnchor host>.<baseDomain>.
#
# **Named, not mounted** (`DID-17`). Its signing key is resolved from that DID's
# document at request time and cached, so rotating the anchor's key no longer
# means redeploying every service that held a copy of it.
#
# `trustListUrl` is the dataspace's list of accredited issuers (`DSSC-TRF-05`);
# "" → https://<trustAnchor host>.<baseDomain>/trust. Resolution proves who
# signed a credential, the list proves the dataspace still stands behind them —
# a withdrawn accreditation is invisible without it.
# did:web internal allowance (ADR-0029). The issuer of a person's credential is
# resolved over did:web, and under DS_ENV=production only public addresses are
# dialled. Where the cluster resolves the dataspace's own hosts to a private address,
# list those hosts' suffixes AND the networks they may resolve to (both or neither;
# the render fails otherwise). Link-local, multicast, reserved and unspecified stay
# refused; any other host is unaffected. The helmfile forwards the dataspace's
# authority.identityRegistry.didWeb here; a participant's own block overrides it.
#   internalHosts: [.ds.example.org]
#   internalNetworks: [192.168.1.10/32]
didWeb:
  internalHosts: []
  internalNetworks: []

trustAnchor:
  did: ""
  trustListUrl: ""
  # The anchor's credential status registers (R3) — **required**: the service
  # refuses to start without it, because a verifier that reads no register
  # never sees a revocation. "" → https://<trustAnchor host>.<baseDomain>/status/1.
  # It pins the origin; each credential names its own register and bit.
  credentialStatusUrl: ""
  # How long a verified register is reused — the revocation latency. "" keeps
  # the service default (900 s, EDC's revocation cache).
  credentialStatusCacheSeconds: ""

# The person routes require the person's own Keycloak login token, bound to the
# credential's subject (R3, ADR-0024). "" leaves it unset, which is **required**
# under the chart's DS_ENV=production. `false` is the transition switch for a
# caller that does not forward the person's token yet; the service logs it.
personTokenRequired: ""

# ── Governance ────────────────────────────────────────────────────────────────
governance:
  overlayName: "" # merges governance.<name>.yaml
  # "" → **no governance is mounted at all**, and the catalogue is empty.
  # There is no "image's baked-in governance.yaml": the Dockerfile copies
  # `libs/governance/` (the Python package) and the service source, never a
  # governance *file*. `GovernanceResolver` tolerates a missing path and
  # returns nothing, so a provider deployed without this publishes no assets
  # and nothing reports it. A provider-role participant needs this set.
  configMap: ""
  mountPath: /governance
  # The deployment's own ODRL profile, a key of `configMap`. "" → ds's bundled
  # profile, under which every offer naming a deployment-added purpose stops
  # publishing. The connector refuses to start on a path that does not exist.
  odrlProfileFile: ""
  # A digest of the assembled governance, rendered as the pod annotation
  # `checksum/governance`. The ConfigMap is the deployment's, so a governance
  # change with unchanged values otherwise rolls nothing and — the helmfile
  # seeing no diff — re-runs no sync. With it, a governance change is a rollout,
  # and the post-upgrade hook publishes it.
  checksum: ""

# ── EDR verification key (GET /internal/edr-jwks) ─────────────────────────────
# A data plane verifies the EDR it is handed against the public half of the key
# this participant's EDC signs with (chart parity OQ1, option b). It arrives as
# `secrets.edrPublicJwk` in this release's own Secret — never the ds-edc Secret,
# so this pod holds no private material — and is mounted as a one-line vault
# file the connector already reads. Required for a provider.
edr:
  # `edc.transfer.proxy.token.signer.privatekey.alias` in the ds-edc chart. The
  # connector publishes it as the JWK's `kid`, because EDC stamps it into the
  # token header.
  signerAlias: participant-private-key
  mountPath: /edr

# ── Publishing (POST /provider/sync) ──────────────────────────────────────────
# Who turns this participant's governance into EDC assets, policies and contract
# definitions, and when.
#
# ds has always treated the sync as part of *starting* a provider — the Taskfile
# posts it right after the connector's health check — and the charts had no
# equivalent, so a provider could be installed, healthy, registered and reachable
# with an **empty catalogue** and nothing would report it. This is a
# post-install/post-upgrade hook Job, and it is rendered only for a
# provider-role participant that has `governance.configMap` set: a consumer
# publishes nothing, and a provider with no governance mounted has nothing to
# publish.
#
# **Identity.** By default the participant's own organisation client
# (`clientId`), which is already in this release's Secret and which the
# connector's perimeter binds to this participant. Set `sync.clientId` to
# `svc-ds-publisher` — plus `secrets.publisherSecret` — where the credential that
# drives a deployment should not also carry `management-api:*`; that client holds
# `connector.provider.read` + `.write` and nothing else.
sync:
  enabled: true
  # "" → the organisation client in `clientId`. Naming one here switches the job
  # to `secrets.publisherSecret`.
  clientId: ""
  # How long to wait for the connector to answer /health before giving up. The
  # hook runs after the rollout, so this covers the rollout's tail, not a cold
  # start.
  timeoutSeconds: 60
  backoffLimit: 3
  ttlSecondsAfterFinished: 600

# ── Semantic vocabularies (GET /ns/{slug}) ────────────────────────────────────
# The models a dataset's `dcat.conforms_to` points at — SAREF, CIM, COSEM.
#
# **The pod refuses to start** if a registered vocabulary has no local copy and
# cannot be fetched. Nothing is registered by default, so this costs a default
# install nothing; the two ways to satisfy it are below and they are a real
# choice, not a default to accept blindly.
vocabularies:
  # ConfigMap carrying vocabularies.yaml. "" → nothing registered, and none of
  # the rest of this block applies.
  configMap: ""
  mountPath: /vocabularies
  cache:
    # ConfigMap carrying the pre-fetched `<slug>.jsonld` copies.
    #
    # **Set this and the pod never reaches the internet at startup** — the copies
    # are already there, mounted read-only, and the whole thing is reproducible
    # from git. This is the right choice for a cluster with restricted egress or
    # a GitOps flow, and it is the one to prefer. Build it with
    # `task vocab:fetch` then `kubectl create configmap … --from-file`.
    #
    # Leave it empty and the cache is an emptyDir the pod fills at startup, which
    # means **every pod start depends on the vocabulary sources being reachable**
    # — a new replica, a node drain or a rollout can fail on somebody else's
    # outage. ConfigMaps cap around 1 MiB, which is the reason not to.
    configMap: ""
    mountPath: /data/vocabularies

# ── Consent notifications ─────────────────────────────────────────────────────
# Webhook URLs are rejected unless their host is allowlisted (SSRF guard).
notify:
  # Empty means none. **Not the string "null"** — that is what this was, and
  # `build_notifier` splits this value on commas and matches each part against
  # "smtp" and "webhook", so "null" fell to the unknown-backend branch and every
  # deployment logged `Unknown notification backend 'null' — skipped` at startup
  # before falling through to the NullNotifier it wanted anyway.
  backends: "" # "" | smtp | webhook (comma-separated)
  webhookAllowedHosts: [] # required if backends includes webhook
  portalBaseUrl: "" # "" → https://<portal host>.<baseDomain>

secrets:
  dbUser: ""
  dbPassword: ""
  clientSecret: "" # the organisation client's Keycloak secret (svc-ds-connector-<alias>)
  # Only when `sync.clientId` names a separate publisher (svc-ds-publisher).
  # Unused otherwise, and required when it is set.
  publisherSecret: ""
  edcCallbackKey: "" # EDR callback header value; same as ds-edc secrets.edcCallbackKey
  # Seal a subject's data keys and every stored EDR at rest. A Fernet key list
  # (newest first) and the blind-index HMAC secret. Both required.
  atRestKeys: ""
  keyIndexSecret: ""
  # The PUBLIC half of this participant's EDR signing key: the ds-edc release's
  # `edrSigningPrivateJwk` without `d`. A `d` here fails the render. With
  # `existingSecret`, that Secret carries it as `edr-verification.properties`
  # (`<edr.signerAlias>=<public JWK on one line>`).
  edrPublicJwk: ""

# ── helm test ─────────────────────────────────────────────────────────────────
# `helm test` reads the catalogue as this participant's organisation client and
# compares its size with what the mounted governance exposes. Rendered for a
# provider with governance. `tlsVerify: false` only for a rehearsal cluster with
# a private CA.
tests:
  enabled: true
  tlsVerify: true
  imageTag: ""

global:
  baseDomain: ds.example.org
  hosts: {portal: portal, trustAnchor: trust-anchor}
  image: {registry: ghcr.io/spindoxlabs, prefix: ds-, tag: "", pullPolicy: IfNotPresent, pullSecrets: []}
  namespaces: {authority: ds-authority}
  postgres:
    host: ds-pg-rw.database.svc.cluster.local
    port: 5432
    sslMode: require
    databases: {connectorPrefix: connector}
  keycloak: {issuerUrl: "", tokenUrl: ""}
  networkPolicy: {enabled: true}
  monitoring: {serviceMonitor: false, prometheusNamespace: monitoring}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 512Mi}
