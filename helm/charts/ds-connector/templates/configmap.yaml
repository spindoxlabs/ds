{{- /*
ds3: the participant's governance, rendered from the content the deployment passes
(`governance.files`). The pod's checksum/governance is a digest of the same content
(deployment.yaml), so a governance change is a rollout and the post-upgrade sync
publishes it, with no digest for the deployment to keep in step.
*/}}
{{- if .Values.governance.files }}
{{- $_ := include "conn.governanceConfigMap" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ds.fullname" . }}-governance
  labels:
    {{- include "ds.labels" . | nindent 4 }}
data:
  {{- range $key, $content := .Values.governance.files }}
  {{ $key | quote }}: {{ toString $content | quote }}
  {{- end }}
{{- end }}
