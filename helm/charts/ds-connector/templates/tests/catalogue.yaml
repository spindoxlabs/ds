{{- /*
`helm test`: the catalogue is what the governance says it is (the local
doctor's `<p> catalogue` row, plus `local:publish`'s read-back).

Reads `/provider/assets` as this participant's organisation client (it holds
`connector.provider.read` by default) and compares the asset ids offered with the
ids of the datasets the mounted governance exposes, through the connector's own
`load_exposed_datasets` — the function the sync publishes from — and
`asset_id_for`, which names each asset. **The two must match, and that is the
whole test**: an asset the governance does not expose (a leftover, or exposed by
nobody's decision) fails, and so does an exposed dataset the sync did not
publish. Nothing exposed and nothing offered is a correct state, not a failure —
a deployment can offer nothing on purpose (an empty catalogue failed this test
until 2026-10-18, whatever the configuration said).
*/}}
{{- $provider := has .Values.participant.role (list "provider" "both") }}
{{- if and .Values.tests.enabled $provider (include "conn.governanceConfigMap" .) }}
{{- $script := `
import os, sys
import httpx
from connector.services.governance import load_exposed_datasets
from ds.governance.mapper import asset_id_for

verify = os.environ["TEST_TLS_VERIFY"] == "true"
token = httpx.post(
    os.environ["CONNECTOR_KEYCLOAK_TOKEN_URL"],
    data={
        "grant_type": "client_credentials",
        "client_id": os.environ["CONNECTOR_CLIENT_ID"],
        "client_secret": os.environ["CONNECTOR_CLIENT_SECRET"],
    },
    timeout=30,
    verify=verify,
)
token.raise_for_status()
r = httpx.get(
    os.environ["TEST_CONNECTOR_URL"] + "/provider/assets",
    headers={"Authorization": "Bearer " + token.json()["access_token"]},
    timeout=60,
)
if r.status_code != 200:
    sys.exit(f"GET /provider/assets answered {r.status_code}: {r.text[:300]}")
offered = {a.get("@id") or a.get("id") for a in r.json()}
exposed = load_exposed_datasets(
    os.environ["CONNECTOR_GOVERNANCE_YAML_PATH"],
    overlay_name=os.environ.get("CONNECTOR_GOVERNANCE_OVERLAY_NAME") or None,
)
expected = {asset_id_for(key, rule) for key, rule in exposed.items()}
print(f"catalogue: {len(offered)} asset(s) offered; governance exposes {len(expected)}")
unexpected = sorted(str(i) for i in offered - expected)
missing = sorted(expected - offered)
if unexpected:
    print("offered, not exposed by the governance: " + ", ".join(unexpected))
if missing:
    print("exposed by the governance, not offered: " + ", ".join(missing))
if unexpected or missing:
    sys.exit("the catalogue does not match the governance")
if not expected:
    print("nothing exposed, nothing offered — as configured")
` }}
{{- $env := include "conn.env" . | fromYamlArray }}
{{- $env = append $env (dict "name" "TEST_CONNECTOR_URL" "value" (printf "http://%s:%v" (include "ds.fullname" .) .Values.service.port)) }}
{{ include "ds.testPod" (dict "ctx" . "name" "catalogue" "script" $script "env" $env
     "volumes" (list (dict "name" "governance" "configMap" (dict "name" (include "conn.governanceConfigMap" .))) (dict "name" "tmp" "emptyDir" (dict)))
     "volumeMounts" (list (dict "name" "governance" "mountPath" .Values.governance.mountPath "readOnly" true) (dict "name" "tmp" "mountPath" "/tmp"))) }}
{{- end }}
