{{- if eq (include "ds.createSecret" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ds.fullname" . }}
  labels:
    {{- include "ds.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.secrets.dbUser | default (include "ds.db.connector" .) | quote }}
  DB_PASSWORD: {{ required "secrets.dbPassword is required" .Values.secrets.dbPassword | quote }}
  # The organisation client's secret (`svc-ds-connector-<alias>`): this
  # connector's credential for everything it calls, its EDC's management API
  # included.
  CONNECTOR_CLIENT_SECRET: {{ required "secrets.clientSecret is required" .Values.secrets.clientSecret | quote }}
  # The EDR callback header value; the same value is in this participant's EDC
  # vault (ds-edc `secrets.edcCallbackKey`).
  EDC_CALLBACK_KEY: {{ required "secrets.edcCallbackKey is required" .Values.secrets.edcCallbackKey | quote }}
{{- if .Values.sync.clientId }}
  # The separate publisher identity's secret, used only by the sync hook Job.
  # Required as soon as `sync.clientId` names one: a job that cannot authenticate
  # leaves the catalogue empty, which is the failure this whole thing exists to
  # stop being silent.
  PUBLISHER_CLIENT_SECRET: {{ required "secrets.publisherSecret is required when sync.clientId is set" .Values.secrets.publisherSecret | quote }}
{{- end }}
  # No trust-anchor public key here since `DID-17`: user VCs are verified against
  # the key the anchor's DID document publishes, resolved at request time. A
  # public key was never a secret, and holding a copy of one made rotating it a
  # redeploy of every service that held it.
{{- end }}
