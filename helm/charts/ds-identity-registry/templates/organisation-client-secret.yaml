{{- /*
The organisation clients' secrets for `ir-cli keycloak org-sync`, rendered from
the deployment's secrets like every other ds secret. One
`SVC_DS_CONNECTOR_<ALIAS>_SECRET` per declared organisation, and
`SVC_DS_COLLECTOR_<ALIAS>_SECRET` for each that collects consent (ADR-0026).
Each is `required`: under DS_ENV=production org-sync refuses an organisation it
has no secret for, and a render that fails names the missing key, where a pod
that runs names nothing until someone reads its report.

Not rendered when `keycloak.sync.organisationClientSecrets` names an existing
Secret — that is the escape hatch, as `existingSecret` is for the main one.
*/}}
{{- $sync := .Values.keycloak.sync }}
{{- if and $sync.enabled (not $sync.organisationClientSecrets) $sync.organisations }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ir.organisationClientSecretName" . }}
  labels:
    {{- include "ds.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $alias, $org := $sync.organisations }}
  {{- $given := index ($.Values.secrets.organisationClients | default dict) $alias | default dict }}
  {{- $env := $alias | upper | replace "-" "_" }}
  SVC_DS_CONNECTOR_{{ $env }}_SECRET: {{ required (printf "organisation %s: secrets.organisationClients.%s.connectorSecret is required" $alias $alias) $given.connectorSecret | quote }}
  {{- if ($org | default dict).collectsConsent }}
  SVC_DS_COLLECTOR_{{ $env }}_SECRET: {{ required (printf "organisation %s collects consent: secrets.organisationClients.%s.collectorSecret is required" $alias $alias) $given.collectorSecret | quote }}
  {{- end }}
  {{- end }}
{{- end }}
