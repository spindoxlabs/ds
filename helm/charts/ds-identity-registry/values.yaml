# Chart defaults. Operators configure via helm/values.yaml; helmfile maps that
# file onto these keys. Everything here is a safe default.

service:
  name: identity-registry # → ghcr.io/spindoxlabs/ds-identity-registry
  port: 30005
  healthPath: /health

replicaCount: 1

image:
  registry: ""
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

containerSecurityContext:
  readOnlyRootFilesystem: true

resources: {}
probes: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

env: {} # extra plain env vars

# Reference a pre-created Secret instead of rendering one.
existingSecret: ""

networkPolicy:
  egress: []

# ── Role ──────────────────────────────────────────────────────────────────────
#
# **One chart, N releases.** A dataspace runs one `trust-anchor` release and one
# `participant` release per organisation — never a copy of this chart. Adding a
# participant is adding a release with values; if it ever requires editing a
# template, the parameterisation is wrong.
#
#   trust-anchor  the governance authority's instance: issuance, the
#                 participant/owner/membership registries, agreements,
#                 onboarding, the StatusList and the trust list
#   participant   one organisation's own: its DID documents, its STS, its
#                 credential store. No registry, issuance or onboarding route
#                 is mounted, and the service refuses to start without
#                 `participant.did`
#
# Each release needs **its own database and its own encryption key**. Sharing
# either puts every private key back in one place and makes the split cosmetic.
role: trust-anchor

participant:
  # Required when role=participant. `name` is the participant slug used for the
  # database and the release name; `did` is what this instance holds the key for.
  name: ""
  did: ""
  # Published as a `DSPEndpoint` service entry in this participant's DID
  # document. The trust anchor reads it **from that document** at enrolment, so
  # a participant cannot claim an endpoint it does not publish.
  dspAddress: ""
  # Where this instance is reachable from outside the cluster — its own host,
  # which is also its did:web identity. Defaults to <name>.<baseDomain>.
  host: ""

# Database name. Empty resolves per role: the anchor takes
# `global.postgres.databases.identityRegistry`, a participant takes
# `identity_registry_<participant.name>` — so two releases never share one.
database: ""

# ── Identity-registry specifics ───────────────────────────────────────────────

# Connectors told when the participant registry changes (promote, suspend,
# revoke). Comma-separated; empty disables the notification and leaves every
# connector on its cache TTL — which is a minute of an operator console showing
# a registry without the participant they just created. helmfile renders this
# from the participant list.
connectorUrls: ""

trustAnchorDomain: "" # defaults to trust-anchor.<global.baseDomain>

# JSON-LD context and dataspace URI. Dev defaults point at *.localhost; these
# are derived from global.baseDomain unless set explicitly.
credentialsContextUrl: ""
dataspaceUri: ""

credentialTtl:
  defaultDays: 365
  maxDays: 730

# DCP credential-service presentation query. Internal by default — the holder
# self-presents. Enable only if remote verifiers query it directly.
credentialService:
  expose: false

ingress:
  enabled: true

migration:
  enabled: true
  # initContainer runs per pod, so replicas > 1 serialises on an advisory lock.
  # `job` mode is reserved for a later iteration.
  mode: initContainer

bootstrap:
  enabled: true
  seedConfigMap: ""
  seedMountPath: /seed
  # `ir-cli org apply` walks owners.yaml entries that carry a `dataspace:` block
  # all the way to a promoted participant. Set secrets.orgStsSecret below to
  # hand them a real STS secret instead of the dev default.

# Externally reachable base URL of this registry, written into provisioning
# bundles. Defaults to https://<trust-anchor domain>.
publicUrl: ""

keycloak:
  # Optional realm/organization provisioning against an external Keycloak.
  sync:
    enabled: false
    clientsConfigMap: ""
    organizationsConfigMap: ""
  # Runtime writes into the realm (promotion creating a participant's connector
  # client). Empty → falls back to `sync.enabled`, i.e. guest by default. See the
  # root helm/values.yaml for the two postures.
  mutate: ""

# The trust-anchor public JWK is served from the registry's own database; no
# mount is required here. CONNECTOR_TRUST_ANCHOR_KEY_PATH is a connector concern.

# ── Secret material ───────────────────────────────────────────────────────────
# Supplied by helmfile from secrets.sops.yaml. Deliberately empty here: the
# templates use `required`, so a missing value fails the render rather than
# deploying something that starts with a default nobody chose.
secrets:
  identityRegistryEncryptionKey: ""
  serviceClientSecret: "" # svc-ds-identity-registry Keycloak secret
  dbUser: "" # defaults to the database name (its owner role)
  dbPassword: ""
  keycloakAdminUsername: ""
  keycloakAdminPassword: ""
  # Optional. STS client secret for organisations seeded by `ir-cli org apply`.
  orgStsSecret: ""
  # `role: participant` only. The secret this participant's **own** connector
  # presents to this instance's STS. Its own to choose — the trust anchor mints
  # none (`D-51`), which is why it is a per-release secret and not derived.
  participantStsSecret: ""

# ── Global fallbacks ──────────────────────────────────────────────────────────
# Real values come from helm/values.yaml via helmfile. These exist so the chart
# renders standalone (helm lint / helm template) without a values file.
global:
  baseDomain: ds.example.org
  hosts:
    trustAnchor: trust-anchor
    users: users
  image:
    registry: ghcr.io/spindoxlabs
    prefix: ds-
    tag: ""
    pullPolicy: IfNotPresent
    pullSecrets: []
  ingress:
    className: nginx
    annotations: {}
    tls:
      clusterIssuer: ""
      secretName: ""
  postgres:
    host: ds-pg-rw.database.svc.cluster.local
    port: 5432
    sslMode: require
    databases:
      identityRegistry: identity_registry
  keycloak:
    realm: dataspaces
    issuerUrl: ""
    adminUrl: ""
    tokenUrl: ""
  networkPolicy:
    enabled: true
  monitoring:
    serviceMonitor: false
    prometheusNamespace: monitoring
  externalSecrets:
    enabled: false
    secretStoreRef: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
