# Coverage of the blueprint requirement rows.
#
# **This file holds only what no other file states.** Which rulebook rule
# answers a blueprint row is read off the rule's own text where the rulebook
# writes it (`attribution.py`); the tests that evidence a rule are read off the
# tests. What is left — and it is genuinely a judgement, so it is written down —
# is whether a row this data space is bound by is answered here, deliberately
# declined, or accepted and not yet met.
#
# A row absent from this file is `unassessed`: nobody has looked at it. That is
# a state, not a silence, and `docs/rulebook/status.md` counts it.
#
# States:
#   covered       answered here. Name `rules:` where the specific rule is known,
#                 or `pages:` where only the topic is known. A page-level answer
#                 carries no evidence and never reads as done.
#   open          binding, accepted, not met. `note:` says what is missing.
#   out-of-scope  deliberately not done. `note:` says why, and it belongs in
#                 scope-and-deviations.md as well.
#
# `must` and `should` rows are the ones that must appear here eventually;
# `may` and `recommended` are tracked and never demanded.
#
# Bootstrapped 2026-08-10 by transcribing the "Blueprint rows" section of each
# rulebook page and §1/§2 of scope-and-deviations.md. Every page-level entry is
# exactly as precise as the prose it came from — no more.

