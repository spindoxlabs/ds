# The Eclipse EDC version this platform builds against.
#
# **One source for a literal that has to agree in six places.** It used to be
# written out in each of them — the two `build.gradle.kts` files, the base-image
# tag in `Dockerfile.base`, the `EDC_BASE_IMAGE` default in `Dockerfile`, the
# `edc:base` / `edc:ensure-base` tags in `Taskfile.yml`, and `EDC_VERSION` in
# `.github/workflows/edc-base.yml` — so a version bump had six chances to be
# half-applied, and a half-applied one produces a base image whose cached
# dependencies are for a different EDC than the build resolves.
#
# Gradle exposes this to every subproject automatically; the Taskfile reads it
# with grep and passes it to Docker as a build arg. A drift check lives in
# `services/edc-connector/src/test/java/.../BuildConsistencyTest.java`, so this
# staying in step is asserted rather than remembered.
edcVersion=0.16.0
