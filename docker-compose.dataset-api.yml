# The **real** dataset-api and rec-registry, against the ds stack.
#
# `services/dataset-api-mock` mirrors this service's signature, but a mirror
# proves nothing about the original: every ds flow that passes against the mock
# is evidence about an API nobody runs. This compose runs the real one — built
# from the sibling checkout at `DATASET_API_PATH` — in the mock's place, so
# `ds-e2e` and the Playwright journeys exercise the service production uses,
# unchanged. The default assumes sibling checkouts under one workspace root;
# every path below is an env override, so a different checkout needs no edit here.
#
# rec-registry comes with it because it is not optional: every consent-gated
# dataset in the producer pipelines declares
# `row_filters: [{handler: rec_registry, args: {column: device_id}}]`. That
# handler resolves *devices*, not subject DIDs. Without a real registry the
# integration would exercise a filter shape production does not use.
#
#   docker compose -f docker-compose.dataset-api.yml up -d
#
# Paths are relative to this file and overridable with DATASET_API_PATH /
# REC_REGISTRY_PATH, so a checkout elsewhere needs no edit here.
#
# The mock keeps port 30002; this stack takes 30012 (dataset-api) and 30013
# (rec-registry) so both can run side by side and be compared on the same
# request.
#
# Which one a flow exercises is decided by the **asset's** `data_address.base_url`
# in `governance.yaml` — the EDC hands that address to the consumer. There is no
# connector variable for it: `fixtures/seed.sh` swaps the real dataset-api onto
# 30002 and moves the mock to 30022 for exactly that reason.

name: dataspaces-real-dataset-api

services:
  # ── databases ─────────────────────────────────────────────────────────────
  # Owned by this compose, not created by hand: `task docker:restart` recreates
  # the ds Postgres, so anything made with `psql` disappears on the next restart
  # and the migrations then fail with "database does not exist".
  db-create:
    image: postgres:17
    command: |
      sh -c 'n=0; until pg_isready -h 172.17.0.1 -p 35432 -U postgres; do
      n=$$((n+1)); [ $$n -lt 60 ] || { echo "postgres 172.17.0.1:35432 not ready after 60s"; exit 1; }; sleep 1; done &&
      for db in datasets rec_registry; do
        psql -h 172.17.0.1 -p 35432 -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='"'"'$$db'"'"'" |
        grep -q 1 || psql -h 172.17.0.1 -p 35432 -U postgres -c "CREATE DATABASE $$db";
      done'
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── REC registry ──────────────────────────────────────────────────────────
  rec-registry-migrate:
    build:
      context: ${REC_REGISTRY_PATH:-../../celine-eu/celine-dev/repositories/rec-registry}
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      # ds Postgres, not a second database server. One place to inspect state
      # when a query returns the wrong rows.
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@172.17.0.1:35432/rec_registry
    depends_on:
      db-create:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

  rec-registry:
    build:
      context: ${REC_REGISTRY_PATH:-../../celine-eu/celine-dev/repositories/rec-registry}
      dockerfile: Dockerfile
    ports:
      - "30013:8004"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@172.17.0.1:35432/rec_registry
      # `OidcSettings` carries its own `env_prefix="CELINE_OIDC_"`, so neither
      # `OIDC_ISSUER_URL` nor `OIDC__ISSUER_URL` is ever read — the service
      # silently kept its celine-realm defaults and refused every ds token.
      #
      # `base_url` must equal the `iss` claim; `jwks_uri` must be *reachable
      # from the container*. They differ here, which is exactly why the settings
      # keep them apart.
      CELINE_OIDC_BASE_URL: http://keycloak.dataspaces.localhost/realms/dataspaces
      CELINE_OIDC_JWKS_URI: http://172.17.0.1:9080/realms/dataspaces/protocol/openid-connect/certs
      CELINE_OIDC_AUDIENCE: svc-rec-registry
      # `/admin/*` and `/me/*` require a JWT regardless of this flag — the
      # middleware only skips *optional* extraction. The registry is now a real
      # client in the ds realm (`svc-rec-registry`), so leave auth on and hold a
      # token, rather than pretending the harness runs without one.
      AUTH_ENABLED: "true"
      POLICIES_ENABLED: "false"
      # TEMPORARY (e2e bring-up) — pairs with the `src` mount below.
      PYTHONPATH: /app/src
    volumes:
      # `rec-example.yaml` is the seed: one community, areas, members and the
      # devices whose ids appear in `device_id` row filters.
      - ${REC_REGISTRY_PATH:-../../celine-eu/celine-dev/repositories/rec-registry}/recs:/app/recs:ro
      # ── TEMPORARY (e2e bring-up) — remove once the flows pass ────────────
      # Runs the checked-out source instead of the baked image, so a fix in the
      # upstream repo is one container restart away rather than a rebuild.
      # `PYTHONPATH` below is what makes it win: the Dockerfile installs the
      # package into `/app/.venv`, so mounting `/app/src` alone changes nothing.
      - ${REC_REGISTRY_PATH:-../../celine-eu/celine-dev/repositories/rec-registry}/src:/app/src:ro
    depends_on:
      rec-registry-migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # The issuer in a ds token; discovery resolves it from inside the container.
      - "keycloak.dataspaces.localhost:host-gateway"

  # ── the real dataset-api ──────────────────────────────────────────────────
  dataset-api-migrate:
    build:
      context: ${DATASET_API_PATH:-../../celine-eu/celine-dev/repositories/dataset-api}
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@172.17.0.1:35432/datasets
      DATASETS_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@172.17.0.1:35432/datasets
    depends_on:
      db-create:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dataset-api-real:
    build:
      context: ${DATASET_API_PATH:-../../celine-eu/celine-dev/repositories/dataset-api}
      dockerfile: Dockerfile
    ports:
      # Takes the mock's port so nothing downstream has to be repointed: the
      # connector, the EDR endpoint and the portal all address 30002. Stop
      # `dataspaces-dataset-api-rec` first — one of them can hold it.
      - "30002:8001"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@172.17.0.1:35432/datasets
      DATASETS_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@172.17.0.1:35432/datasets

      # ── the dataspace PEP ───────────────────────────────────────────────
      # Without this the `Edc-Contract-Agreement-Id` header is ignored and the
      # service answers as if no dataspace existed — which is the correct
      # non-dataspace behaviour and a silent failure here.
      EDR_ENABLED: "true"
      CONNECTOR_INTERNAL_URL: http://172.17.0.1:30001
      REC_REGISTRY_URL: http://172.17.0.1:30013

      # `svc-ds-dataset-api` holds `connector.internal` in **both** realms —
      # it is already in celine-policies/clients.yaml with the same name — so
      # the same identity works here and in production.
      CELINE_OIDC_BASE_URL: http://keycloak.dataspaces.localhost/realms/dataspaces
      CELINE_OIDC_JWKS_URI: http://172.17.0.1:9080/realms/dataspaces/protocol/openid-connect/certs
      CELINE_OIDC_AUDIENCE: svc-dataset-api
      # `OidcSettings` reads `CELINE_OIDC_*`. `SERVICE_CLIENT_*` is read by
      # nothing — with the client unset the service sent no bearer at all and
      # ds refused `/internal/*` with 401, which surfaced as an unexplained
      # query failure rather than as a configuration error.
      CELINE_OIDC_CLIENT_ID: svc-ds-dataset-api
      # The **variable**, not the literal. A secret equal to its own client id is
      # the `KC-01` defect: it works in dev by coincidence — both sides default
      # to the same string — and breaks the moment `SVC_DS_DATASET_API_SECRET` is
      # set anywhere, because the realm would then hold one value and this
      # service present another. `ProductionGuard.forbid_secret_equal_to_client_id`
      # refuses exactly this on the ds services; the same rule applies to a
      # celine service authenticating into the ds realm.
      CELINE_OIDC_CLIENT_SECRET: ${SVC_DS_DATASET_API_SECRET:-svc-ds-dataset-api}

      # `M-15` — `POST /catalogue/{id}/conformance`. **Left off, and it cannot be
      # turned on from here alone.**
      #
      #   CONFORMANCE_ENABLED: "true"
      #
      # The service refuses to start with that set unless its image carries the
      # `conformance` extra (`celine-ontologies[mapper]`, which brings pyshacl),
      # and this repo's compose builds the sibling checkout's Dockerfile, which
      # installs no extras (`uv sync --frozen --no-install-project --no-dev`).
      # Failing at startup is the service's own deliberate design — an operator
      # who turns the feature on learns it is unusable while looking at the
      # deploy — so the pair has to move together: `--extra conformance` in the
      # dataset-api Dockerfile, then this line.
      #
      # `smoke` reads the plane's OpenAPI document and exercises the endpoint
      # wherever it is present, so no harness change is needed when it lands.
      # Set `E2E_REQUIRE_CONFORMANCE=true` at that point to make its *absence* a
      # failure rather than a probe nobody notices stopping.

      POLICIES_CHECK_ENABLED: "false"
      LOG_LEVEL: DEBUG
      # TEMPORARY (e2e bring-up) — pairs with the `src` mounts below.
      # `celine` is a namespace package, so both portions resolve from mounts
      # ahead of the installed copies in `/app/.venv`.
      PYTHONPATH: /app/src:/app/sdk
    volumes:
      # ── TEMPORARY (e2e bring-up) — remove once the flows pass ────────────
      # Runs the checked-out source instead of the baked image, so a fix in the
      # upstream repo is one container restart away rather than a rebuild. The
      # Dockerfile installs the package into `/app/.venv`, so the mount alone
      # would change nothing — `PYTHONPATH` above is what puts it first.
      #
      # The SDK is mounted too: it is an installed dependency, so a wrapper
      # added in `celine-sdk` is invisible here without it — which surfaced as
      # `RecRegistryAdminClient has no attribute lookup_assets_by_user_ids`.
      - ${CELINE_SDK_PATH:-../../celine-eu/celine-dev/repositories/celine-sdk}/src:/app/sdk:ro
      #
      # **Both lines come out together.** A stale mount silently runs different
      # code from the image the same compose file claims to test, which is the
      # one failure mode a harness must not have.
      - ${DATASET_API_PATH:-../../celine-eu/celine-dev/repositories/dataset-api}/src:/app/src:ro
      - ${DATASET_API_PATH:-../../celine-eu/celine-dev/repositories/dataset-api}/policies:/app/policies:ro
    depends_on:
      dataset-api-migrate:
        condition: service_completed_successfully
      rec-registry:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "keycloak.dataspaces.localhost:host-gateway"
