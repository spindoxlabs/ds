# Sharing offers — what a person is actually asked to consent to.
#
# A person does not consent to a dataset; they consent to a purpose-scoped
# bundle, for a named recipient, with a described category of processors.
# Everything here is a CODE plus an English label served by GET /ns/policy:
# translation is the frontend's job, so a locale can never widen a coverage
# window or invent a resolution.
#
# Overlay: sharing-offers.<name>.yaml merges on top (same mechanism as
# governance.<name>.yaml); *.local.yaml is gitignored for deployment bindings.
#
# Validated by `task compliance:validate` — an offer whose purpose is not in
# the ODRL profile, whose datasets do not resolve, or whose datasets do not
# declare the offer's purpose in dataspace.purpose[] fails the gate.

# The controller functions each named recipient is unbundled into — the
# vocabulary `recipients.recipient_role` is checked against, and the only
# authority for it. A recipient absent here is not unbundled, and an offer
# naming it may not carry a `recipient_role`; a recipient present here is, so
# an offer naming it must say which function (rulebook `D-11`).
#
# **Not the identity-registry's participant `roles`.** Those are DSP capacities,
# pinned to `{provider, consumer}` by the registry's own schema, so no legal
# `recipient_role` could ever be one — the check that compared the two was
# unsatisfiable and passed by comparing against an empty set (`GOV-20`).
#
# `controller_roles:` is the deprecated spelling and is still read.
recipient_roles:
  grid-operator: [metering, operations]

sharing_offers:
  - id: household-energy-flexibility
    purpose: FlexibilityResearch
    legal_basis: "https://w3id.org/dpv#Consent"
    recipients:
      # The recipient is the party the data goes to — the DSP consumer, ODRL
      # 2.2's `odrl:recipient`, the DSSC data recipient. Processors act on its
      # instructions under a DPA, so a new one joining the category is
      # disclosed, not asked. It was spelled `controller:`, which also meant the
      # subject's organisation and the GDPR controller; only this reading held
      # in every offer.
      recipient: example-org
      processors:
        category: appointed-service-providers
        admitted_by:
          - membership: example-org
          - credential_type: OrganizationCredential
    subject_scope: own_data
    measures: [consumption]
    resolution: PT15M
    coverage:
      retrospective: P1Y
      prospective: P2Y
    consent_text_version: "1.0"
    revocable: true
    retention: P2Y

  # Same legal entity, a different controller. A grid operator's operations
  # function and its metering function are unbundled: metering holds the
  # readings, operations wants them for planning, and consent to one is not
  # consent to the other. `recipient_role` is what makes that boundary
  # checkable — a request arriving in the metering role is refused against a
  # row consented for operations, even though `recipient` matches.
  - id: grid-operations-planning
    purpose: EnergyCommunityOperation
    legal_basis: "https://w3id.org/dpv#Consent"
    recipients:
      recipient: grid-operator
      recipient_role: operations
      processors:
        category: appointed-service-providers
        admitted_by:
          - membership: grid-operator
    subject_scope: own_data
    measures: [consumption]
    resolution: PT15M
    coverage:
      retrospective: P1Y
      prospective: P1Y
    consent_text_version: "1.0"
    revocable: true
    retention: P1Y

  - id: community-incentive-calculation
    purpose: IncentiveCalculation
    # Contract, not consent: the community has a contractual duty to compute
    # and distribute incentives. Disclosed without a toggle — offering a
    # choice that does not exist is worse than not asking.
    legal_basis: "https://w3id.org/dpv#Contract"
    recipients:
      recipient: example-org
      processors:
        category: appointed-service-providers
        admitted_by:
          - membership: example-org
    subject_scope: community
    measures: [consumption]
    resolution: PT15M
    coverage:
      retrospective: P1Y
      prospective: P2Y
    consent_text_version: "1.0"
    revocable: false
    retention: P5Y

  # ── The recipient-restricted pair ──────────────────────────────────────────
  #
  # Contract, not consent: a supply obligation under an agreement, disclosed
  # rather than asked. They exist to name a *recipient*, which is what the
  # `odrl:recipient` access policy on `datasets.gold.flex_forecast` and
  # `datasets.gold.grid_forecast` is derived from — one declaration, read both by
  # `circle.admits_wildcard` (`D-14`) and by the EDC access policy.
  - id: flexibility-forecast-supply
    purpose: FlexibilityResearch
    legal_basis: "https://w3id.org/dpv#Contract"
    recipients:
      recipient: consumer-org
      processors:
        category: appointed-service-providers
        admitted_by:
          - membership: consumer-org
    subject_scope: community
    measures: [consumption]
    resolution: PT15M
    consent_text_version: "1.0"
    revocable: false
    retention: P1Y

  - id: grid-forecast-supply
    purpose: GridMonitoring
    legal_basis: "https://w3id.org/dpv#Contract"
    recipients:
      recipient: grid-operator
      recipient_role: operations
      processors:
        category: appointed-service-providers
        admitted_by:
          - membership: grid-operator
    subject_scope: community
    measures: [consumption]
    resolution: PT15M
    consent_text_version: "1.0"
    revocable: false
    retention: P1Y
