version: "3"

vars:
  SRC: src/connector

tasks:
  setup:
    desc: Install Python dependencies (idempotent)
    cmds:
      - uv sync --extra dev
    sources: [pyproject.toml]
    generates: [.venv/bin/uvicorn]

  run:
    desc: Run dev server with hot-reload on :30001
    deps: [setup]
    cmds:
      - uv run uvicorn connector.main:app --reload --host 0.0.0.0 --port 30001

  debug:
    desc: Run dev server with debugpy on :30901, waiting for attach
    deps: [setup]
    cmds:
      - uv run python -m debugpy --listen 0.0.0.0:30901 --wait-for-client -m uvicorn connector.main:app --reload --host 0.0.0.0 --port 30001

  release:
    desc: (noop — managed by CI/CD)
    cmds:
      - echo "release not configured"

  db:migrate:
    desc: Apply pending migrations (requires postgres)
    cmds:
      - uv run alembic upgrade head

  db:revision:
    desc: "Generate a new migration — pass MESSAGE=my_description"
    cmds:
      - uv run alembic revision --autogenerate -m "{{.MESSAGE | default "migration"}}"

  test:
    deps: [setup]
    # **No `env: DS_ENV: dev` here, deliberately.** A test suite is a
    # development context and has to say so, since `DS_ENV` defaults to
    # `production` and a test that enters the app's lifespan then hits the
    # ProductionGuard. It used to say so *here*, which made the answer depend on
    # the invocation: green through `task`, two `InsecureProductionConfig`
    # failures under a bare `uv run pytest tests/` on the same tree.
    # `tests/conftest.py` pins it now, on the route every invocation takes, and
    # a second pin here would hide that one's removal from the common route.
    cmds:
      - uv run pytest tests/ -v --cov={{.SRC}} --cov-report=term-missing

  test:integration:
    desc: |
      The connector against a real PostgreSQL on 172.17.0.1:35432. Creates its
      own throwaway database, never the dev one. Proves what the unit suite
      structurally cannot: it builds its schema with `create_all` on SQLite, so
      the eight migrations run nowhere and no model is ever exercised against
      Postgres.
    deps: [setup]
    # `DS_ENV` likewise comes from `tests/conftest.py`, which pytest loads for
    # `tests/integration` too. The subprocesses these tests spawn pass it on
    # explicitly, because a child process inherits the pin only if it is asked.
    cmds:
      - uv run pytest tests/integration -v

  lint:
    cmds:
      - uv run ruff format --check {{.SRC}} tests/
      - uv run ruff check {{.SRC}} tests/

  format:
    cmds:
      - uv run ruff format {{.SRC}} tests/

  type-check:
    cmds:
      - uv run mypy {{.SRC}}
