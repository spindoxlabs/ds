edc.participant.id=did:web:third-party.dataspaces.localhost
edc.participant.did=did:web:third-party.dataspaces.localhost
edc.dsp.callback.address=http://172.17.0.1:29194/protocol
web.http.port=29191
web.http.path=/api
web.http.management.port=29193
web.http.management.path=/management
# See rec.properties: without `auth.type` EDC registers no authentication
# filter, and `auth.key` on its own protects nothing. The key comes from the
# environment (WEB_HTTP_MANAGEMENT_AUTH_KEY) — a ${...} placeholder here would be
# stored verbatim, EDC does not interpolate properties files.
web.http.management.auth.type=tokenbased
web.http.protocol.port=29194
web.http.protocol.path=/protocol
# See rec.properties: control is in-runtime only, and there is deliberately no
# `public` or `version` context — no packaged module registers a resource on
# either, so configuring them bound ports with nothing behind them.
web.http.control.port=29192
web.http.control.path=/control
# See rec.properties: without this the control API served the data-plane registry
# to anything on the network. Safe because the data-plane client is embedded in
# this runtime. Key from WEB_HTTP_CONTROL_AUTH_KEY.
web.http.control.auth.type=tokenbased
edc.hostname=172.17.0.1
# The DATASET API, reachable from off-host as well as on it. See rec.properties.
ds.edr.endpoint.public.baseurl=http://172.17.0.1:30002
edc.transfer.proxy.token.signer.privatekey.alias=participant-private-key
edc.transfer.proxy.token.verifier.publickey.alias=participant-private-key

# ── Data-plane signalling — new in EDC 0.18.0, and it binds whether or not it
# is configured ──────────────────────────────────────────────────────────────
# 0.18.0 replaced `transfer-data-plane-signaling` with
# `data-protocols:data-plane-signaling` in `controlplane-base-bom`, and that
# module brings a **new `signaling` web context**: `ApiContext` declares it
# alongside MANAGEMENT/CONTROL/PROTOCOL, `SignalingApiConfiguration` defaults it
# to port **8182**, and `DataPlaneSignalingApiExtension` registers a resource on
# it. Unconfigured it still listens.
#
# At 0.16.0 the signalling API was registered on the **control** context, which
# is why it was covered by `web.http.control.auth.type` below. The move takes it
# out from behind that filter and onto a port of its own.
#
# Two consequences, and the first is how this was found:
#   * every runtime would bind 8182, so in `dev:*` — where all three EDCs are
#     host processes on one machine — the second one to start dies with
#     "Failed to bind to 0.0.0.0/0.0.0.0:8182" and crash-loops. In containers
#     each has its own namespace, so all three look healthy and say nothing.
#   * it is `tokenbased` for the same reason the control context is, and it is
#     safe for the same reason: the data plane is embedded in this runtime, so
#     the control plane signals it in-process and nothing crosses this port.
#     Key from WEB_HTTP_SIGNALING_AUTH_KEY.
web.http.signaling.port=29195
web.http.signaling.path=/signaling
web.http.signaling.auth.type=tokenbased

# ── DCP / Verifiable Credentials (Iteration 5) ───────────────────────────────
ds.vault.seed.file=/config/third-party-vault.properties

# **This participant's own registry (:30007), not the trust anchor** (`DID-05`).
# The anchor is still where every registry question goes; the STS and the
# credential service are the participant's own, because they are the two
# things that need its private key — which the anchor does not have.
edc.iam.sts.oauth.token.url=http://172.17.0.1:30007/sts/did:web:third-party.dataspaces.localhost/token
edc.iam.sts.oauth.client.id=did:web:third-party.dataspaces.localhost
edc.iam.sts.oauth.client.secret.alias=sts-third-party-client-secret

edc.iam.trustedissuer.0.id=did:web:trust-anchor.dataspaces.localhost

# DCP scope used by DSP requests to ask the counterparty wallet for membership VCs.
edc.iam.dcp.scopes.membership.id=membership
edc.iam.dcp.scopes.membership.type=default
edc.iam.dcp.scopes.membership.value=org.eclipse.dspace.dcp.vc.type:MembershipCredential:read
edc.iam.dcp.scopes.membership.profile=*

# No `edc.credential.service.url` — read by no class; a counterparty discovers
# this one through the DID document. See rec.properties.

edc.iam.did.web.use.https=false
ds.connector.internal.url=http://172.17.0.1:31001

# ── How this EDC authenticates to ds-connector ───────────────────────────────
# See services/connector/config/rec.properties. Supplied from the
# environment as DS_CONNECTOR_INTERNAL_{TOKEN_URL,CLIENT_ID,CLIENT_SECRET};
# the extension refuses to start without them.

# ── EDC's own federated catalogue crawler — off ──────────────────────────────
# `controlplane-base-bom` pulls in `catalog-crawler-core` from EDC 0.18.0, and
# `CatalogCrawlerConfiguration` defaults it to enabled with 2 crawler threads on
# a 60-second tick. `CatalogCrawlerDefaultServicesExtension` supplies in-memory
# defaults for both the cache and the target-node directory, so the runtime
# boots and crawls rather than failing — with an empty node directory it crawls
# nothing, and the cost is two threads per connector plus a second catalogue
# mechanism inside a platform whose federated catalogue is
# `services/federated-catalog`. Off explicitly, rather than relying on the node
# directory staying empty.
#
# The same BOM change registers `CatalogsApiV3Controller` / `…V4Controller` on
# the *management* context. Those routes exist whether or not the crawler runs;
# they are behind the existing management auth key and ds adds nothing to them.
edc.catalog.cache.execution.enabled=false

# ── PostgreSQL persistence ───────────────────────────────────────────────────
edc.datasource.default.url=jdbc:postgresql://172.17.0.1:35432/edc_third_party
edc.datasource.default.user=postgres
edc.datasource.default.password=postgres
edc.datasource.default.pool.connections.max-idle=3
edc.datasource.default.pool.connections.max-total=10
edc.datasource.default.pool.connection.test.on-return=true
edc.sql.schema.autocreate=true
