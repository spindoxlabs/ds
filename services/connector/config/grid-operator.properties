# The grid operator's EDC — the **second provider** (`D-54`, `DID-15`).
#
# Structurally identical to `rec.properties`, which is the point: a
# participant is a participant, and nothing here knows whether the organisation
# behind it has members. What differs is only what a second organisation must
# not share — its ports, its database, its DID, its own registry, its own vault.
#
# Ports are the 39xxx block; `provider` holds 19xxx and `consumer` 29xxx.
edc.participant.id=did:web:grid-operator.dataspaces.localhost
edc.iam.issuer.id=did:web:grid-operator.dataspaces.localhost
edc.dsp.callback.address=http://172.17.0.1:39194/protocol
web.http.port=39191
web.http.path=/api
web.http.management.port=39193
web.http.management.path=/management
# See `rec.properties`: without `auth.type` EDC registers no authentication
# filter and `auth.key` on its own protects nothing. The key arrives from the
# environment as WEB_HTTP_MANAGEMENT_AUTH_KEY — a `${...}` placeholder here would
# be stored verbatim, because EDC does not interpolate properties files.
web.http.management.auth.type=tokenbased
web.http.protocol.port=39194
web.http.protocol.path=/protocol
web.http.public.port=39291
web.http.public.path=/public
web.http.control.port=39192
web.http.control.path=/control
web.http.version.port=39195
web.http.version.path=/version
edc.hostname=172.17.0.1
edc.dataplane.api.public.baseurl=http://172.17.0.1:39291/public
ds.edr.endpoint.public.baseurl=http://localhost:30002
edc.transfer.proxy.token.signer.privatekey.alias=participant-private-key
edc.transfer.proxy.token.verifier.publickey.alias=participant-private-key

# ── DCP / Verifiable Credentials ─────────────────────────────────────────────
edc.vault.hashicorp.enabled=false
edc.vault.fs.file=/config/grid-operator-vault.properties

# **This participant's own registry (:30008), not the trust anchor** (`DID-05`).
# The anchor is still where every registry question goes; the STS and the
# credential service are the participant's own, because they are the two things
# that need its private key — which the anchor does not have.
edc.iam.sts.oauth.token.url=http://172.17.0.1:30008/sts/did:web:grid-operator.dataspaces.localhost/token
edc.iam.sts.oauth.client.id=did:web:grid-operator.dataspaces.localhost
edc.iam.sts.oauth.client.secret.alias=sts-grid-operator-client-secret

# Trusted VC issuers — DIDs whose membership VCs are accepted.
edc.iam.trusted-issuer.0.id=did:web:trust-anchor.dataspaces.localhost

# DCP scope used by DSP requests to ask the counterparty wallet for membership VCs.
edc.iam.dcp.scopes.membership.id=membership
edc.iam.dcp.scopes.membership.type=default
edc.iam.dcp.scopes.membership.value=org.eclipse.dspace.dcp.vc.type:MembershipCredential:read
edc.iam.dcp.scopes.membership.profile=*

edc.credential.service.url=http://172.17.0.1:30008/credentials/did:web:grid-operator.dataspaces.localhost

edc.iam.did.web.use.https=false
ds.connector.internal.url=http://172.17.0.1:32001

# ── How this EDC authenticates to ds-connector ───────────────────────────────
# Supplied from the environment as DS_CONNECTOR_INTERNAL_{TOKEN_URL,CLIENT_ID,
# CLIENT_SECRET}; the extension refuses to start without them. See
# `rec.properties` for why they are not written here.

# ── PostgreSQL persistence ───────────────────────────────────────────────────
edc.datasource.default.url=jdbc:postgresql://172.17.0.1:35432/edc_grid_operator
edc.datasource.default.user=postgres
edc.datasource.default.password=postgres
edc.datasource.default.pool.maxIdleConnections=3
edc.datasource.default.pool.maxTotalConnections=10
edc.datasource.default.pool.testConnectionOnReturn=true
edc.sql.schema.autocreate=true
