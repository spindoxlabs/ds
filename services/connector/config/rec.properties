edc.participant.id=did:web:rec.dataspaces.localhost
edc.participant.did=did:web:rec.dataspaces.localhost
edc.dsp.callback.address=http://172.17.0.1:19194/protocol
web.http.port=19191
web.http.path=/api
web.http.management.port=19193
web.http.management.path=/management
# ── Management API: v5, OAuth2, no shared key ────────────────────────────────
# `management-api-oauth2-authentication` puts two filters on this context: the
# token's signature (this realm's JWKS), issuer, `nbf` and `exp` — never its
# `aud` — then `sub` must name a participant context and `scope` must satisfy
# the route's `@RequiredScope` (`management-api-authorization`). The caller is
# the organisation's Keycloak client, `svc-ds-connector-<alias>`, whose `sub`
# mapper names the context below. There is no `auth.type` any more: set beside
# the OAuth2 filters it would demand an `x-api-key` on every call as well.
#
# The context id is the DID, stated rather than left to the fallback: the
# classic runtime already stamped `edc.participant.id` on every stored entity
# as its context id, so this is the value that needs no migration, and it is
# the `participant_context_id` in `services/keycloak/organizations.yaml`.
edc.participant.context.id=did:web:rec.dataspaces.localhost
# The issuer tokens carry (`KC_HOSTNAME`), and where this container fetches the
# keys from (the host gateway, ADR-0007) — two addresses for one realm.
edc.iam.oauth2.issuer=http://keycloak.dataspaces.localhost/realms/dataspaces
edc.iam.oauth2.jwks.url=http://172.17.0.1:9080/realms/dataspaces/protocol/openid-connect/certs
# v5 resolves a request's `protocol` through the participant's dataspace
# profiles (`ParticipantProfileService`) and refuses one not enabled ("No profile
# … for participant"). All of them, because this classic runtime registers
# exactly one — DSP 2025-1 (`DspApiConfigurationV2025Extension`) — and listing it
# by name here would be a second copy of the pin `ds_edc.DATASPACE_PROTOCOL`.
edc.dataspace.enable.profiles.all=true
web.http.protocol.port=19194
web.http.protocol.path=/protocol
# Control: data-plane self-registration, data-plane signalling and the
# control-plane callback. In-runtime only — never mapped by compose and never
# routed by the chart's Ingress.
web.http.control.port=19192
web.http.control.path=/control
# Without this, `GET /control/v1/dataplanes` answered 200 with the full data-plane
# registry to anything on the Docker network — measured, not inferred. `auth.type`
# is what installs the filter: EDC registers one only for a context that sets it.
#
# It is safe here because the data-plane client is EMBEDDED in this runtime: the
# control plane signals its own data plane in-process, not across this port, so
# the filter never sits between the runtime and itself. Verified by running the
# full consumer-pull flow with it on — negotiation, EDR, query, revoke all pass
# and the JAR logs no 401. Do not assume that still holds if the data plane is
# ever split into its own runtime; it would then need a real
# ControlClientAuthenticationProvider, and only the no-op default is packaged.
#
# The key arrives as WEB_HTTP_CONTROL_AUTH_KEY. It is the only API key left on
# this runtime: the Management API authenticates OAuth2 tokens, and the key it
# used to share a value with (EDC_API_KEY) is what this repository unpicked.
web.http.control.auth.type=tokenbased
#
# There is no `public` or `version` context. Both used to be configured here and
# published, and no packaged module registers a resource on either: `ApiContext`
# in this runtime declares only MANAGEMENT, CONTROL and PROTOCOL, no data-plane
# public API is on the classpath, and the management Version API registers on the
# default context. Configuring a context EDC then binds with nothing behind it is
# how `ds.edr.endpoint.public.baseurl` came to point at a dead port under Helm.

# Where the consumer is told to fetch the data. This REWRITES the origin of the
# asset's own `base_url` (`http://dataset-api:30002/query` in governance.yaml, a
# compose service name) into an address the consumer can actually reach — see
# services/edc-extensions/.../HttpDataEndpointExtension.java.
#
# `172.17.0.1`, not `localhost`: the EDR is consumed off-host as often as on it,
# and the host-gateway address resolves identically from both (ADR-0007).
# It is the DATASET API, never an EDC port — EDC does not proxy this transfer.
ds.edr.endpoint.public.baseurl=http://172.17.0.1:30002
edc.transfer.proxy.token.signer.privatekey.alias=participant-private-key
edc.transfer.proxy.token.verifier.publickey.alias=participant-private-key
edc.hostname=172.17.0.1

# ── Data-plane signalling — new in EDC 0.18.0, and it binds whether or not it
# is configured ──────────────────────────────────────────────────────────────

# ── DCP / Verifiable Credentials (Iteration 5) ───────────────────────────────
# Filesystem vault — stores participant private key for JWT signing
ds.vault.seed.file=/config/rec-vault.properties

# STS (Security Token Service) — issues SI tokens for DSP requests (via identity-registry)
# **This participant's own registry (:30006), not the trust anchor** (`DID-05`).
# The anchor is still where every registry question goes; the STS and the
# credential service are the participant's own, because they are the two
# things that need its private key — which the anchor does not have.
edc.iam.sts.oauth.token.url=http://172.17.0.1:30006/sts/did:web:rec.dataspaces.localhost/token
edc.iam.sts.oauth.client.id=did:web:rec.dataspaces.localhost
edc.iam.sts.oauth.client.secret.alias=sts-rec-client-secret

# Trusted VC issuers — DIDs whose membership VCs are accepted
edc.iam.trustedissuer.0.id=did:web:trust-anchor.dataspaces.localhost

# DCP scope used by DSP requests to ask the counterparty wallet for membership VCs.
edc.iam.dcp.scopes.membership.id=membership
edc.iam.dcp.scopes.membership.type=default
edc.iam.dcp.scopes.membership.value=org.eclipse.dspace.dcp.vc.type:MembershipCredential:read
edc.iam.dcp.scopes.membership.profile=*

# There is no `edc.credential.service.url`. It was set here and is read by no
# class in connector.jar: a counterparty finds this participant's credential
# service through the `CredentialService` entry in its DID document, which
# identity-registry publishes. Setting it here only made it look configurable.

# DID:web resolution — use HTTP (not HTTPS) within Docker network
edc.iam.did.web.use.https=false
ds.connector.internal.url=http://172.17.0.1:30001

# ── How this EDC authenticates to ds-connector ───────────────────────────────
# A Keycloak client_credentials token, scoped to connector.internal +
# connector.webhook. This replaces X-Api-Key, which was the same value as the
# Management API key above — one secret across EDC's contract administration and
# the connector's internal API.
#
# Supplied from the environment, not written here. EDC's FsConfigurationExtension
# does a plain Properties.load() with no interpolation, so a ${...} placeholder
# would be stored verbatim; EDC reads the environment instead, converting
# ENVIRONMENT_NOTATION to dot.notation:
#   DS_CONNECTOR_INTERNAL_TOKEN_URL      → ds.connector.internal.token.url
#   DS_CONNECTOR_INTERNAL_CLIENT_ID      → ds.connector.internal.client.id
#   DS_CONNECTOR_INTERNAL_CLIENT_SECRET  → ds.connector.internal.client.secret
# The extension refuses to start if they are missing.

# ── EDC's own federated catalogue crawler — off ──────────────────────────────
# `controlplane-base-bom` pulls in `catalog-crawler-core` from EDC 0.18.0, and
# `CatalogCrawlerConfiguration` defaults it to enabled with 2 crawler threads on
# a 60-second tick. `CatalogCrawlerDefaultServicesExtension` supplies in-memory
# defaults for both the cache and the target-node directory, so the runtime
# boots and crawls rather than failing — with an empty node directory it crawls
# nothing, and the cost is two threads per connector plus a second catalogue
# mechanism inside a platform whose federated catalogue is
# `services/federated-catalog`. Off explicitly, rather than relying on the node
# directory staying empty.
#
# The same BOM change registers `CatalogsApiV3Controller` / `…V4Controller` on
# the *management* context. They are not packaged: `build.gradle.kts` excludes
# every classic (v3/v4) management controller, which no OAuth2 scope guards.
edc.catalog.cache.execution.enabled=false

# ── Consent revocation: how fast a running transfer is torn down (`D-17`) ────
#
# **EDC 0.18.0 made this setting mean what it says, and it did not before.**
# At 0.16.0 `PolicyMonitorManagerImpl` extended `AbstractStateEntityManager`, so
# started entries were swept by the state machine on its iteration wait and a
# withdrawal terminated the transfer in about 3s — `edc.policy.monitor.period`
# existed, defaulted to PT1H, and governed none of it. 0.18.0 rewrote the class
# as a plain watchdog on a `ScheduledExecutorService` driven by exactly this
# period. Left unset, revocation still stops data instantly (the per-query gate
# reads the consent table) but the **transfer process is not terminated for up
# to an hour**, which is the half of `D-17` that says revocation ends a running
# transfer rather than merely future queries. Measured: still `STARTED` 121s
# after withdrawal.
#
# PT5S restores the 0.16.0 behaviour with a number that now genuinely bounds it.
# Each pass evaluates at most `edc.policy.monitor.batch-size` (default 20)
# entries and each evaluation asks ds-connector about consent, so this trades a
# steady, bounded call rate for the revocation window a GDPR Art. 7(3)
# obligation needs. Raise it only with an argument about that obligation, not
# about load.
edc.policy.monitor.period=PT5S

# ── PostgreSQL persistence ───────────────────────────────────────────────────
edc.datasource.default.url=jdbc:postgresql://172.17.0.1:35432/edc_rec
edc.datasource.default.user=postgres
edc.datasource.default.password=postgres
edc.datasource.default.pool.connections.max-idle=3
edc.datasource.default.pool.connections.max-total=10
edc.datasource.default.pool.connection.test.on-return=true
edc.sql.schema.autocreate=true
