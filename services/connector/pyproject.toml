[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ds-connector"
version = "0.1.0"
description = "EDC orchestration, consent management, and governance service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "aiosmtplib>=3.0",
    "cryptography>=42",
    "ds-governance",
    "ds-auth",
    "ds-obs[tracing]",
    "ds-edc",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "respx>=0.21",
]

[tool.uv.sources]
ds-governance = { path = "../../libs/governance", editable = true }
ds-auth = { path = "../../libs/ds-auth", editable = true }
ds-obs = { path = "../../libs/ds-obs", editable = true }
ds-edc = { path = "../../libs/ds-edc", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/connector"]

[tool.pytest.ini_options]
# `rule` names the rulebook rule a test is evidence for. `ds-conformance`
# collects it to derive each rule's enforcement status, so the status column
# in `docs/rulebook/` is measured rather than asserted. Registered here so a
# typo warns instead of silently evidencing nothing.
asyncio_mode = "auto"
# `tests/integration` needs a real Postgres, so it is never collected by
# `task test` — the unit suite stays fast and dependency-free.
# `task test:integration` names the directory explicitly.
norecursedirs = ["tests/integration"]
markers = ["integration: needs a real PostgreSQL on 172.17.0.1:35432", "rule: names the rulebook rule id this test is evidence for"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# **The import order is the fixture.** `conftest.py` sets `CONNECTOR_ROLE` and
# the two governance paths with `os.environ.setdefault` *before* it imports
# `connector.main`, because settings are read at import time and the suite must
# resolve dataset ids and purposes against `tests/fixtures/` rather than the dev
# catalogue. Hoisting those imports to the top — which is all `E402` asks for —
# reads the real catalogue and the assertions stop meaning anything. The
# statements above the imports are the setup, not stray code.
"tests/conftest.py" = ["E402"]

# `prov_client` is a fixture defined in `test_provenance_events.py` and imported
# here to reuse it; the import already carries `noqa: F401`. `F811` fires at the
# *use* site instead — the test function's `prov_client` parameter shadows the
# imported name, which is how pytest fixtures are always consumed. The
# alternative is moving the fixture into `conftest.py`, which changes resolution
# for the file that defines it; not worth it for one consumer.
"tests/test_acting_principal.py" = ["F811"]

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
]
