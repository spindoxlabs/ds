version: "3"

tasks:
  setup:
    desc: Install Python dependencies (idempotent)
    cmds:
      - uv sync
    sources: [pyproject.toml]
    generates: [.venv/bin/uvicorn]

  test:
    # **No `env: DS_ENV: dev` here, deliberately.** A test suite is a
    # development context and has to say so, since `DS_ENV` defaults to
    # `production` and this service builds a ProductionGuard at import. It used
    # to say so *here*, which made the answer depend on the invocation: green
    # through `task`, seven collection errors under a bare `uv run pytest` on
    # the same tree. `tests/conftest.py` pins it now, on the route every
    # invocation takes, and a second pin here would hide that one's removal
    # from the common route.
    desc: Run unit tests
    deps: [setup]
    cmds:
      - uv run pytest -q

  lint:
    desc: Lint source and tests
    deps: [setup]
    cmds:
      - uv run ruff format --check src/ tests/
      - uv run ruff check src/ tests/

  format:
    desc: Format source and tests
    deps: [setup]
    cmds:
      - uv run ruff format src/ tests/

  run:
    desc: Run dev server with hot-reload on :30002
    deps: [setup]
    cmds:
      - uv run uvicorn dataset_api_mock.main:app --reload --host 0.0.0.0 --port 30002

  debug:
    desc: Run dev server with debugpy on :30902, waiting for attach
    deps: [setup]
    cmds:
      - uv run python -m debugpy --listen 0.0.0.0:30902 --wait-for-client -m uvicorn dataset_api_mock.main:app --reload --host 0.0.0.0 --port 30002
