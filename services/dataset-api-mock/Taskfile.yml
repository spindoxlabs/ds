version: "3"

tasks:
  setup:
    desc: Install Python dependencies (idempotent)
    cmds:
      - uv sync
    sources: [pyproject.toml]
    generates: [.venv/bin/uvicorn]

  test:
    # A test suite is a development context, and it has to say so: since
    # `DS_ENV` defaults to `production`, a suite that builds the app hits the
    # ProductionGuard and the whole module fails to *collect*. Declared here for
    # the same reason compose declares it — this is the dev topology, so it opts
    # out explicitly rather than relying on the variable being absent.
    env:
      DS_ENV: dev
    desc: Run unit tests
    deps: [setup]
    cmds:
      - uv run pytest -q

  lint:
    desc: Lint source and tests
    deps: [setup]
    cmds:
      - uv run ruff check src/ tests/

  format:
    desc: Format source and tests
    deps: [setup]
    cmds:
      - uv run ruff format src/ tests/

  run:
    desc: Run dev server with hot-reload on :30002
    deps: [setup]
    cmds:
      - uv run uvicorn dataset_api_mock.main:app --reload --host 0.0.0.0 --port 30002

  debug:
    desc: Run dev server with debugpy on :30902, waiting for attach
    deps: [setup]
    cmds:
      - uv run python -m debugpy --listen 0.0.0.0:30902 --wait-for-client -m uvicorn dataset_api_mock.main:app --reload --host 0.0.0.0 --port 30002
