[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataset-api-mock"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # ServiceTokenProvider — the PEP authenticates to ds-connector's
    # /internal/* API as svc-ds-dataset-api rather than with the shared
    # X-Api-Key, which is also EDC's Management API key.
    "ds-auth",
    "ds-obs",
    # The `/internal/dataplane/authorize` contract. The decision shape is
    # governance's, not this service's — see ds/governance/dataplane.py.
    "ds-governance",
    # EDR verification. The token is ES256-signed by the provider EDC, and in
    # our topology nothing else validates it before the request lands here.
    "pyjwt>=2.9",
    "cryptography",
]

[tool.uv.sources]
ds-auth = { path = "../../libs/ds-auth", editable = true }
ds-obs = { path = "../../libs/ds-obs", editable = true }
ds-governance = { path = "../../libs/governance", editable = true }

[project.optional-dependencies]
dev = []

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    # `test_dataset_fixtures.py` reads `governance.yaml` and the REC fixture to
    # check this service's vocabulary against them. Declared rather than relied
    # on transitively through ds-governance: the check is the point of the test.
    "pyyaml>=6",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
# Without this the shared libs sort as third-party and `dataset_api_mock` as
# unknown, so borrowing another unit's config produces false `I001`s here.
known-first-party = ["dataset_api_mock"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset_api_mock"]
