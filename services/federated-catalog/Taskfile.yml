version: "3"

vars:
  SRC: src/federated_catalog

tasks:
  setup:
    desc: Install Python dependencies (idempotent)
    cmds:
      - uv sync --extra dev
    sources: [pyproject.toml]
    generates: [.venv/bin/uvicorn]

  run:
    desc: Run dev server with hot-reload on :30003
    deps: [setup]
    cmds:
      - uv run uvicorn federated_catalog.main:app --reload --host 0.0.0.0 --port 30003

  debug:
    desc: Run dev server with debugpy on :30903, waiting for attach
    deps: [setup]
    cmds:
      - uv run python -m debugpy --listen 0.0.0.0:30903 --wait-for-client -m uvicorn federated_catalog.main:app --reload --host 0.0.0.0 --port 30003

  release:
    desc: (noop — managed by CI/CD)
    cmds:
      - echo "release not configured"

  test:
    deps: [setup]
    # A test suite is a development context, and it has to say so: since
    # `DS_ENV` defaults to `production`, a suite that builds the app hits the
    # ProductionGuard and the whole module fails to *collect*. Declared here for
    # the same reason compose declares it — this is the dev topology, so it opts
    # out explicitly rather than relying on the variable being absent.
    env:
      DS_ENV: dev
    cmds:
      - uv run pytest tests/ -v

  lint:
    cmds:
      - uv run ruff format --check {{.SRC}} tests/
      - uv run ruff check {{.SRC}} tests/

  format:
    cmds:
      - uv run ruff format {{.SRC}} tests/

  type-check:
    cmds:
      - uv run mypy {{.SRC}}
