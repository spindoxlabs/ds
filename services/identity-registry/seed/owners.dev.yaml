# Dev owner seed.
#
# These are operator-seeded verified organisations for local dev. Owners now
# default to `status: pending`, and a 'verified' owner must carry its evidence
# (`verified_by`) — the DB CHECK, the admin API and `ir-cli owner import` all
# enforce the pairing. So each entry states *because of what* it is verified:
# in dev that is the seed itself, recorded honestly rather than defaulted.
owners:
  - id: example-org
    type: schema:NGO
    name: Example Organization
    did: did:web:rec.dataspaces.localhost
    aliases: [example]
    status: verified
    verified_by: dev-seed
    evidence_ref: "owners.dev.yaml"
    organization:
      create: true
      role: community

  # The consuming organisation. **Added with `DID-05`**, and it closed a gap
  # rather than adding a fixture: `did:web:third-party.dataspaces.localhost` had
  # always been a participant with no organisation behind it — no verification,
  # and therefore nothing `POST /admin/owners` would agree to create.
  #
  # Enrolment made it load-bearing: a participant enrols *as* a verified owner,
  # so without this entry the consumer has nothing to enrol against.
  #
  # **It is a covered processor, not an outsider, and this comment used to say
  # the opposite.** It once read "no agreement, and therefore no declared
  # capacity … the circle check resolves it outside the circle". That stopped
  # being true when the bootstrap started accepting on its behalf:
  # `docker-compose.yml` runs `ir-cli agreement accept --owner consumer-org`,
  # which defaults to `dataspace-participation`, and that agreement declares
  # `capacity: processor` (`agreements.dev.yaml`). That is one half of the
  # circle. The other half is the offer's own `admitted_by`, and it is ANDed:
  # this organisation is **not a member of `example-org`**, so an offer that
  # requires that membership (`household-energy-flexibility`) leaves it outside,
  # and `D-14` correctly withholds that offer's wildcard grant from it. Whether
  # the wildcard admits this DID is a question per offer, never per DID. The
  # stale sentence cost a `wildcard-admission` e2e draft its premise, and the
  # half-corrected one cost `onboarding-seam` an expectation.
  #
  # **The dev independent controller is `outsider-org`**, and it is not here: it
  # lives in `libs/ds-e2e/src/ds_e2e/scenarios/energy-chains.yaml`, accepts
  # `independent-controller-participation`, and is deliberately not a member of
  # `example-org`. Capacity is a property of what an organisation signed, never
  # of being listed in this file.
  - id: consumer-org
    type: schema:Organization
    name: Consumer Organization
    did: did:web:third-party.dataspaces.localhost
    aliases: [consumer]
    status: verified
    verified_by: dev-seed
    evidence_ref: "owners.dev.yaml"

  # A service provider appointed by the community. Its capacity — processor or
  # independent controller — is what decides whether it is inside the consent
  # circle, and capacity comes from the agreement it signed, never from being
  # listed here.
  - id: partner-org
    type: schema:Organization
    name: Partner Service Provider
    did: did:web:partner.dataspaces.localhost
    aliases: [partner]
    status: verified
    verified_by: dev-seed
    evidence_ref: "owners.dev.yaml"
    organization:
      create: true
      role: processor

  # A grid operator is one legal entity with more than one controller: metering
  # and operations are unbundled, so a consent naming one does not reach the
  # other. `controller_role` on a sharing offer is what carries that distinction.
  - id: grid-operator
    type: schema:Organization
    name: Grid Operator
    did: did:web:grid-operator.dataspaces.localhost
    aliases: [grid]
    status: verified
    verified_by: dev-seed
    evidence_ref: "owners.dev.yaml"
    organization:
      create: true
      role: operator

  - id: open-data-provider
    type: schema:Organization
    name: Open Data Provider
    url: https://open-data.example.org
    status: verified
    verified_by: dev-seed
    evidence_ref: "owners.dev.yaml"
