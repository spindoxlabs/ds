# Domain overlay — the energy/REC backend, not ds.
#
# `clients.yaml` declares what **ds** needs from a realm. This file declares what
# the **domain backend behind ds** needs from the same realm, and the two are
# applied by different deployments:
#
#   posture A (ds owns the realm)   core applied, overlay applied — ds provisions
#                                   the realm for the backend it is deployed with.
#   posture B (ds is a guest)       core mirrored across, overlay **omitted** —
#                                   there `rec-registry` is the host's own service,
#                                   not ds's to declare.
#
# Dev only looks like the sole consumer because dev *is* a posture-A deployment
# that happens to have an energy-domain backend.
#
# Passed to `celine-policies keycloak sync` as `--overlay`, alongside the other
# declarations — the merge happens in the syncer's loader. It is never synced on
# its own: an overlay adds grants to clients another file owns, and the sync
# recomputes a client's grants from whatever it is given.
#
# An overlay may **add** scopes, add clients, and widen a client another file
# owns by naming `client_id` plus grant keys and nothing else. Restating that
# client's identity (`name`, `secret`, `scopes_prefix`) is an ownership conflict
# and is refused, as is disagreeing with another file about a realm-level key.

overlay: energy

scopes:
  # A dataspace query on a dataset whose row filter is `handler: rec_registry`
  # cannot be resolved without these, and every consent-gated dataset in the
  # energy producer pipelines uses exactly that handler.
  - name: rec-registry.admin
    description: Full administrative access to the registry
  # Granted to no client *in this overlay*, and that is not a dead declaration.
  # The rec-registry enforces both — `policies/celine/rec_registry/access.rego`
  # gates `/admin/import*` on `rec-registry.import` and `/admin/export` on
  # `rec-registry.export` — and `rec-registry.admin`, which `svc-rec-registry`
  # holds, satisfies them through that policy's admin override. They are
  # declared so a posture-A realm can grant either one **narrowly** rather than
  # handing a caller the admin superset. Do not remove them because `grep` finds
  # no `default_scopes` entry here; the holder and the enforcement are both
  # outside this repository, as for `svc-rec-registry` itself.
  - name: rec-registry.import
    description: Permission to import into the registry
  - name: rec-registry.export
    description: Permission to export from the registry
  - name: rec-registry.lookup
    description: Permission to lookup data

clients:
  # **Held by a service outside this repository** — the domain platform's
  # rec-registry, which authenticates against this realm with this client and is
  # named as the audience in `docker-compose.dataset-api.yml`. Nothing in ds
  # authenticates as it, and that is expected rather than a dead declaration:
  # the overlay exists so a shared realm carries what the domain side needs.
  - client_id: svc-rec-registry
    name: REC Registry Service
    secret: ${SVC_REC_REGISTRY_SECRET:-svc-rec-registry}
    scopes_prefix: rec-registry
    default_scopes:
      # Own resources
      - rec-registry.admin

  # ── Grants the overlay adds to *core* clients ─────────────────────────────
  #
  # These are the entries that make merge-before-sync mandatory rather than a
  # convenience. `celine-policies keycloak sync` recomputes each client's scope
  # assignments from the file it is handed and removes whatever is not in it —
  # outside the `--prune` branch, so no flag is involved. Syncing the core file
  # alone would leave `rec-registry.lookup` declared here and **stripped** from
  # the live client, and the symptom is a row filter that resolves nobody.

  - client_id: svc-ds-dataset-api
    default_scopes:
      # The PEP resolves a subject to their meters before filtering rows.
      - rec-registry.lookup
    extra_audiences:
      - svc-rec-registry

  - client_id: svc-ds-e2e
    default_scopes:
      # Seeds the REC registry so a `rec_registry` row filter has data to resolve.
      - rec-registry.admin
    extra_audiences:
      - svc-rec-registry
