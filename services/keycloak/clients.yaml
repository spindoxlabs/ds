# What **ds** needs from a Keycloak realm. Where ds owns the realm this is
# applied; where ds is a guest the host's own file must carry the same entries
# (`task keycloak:mirror` generates that section).
#
# **This file names no domain system.** A deployment's backend — the energy/REC
# registry in dev — declares its own scopes and clients in a domain overlay,
# `clients.<domain>.yaml`, and `ir-cli keycloak merge` combines them into the
# effective file the sync applies. The two are separate because which one applies
# is a deployment question: the overlay is precisely what must *not* cross into a
# host realm, where those are the host's services and not ds's to declare.
#
# Local dev realm. In production, ds clients are in the celine realm
# via celine-policies/clients.yaml.
realm: dataspaces

# The Keycloak client humans log in through, in front of which oauth2-proxy holds
# the browser session. Naming it here makes `celine-policies keycloak sync` attach
# a hardcoded-audience mapper for **every** client carrying a `scopes_prefix`, so
# a user's token passes audience validation at each service instead of each
# service having to relax its `aud` check.
#
# The client itself is declared in the realm import (`realm-*.json`), not created
# by the sync — the sync only adds mappers to it. A client with no
# `scopes_prefix` gets no mapper generated and must list the proxy in its own
# `extra_audiences` if a user token needs to reach it.
oauth2_proxy_client: oauth2_proxy

# =============================================================================
# SCOPES
# =============================================================================

scopes:
  # Dataset
  - name: dataset.admin
    description: Full access to Dataset service (includes restricted datasets)
  - name: dataset.query
    description: Execute dataset queries
  - name: dataset.read
    description: Read dataset metadata and schema
  - name: dataset.write
    description: Write dataset data

  # Dataspace Identity Registry
  - name: identity-registry.admin
    description: Admin access to dataspace identity-registry API
  - name: identity-registry.read
    description: Read participant registry and request credential presentations
  - name: identity-registry.resolve
    description: Resolve user identity by email
  - name: identity-registry.membership.read
    description: Check organization membership
  # Onboarding split out of identity-registry.admin so an operator console can be
  # granted exactly what a page needs. `identity-registry.admin` still satisfies
  # all of these (superset), so the CLI and bootstrap are unaffected.
  - name: identity-registry.organizations.read
    description: Read organisation applications and owners
  - name: identity-registry.organizations.write
    description: Register, verify and credential an organisation
  # Separate from .write on purpose: promotion is the irreversible act that turns
  # an applicant into a DSP counterparty.
  - name: identity-registry.organizations.promote
    description: Promote, suspend or revoke an organisation as a participant
  - name: identity-registry.agreements.read
    description: Read service agreements and their acceptances
  - name: identity-registry.participants.write
    description: Register, update or deactivate a DSP participant
  # What an external onboarding application actually does. Without these it had
  # to hold `identity-registry.admin` — a superset over DID and key management —
  # to issue a credential, register a membership and set one Keycloak attribute.
  - name: identity-registry.credentials.write
    description: Issue and revoke a data-subject credential
  # One (subject, type) question, not the roster. `GET /admin/credentials`
  # enumerates what a person holds and stays on `.admin`; this answers whether
  # they hold one named thing, which is what a sharing offer's `admitted_by`
  # needs. The connector may not hold `*.admin` — see the note below.
  - name: identity-registry.credentials.read
    description: Check whether a subject holds a valid credential of a given type
  - name: identity-registry.memberships.write
    description: Register or delete an organisation membership
  # Records the Keycloak user ↔ DID mapping. It used to also push a
  # `dataspace_did` attribute onto the Keycloak user; nothing read it, and it was
  # the only write this endpoint made into a realm ds may not own.
  - name: identity-registry.keycloak.sync
    description: Bind a Keycloak user to a dataspace DID

  # Connector
  - name: connector.admin
    description: Provider management (sync, assets, policies, contracts)
  - name: connector.provider.read
    description: Read provider assets, policies, contracts, transfers, authorizations
  - name: connector.provider.write
    description: Mutate provider config (sync, delete assets/policies/contracts)
  - name: connector.history.read
    description: Read EDC negotiation, agreement and transfer history
  # Drop the cached participant list. Deliberately its own grant rather than
  # `connector.internal`: this endpoint takes no input and returns a boolean,
  # while `connector.internal` also reaches the subject pools behind
  # /internal/consent/check and the data-plane signing keys behind
  # /internal/edr-jwks. A cache hint should not carry either.
  - name: connector.registry.invalidate
    description: Invalidate the cached participant registry
  # Drive the consumer side on the participant's behalf — today the federated
  # catalogue's crawler, calling POST /consumer/catalog. A *person* reaches the
  # same route with a ConsumerUser VC-JWT instead, so this is service-only.
  - name: connector.consumer.read
    description: Fetch a counterparty catalogue through the consumer connector
  - name: connector.internal
    description: Internal API (agreement/transfer/consent checks, audit, JWKS)
  - name: connector.webhook
    description: Accept EDC webhook events (transfer-process, contract-negotiation)
  - name: connector.consent.provision
    description: Provision a subject's standing sharing decision (POST /consent/admin/shares)
  # Keycloak's client-scope description is VARCHAR(255) and the realm API
  # answers 500 rather than a validation error when it overflows — keep these
  # one short line each. The rationale lives in dependencies.py.
  - name: connector.consent.read
    description: Is a negotiation awaiting a consent decision (GET /consent/pending)
  - name: connector.consent.audience
    description: Who consents to a sharing offer (GET /consent/admin/shares)
  - name: connector.ingestion.record
    description: Record a DSO/offline data handover (POST /admin/ingestion)
  - name: connector.disclosure.record
    description: Record data leaving the platform (POST /admin/disclosure)

  # Provenance
  - name: provenance.read
    description: Query provenance lineage and audit log
  - name: provenance.write
    description: Write provenance events and audit log entries

  # Federated Catalog
  - name: catalog.read
    description: Query federated catalog

# =============================================================================
# CLIENTS
# =============================================================================

clients:
  - client_id: svc-ds-identity-registry
    name: Dataspace Identity Registry
    secret: ${SVC_DS_IDENTITY_REGISTRY_SECRET:-svc-ds-identity-registry}
    scopes_prefix: identity-registry
    default_scopes:
      - identity-registry.admin
      # Promoting a participant changes who is in the registry; the connector
      # caches that list, so it is told rather than left to a 60s timer.
      - connector.registry.invalidate
    extra_audiences:
      - svc-ds-connector

  # **Held by a service outside this repository**, and that is why nothing here
  # authenticates as it. The holder is the domain platform's onboarding funnel,
  # which provisions ds identities for an approved organisation and then calls
  # `POST /consent/provision` on the connector (see
  # `services/connector/src/connector/api/v1/consent.py`, and the note in
  # `tests/test_consent_provisioning.py` saying the production caller is out of
  # repo).
  #
  # This is not an orphan, and the grants below must not be "cleaned up" because
  # `grep` finds no caller — removing them breaks organisation onboarding in a
  # deployment this repository cannot test. That ds and the domain platform can
  # share one realm is the whole point of `clients.host.generated.yaml`, which
  # exists for "a deployment where ds is a guest rather than the realm's owner".
  - client_id: svc-ds-onboarding
    name: Dataspace Onboarding
    secret: ${SVC_DS_ONBOARDING_SECRET:-svc-ds-onboarding}
    scopes_prefix: null
    # No `identity-registry.admin` — see the note below, which this entry used
    # to contradict directly. P6 had split organisations and agreements out of
    # the admin grant but left credentials, memberships and keycloak-sync on it,
    # which is most of what this client calls, so the superset stayed. Those
    # three now have their own permissions and this client holds exactly what
    # its approval path touches: a process that provisions people cannot also
    # mint or delete any identity in the dataspace.
    default_scopes:
      # Resolve the bound community's organisation at boot. Read-only — this
      # client no longer creates owners; a missing organisation is a startup
      # failure, not something to auto-create (see `Owner.status`).
      - identity-registry.organizations.read
      # Resolve an existing DID by email before minting, so a re-onboarded
      # person reuses their existing subject identity.
      - identity-registry.resolve
      # Issue a data-subject credential on approval, and revoke it on removal.
      - identity-registry.credentials.write
      # Register and delete the person's organisation membership.
      - identity-registry.memberships.write
      # Bind the person's Keycloak user to their dataspace DID. This writes a
      # mapping row in the registry's own database and nothing else — the
      # `dataspace_did` attribute push this comment used to name was removed
      # (see the scope's own description above), and it was the only write the
      # endpoint made into a realm ds may not own.
      - identity-registry.keycloak.sync
      # Provision a subject's standing sharing decision on the connector after
      # onboarding approval (POST /consent/admin/shares).
      - connector.consent.provision
      # Read that decision back before exporting against it: who currently
      # consents to this offer (GET /consent/admin/shares). Separate from
      # `.provision` because that one is in the `ds-participant-admin` bundle,
      # and a write grant must not carry bulk subject enumeration with it.
      - connector.consent.audience
      # Record a CSV export as a disclosure (Block C). This is the route to use:
      # `POST /admin/disclosure` on the connector computes the authorising
      # `consent_snapshot_hash` from the consent DB, which this service cannot
      # read — rulebook `L-2` requires that hash, so posting the event directly
      # is now refused (422) rather than silently accepted without it.
      - connector.disclosure.record
      # Retained, and **no longer for `DataDisclosed`**. Dropping it is a
      # decision about an out-of-repo service's other uses of `POST /prov/events`,
      # which are not visible from here — so it is left granted deliberately
      # rather than removed on an assumption.
      - provenance.write
    extra_audiences:
      - svc-ds-identity-registry
      - svc-ds-connector
      - svc-ds-provenance

  # No `*.admin` on a service client. Admin is an operator grant — it belongs to
  # an administrator's own token or an admin CLI acting under a named condition,
  # never to a long-lived process. It is also a superset ({service}.admin
  # satisfies any {service}.*), so putting it here would silently hand the portal
  # every connector permission that exists, including the machine-identity ones.
  # The portal gets exactly what its pages call.
  # **The portal's service account does one thing**, and this list says so.
  #
  # The portal is SSR and not an OIDC client: every page forwards the *signed-in
  # user's* access token, so what a person may do is decided by their own seat,
  # not by this client. The one call that cannot work that way is the
  # email→DID lookup at login (`hooks.server.ts` → `lib/server/identity-registry.ts`),
  # which happens before there is a verified user to forward — and both routes it
  # reaches are guarded by `identity-registry.resolve`. `client_credentials`
  # appears exactly once in the whole portal source.
  #
  # This used to carry ten grants and four audiences. Nine of the ten were
  # presented by nothing: they described the provider console's *pages*, which
  # forward the operator's token and always did. The tenth,
  # `connector.provider.write`, was real but not the portal's — `Taskfile.yml`
  # borrowed this client to `POST /provider/sync`, which is exactly the borrowing
  # `svc-ds-e2e` was created to end (see `libs/ds-e2e/src/ds_e2e/config.py`), and
  # those three call sites now use it.
  #
  # So: a grant belongs here only if the portal presents **its own** token for
  # it. A page acting for a person is not a reason to widen this client.
  - client_id: svc-ds-portal
    name: Dataspace Portal
    secret: ${SVC_DS_PORTAL_SECRET:-svc-ds-portal}
    service_account_enabled: true
    scopes_prefix: null
    default_scopes:
      - identity-registry.resolve
    extra_audiences:
      - svc-ds-identity-registry

  # The e2e harness drives endpoints that belong to several different callers —
  # the provider console, the onboarding service, the dataset-api. It gets its
  # own client so those grants are visible as a test identity instead of being
  # smuggled into a production one, and so revoking it cannot break a service.
  # Never enable this client outside a dev or CI realm.
  - client_id: svc-ds-e2e
    name: Dataspace E2E Harness (dev/CI only)
    secret: ${SVC_DS_E2E_SECRET:-svc-ds-e2e}
    service_account_enabled: true
    scopes_prefix: null
    default_scopes:
      - dataset.query
      - dataset.read
      - identity-registry.resolve
      - identity-registry.read
      - identity-registry.membership.read
      - connector.provider.read
      - connector.provider.write
      - connector.history.read
      - connector.consent.provision
      - connector.consent.audience
      - connector.ingestion.record
      - connector.disclosure.record
      # Machine-identity permissions: granted by name because they are exempt
      # from the admin superset (ds_auth.require_exact_permission).
      - connector.internal
      - provenance.read
      - provenance.write
      - catalog.read
    extra_audiences:
      - svc-ds-identity-registry
      - svc-ds-connector
      - svc-ds-provenance
      - svc-ds-federated-catalog

  - client_id: svc-ds-connector
    name: Dataspace Connector
    secret: ${SVC_DS_CONNECTOR_SECRET:-svc-ds-connector}
    scopes_prefix: connector
    default_scopes:
      - identity-registry.read
      - identity-registry.membership.read
      # A sharing offer may admit by credential type as well as by membership
      # (`admitted_by: [{credential_type: OrganizationCredential}]`). Both
      # constraints are evaluated in `services/circle.py`, and this is the second
      # one's read — narrow by design, because the alternative was the `.admin`
      # this file refuses a service client.
      - identity-registry.credentials.read
      - provenance.write
      # A consumer connector asks the provider whether one of its own
      # negotiations is parked on a consent decision, so a long REQUESTED can be
      # shown as "waiting on a person" instead of as silence (§6.6).
      - connector.consent.read
    extra_audiences:
      - svc-ds-identity-registry
      - svc-ds-provenance
      # The counterparty's connector — the audience of GET /consent/pending.
      - svc-ds-connector

  # Declared so the audience the provenance service verifies is a real identity.
  # It appears in four `extra_audiences` lists above and used to be defined as a
  # client in **neither** ds's file nor celine-policies': audience mappers emit a
  # literal string, so it worked — but an undeclared identity is one nobody can
  # revoke or audit, and with `oauth2_proxy_client` set it is also what makes a
  # user's token carry `aud: svc-ds-provenance` (the mapper is generated per
  # `scopes_prefix` client). It holds no grants of its own: nothing authenticates
  # *as* provenance, callers authenticate *to* it.
  - client_id: svc-ds-provenance
    name: Dataspace Provenance
    secret: ${SVC_DS_PROVENANCE_SECRET:-svc-ds-provenance}
    scopes_prefix: provenance
    default_scopes: []

  - client_id: svc-ds-federated-catalog
    name: Dataspace Federated Catalog
    secret: ${SVC_DS_FEDERATED_CATALOG_SECRET:-svc-ds-federated-catalog}
    scopes_prefix: catalog
    service_account_enabled: true
    default_scopes:
      - identity-registry.read
      # The crawl calls POST /consumer/catalog on the consumer-role connector.
      # It held no `connector.*` scope at all and worked only because that route
      # was unguarded — defects P0-1 and P1-3, which had to be fixed together.
      - connector.consumer.read
    extra_audiences:
      - svc-ds-identity-registry
      - svc-ds-connector

  # **An outbound identity, and only that.** This is what the dataset API
  # authenticates *with* to reach the connector's `/internal/*` — which is why it
  # holds `connector.internal` and names `svc-ds-connector` as an audience.
  #
  # **No `scopes_prefix`** (#14). It carried `scopes_prefix: dataset` until
  # 2026-08-28, which made it the declared owner of the `dataset.*` family and
  # therefore the audience the sync stamps on every token derived from that
  # prefix — a name **nothing validates**. The service that does validate one
  # checks `svc-dataset-api` (`docker-compose.dataset-api.yml`,
  # `CELINE_OIDC_AUDIENCE`), which is not declared in this realm, and the data
  # plane is reached with EDR tokens rather than realm-issued ones in any case.
  # `libs/ds-auth/src/ds_auth/bundles.py` says the same thing about the
  # vocabulary: `dataset.*` belongs to the data-plane service and is here only
  # because ds service clients call it.
  #
  # It also has to come off for this file to be mountable in a realm ds is a
  # guest in: `celine-policies` refuses two clients claiming one prefix, and
  # there `dataset.*` is owned by that deployment's own `svc-dataset-api`.
  - client_id: svc-ds-dataset-api
    name: Dataspace Dataset API
    secret: ${SVC_DS_DATASET_API_SECRET:-svc-ds-dataset-api}
    scopes_prefix: null
    default_scopes:
      - connector.internal
    extra_audiences:
      - svc-ds-connector

  - client_id: svc-edc
    name: Eclipse Dataspace Connector
    secret: ${SVC_EDC_SECRET:-svc-edc}
    scopes_prefix: null
    default_scopes:
      - identity-registry.read
      # "I am the EDC reporting its own negotiation state" — the webhook route
      # uses require_exact_permission, so connector.admin does not grant it.
      - connector.webhook
      # The ODRL constraint functions and the consent pending guard call
      # /internal/consent/check and /internal/participants/check. Before this
      # they presented X-Api-Key — the *same* secret as EDC's Management API
      # key, so one leak yielded contract administration, the data-plane
      # signing keys and the subject pools at once, and every /internal/* call
      # authenticated as the same anonymous bearer with no audit trail.
      - connector.internal
    extra_audiences:
      - svc-ds-identity-registry
      - svc-ds-connector
