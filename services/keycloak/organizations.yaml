realm: dataspaces

# Keycloak native organizations, provisioned by `ir-cli keycloak org-sync`.
#
# `participant_context_id` also makes the sync ensure the **organisation's
# client**, `svc-ds-connector-<alias>`: the one confidential client an
# organisation's connector and its own agents authenticate as. Its tokens carry
# `sub` = this value (a hardcoded-claim mapper the realm sync cannot create) and
# `ds_auth.MANAGEMENT_API_SCOPES`, which is what EDC's v5 management API checks.
# It must equal the EDC's `edc.participant.context.id`, which ds sets to the
# participant's DID — the value the classic runtime already stamped on every
# stored entity. Secret: `SVC_DS_CONNECTOR_<ALIAS>_SECRET`, the client id in dev.
#
# `collects_consent: true` (a declared governance flag) also ensures the
# organisation's **collector client**, `svc-ds-collector-<alias>`: its onboarding
# identity, with the same `sub` and only optional, audience-bound scopes
# (ADR-0026). Without the flag an existing collector client is disabled.
#
# `groups:` are **organisation role bundles** (`ds_auth.ORGANISATION_BUNDLES`:
# ds-participant-admin, ds-participant-viewer, ds-member), valid only inside the
# organisation that holds them: an operator for one participant is not an operator
# for another. A platform bundle (ds-admin, ds-onboarding-operator) listed here
# would grant nothing — those come only from a realm role (`platform-admin`,
# `ds-onboarding-operator`, in `realm-dataspaces-dev.json`). There are no realm
# groups at all. `ensure_org_group` creates these idempotently against a live
# realm, so the vocabulary needs no realm import to provision.
organizations:
  - alias: example-org
    name: Example Organization
    participant_context_id: did:web:rec.dataspaces.localhost
    # The community collects its members' consent: the sync also ensures its
    # collector client, `svc-ds-collector-example-org` (`sub` = the DID above,
    # no default scope, no EDC scope; secret `SVC_DS_COLLECTOR_EXAMPLE_ORG_SECRET`,
    # the client id in dev). ADR-0026.
    collects_consent: true
    domains: []
    attributes:
      type: ["dso"]
    members:
      # The provider's only authority: a participant seat inside this owner.
      - email: provider@example.test
        groups: [ds-participant-admin]
      # A data subject's and a consumer's actual authority is a VC, not a group —
      # `ds-member` is only "may browse the catalogue". See the bundle's comment.
      - email: subject@example.test
        groups: [ds-member]
      - email: consumer@example.test
        groups: [ds-member]
      - email: dual@example.test
        groups: [ds-member]
      # A foreign-looking organisation group that is **not** a ds bundle, so it
      # grants nothing on its own. The seat has authority only because the dev
      # Layer B alias map (`*_OIDC_GROUP_ALIASES` in `.env.local`) translates it
      # into `ds-participant-admin` — `ds-e2e --flow user-authority` asserts that
      # wiring, and that the translation grants the bundle and no more.
      - email: legacy@example.test
        groups: [legacy-provider-admin]
      # The read-only seat, scoped to this owner. What it can see is entirely
      # this membership. `ds-participant-viewer` was held by nobody until this
      # existed, so the bundle's read-only promise was asserted by unit tests and
      # by nothing on a running realm.
      - email: viewer@example.test
        groups: [ds-participant-viewer]

  # A **second** participant, which exists so per-owner scoping can be proven
  # rather than asserted.
  #
  # `gridops@example.test`'s only authority is the `ds-participant-admin` below,
  # inside this organisation — so a write to an asset `example-org` owns is a
  # cross-owner refusal. `ds-e2e --flow user-authority` uses this seat for
  # exactly that.
  #
  # `grid-operator` is already a verified owner in
  # `services/identity-registry/seed/owners.dev.yaml` (alias `grid`), so the alias
  # resolution the perimeter performs has something real to resolve.
  - alias: grid-operator
    name: Grid Operator
    participant_context_id: did:web:grid-operator.dataspaces.localhost
    domains: []
    attributes:
      type: ["dso"]
    members:
      - email: gridops@example.test
        groups: [ds-participant-admin]

  # The dev consumer participant (`docker-compose.third-party.yml`). Listed for
  # its client only: no seat is scoped to it, so it has no members. The alias is
  # its owner id in `services/identity-registry/seed/owners.dev.yaml`, as for the
  # two above — the same name the provisioning bundle gives a client.
  - alias: consumer-org
    name: Consumer Organization
    participant_context_id: did:web:third-party.dataspaces.localhost
    domains: []
    members: []
