################################
# oauth2-proxy — the human login surface
################################
#
# Caddy delegates authentication here with `forward_auth` (see
# services/caddy/Caddyfile). This process holds the browser session; the portal
# and every ds service still verify the JWT themselves and authorise on its
# groups. Nothing downstream trusts an `X-Auth-Request-*` header.
#
# Derived from a configuration already proven in the sibling platform, keeping
# the parts that were hard to get right: the sign-out chain, `set_xauthrequest`
# plus `pass_authorization_header`, and `skip_jwt_bearer_tokens` so machine
# callers are never sent to a login form.
#
# ds runs behind Caddy on **:80**, the port a portless `did:web` DID resolves on.
# Every URL below is therefore portless. If a gateway port is ever reintroduced
# it has to appear in *all* of them plus `whitelist_domains` — a port present in
# one URL and absent from another is the most likely cause of a redirect loop
# here.

################################
# Provider
################################
provider = "keycloak-oidc"
oidc_issuer_url = "http://keycloak.dataspaces.localhost/realms/dataspaces"

# `organization:*` requests every organisation the user belongs to, which is what
# makes Keycloak emit `organization.<alias>.groups` — the claim `ds_auth`
# expands into per-owner authority. Without it a participant-scoped seat grants
# nothing and the failure looks like a missing group.
scope = "openid email profile organization:*"

################################
# OAuth client (browser login)
################################
# Declared in the realm import, not created by `celine-policies keycloak sync` —
# the sync only attaches audience mappers to it. Dev secret equals the client id,
# the same convention the service clients use.
client_id = "oauth2_proxy"
client_secret = "oauth2_proxy"

# Keycloak advertises PKCE and oauth2-proxy warns when it is left off. Binding the
# authorization code to a per-request verifier means an intercepted code cannot be
# redeemed by anyone else — worth having even for a confidential client, and free.
code_challenge_method = "S256"

################################
# Listener
################################
# Internal only: no host port is published. Caddy reaches it over the compose
# network, so nothing collides with another stack's proxy on 4180.
http_address = "0.0.0.0:4180"
proxy_prefix = "/oauth2"

################################
# Redirects
################################
# Must match a redirect URI on the Keycloak client, port included.
redirect_url = "http://sso.dataspaces.localhost/oauth2/callback"

################################
# Upstreams
################################
# Required but ignored under forward_auth. A real upstream here would be a second
# path to the portal that bypasses Caddy's routing.
upstreams = [ "static://200" ]

################################
# Domains
################################
email_domains = [ "*" ]

cookie_domains = [ ".dataspaces.localhost" ]
# A bare domain matches the **default port only** — which is exactly :80, the one
# port Caddy now publishes, so no explicit port entry is needed. Reintroduce a
# gateway port and this list must name it, or oauth2-proxy refuses its own `rd=`
# target and drops the user on a blank page after a *successful* login.
whitelist_domains = [
  ".dataspaces.localhost",
]

################################
# Reverse proxy / headers
################################
reverse_proxy = true

set_xauthrequest = true
pass_user_headers = true

pass_authorization_header = true
set_authorization_header = true
pass_access_token = true

################################
# JWT / service tokens
################################
# A request that already carries a bearer token is a machine, not a browser:
# `task e2e`, `ir-cli` and every service-to-service call pass straight through
# instead of being redirected to a login form they cannot complete.
skip_jwt_bearer_tokens = true
insecure_oidc_allow_unverified_email = true

################################
# Cookies (DEV)
################################
# Dev value, in the same category as .env.local: deliberately weak and public.
# Production must supply a generated secret and set cookie_secure = true.
cookie_secret = "cc7f1b2e4a6d8f0b3c5e7a9d1f2b4c6e"
cookie_name = "_oauth2_proxy_ds"
cookie_secure = false
cookie_httponly = true
cookie_samesite = "lax"

cookie_expire = "30m"
cookie_refresh = "25m"

session_store_type = "cookie"

################################
# UX / logging
################################
# Straight to Keycloak — an interstitial "sign in with" page adds a click and a
# surface that has to be styled.
skip_provider_button = true

standard_logging = true
auth_logging = true
request_logging = false
