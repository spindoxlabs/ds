name: Dataspace Compliance Evidence

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  offline-evidence:
    name: Governance validation and audit evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install ds-governance
        working-directory: libs/governance
        run: uv sync --extra dev

      - name: Run governance validator tests
        working-directory: libs/governance
        # `tests/`, not `tests/tests/` — see the note in libs/governance/Taskfile.yml.
        run: uv run pytest tests/ -q

      - name: Validate governance and generate compliance artifacts
        working-directory: libs/governance
        # **No `--participants`.** There is no static participant list to point
        # at: `5484ff0` deleted `services/connector/governance/participants.yaml`
        # when participants stopped being declared in a file and started
        # enrolling themselves against the trust anchor (`DID-09`). This workflow
        # kept passing the flag anyway, so `owner-participant` and
        # `controller_role` silently never ran and CI was green because of it.
        #
        # So this job checks what an offline run *can* check, and says so. The
        # two participant checks need a live registry and run in
        # `task compliance:validate --identity-registry-url`, not here. Naming a
        # seed that does not exist is now a hard error rather than a skip — see
        # `_read_participants` in `compliance/validator.py`.
        #
        # **Iterated, not named.** This job validated `governance-rec` alone while
        # `governance-grid-operator` — a second producer, published by the same
        # platform to the same dataspace — was checked by nothing. Naming one of
        # two is the shape `TASK-09` fixed for `task build`, which built two of
        # three compose stacks and left the third on a stale image. A producer
        # added tomorrow is picked up here without editing this file.
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for f in ../../services/connector/governance-*/governance.yaml; do
            name="$(basename "$(dirname "$f")")"
            name="${name#governance-}"
            echo "::group::validating $name"
            uv run ds-governance evidence \
              --file "$f" \
              --owners ../../services/identity-registry/seed/owners.dev.yaml \
              --name "$name" \
              --out-dir ../../reports/compliance
            echo "::endgroup::"
            found=$((found + 1))
          done
          # A loop that matched nothing would exit 0 having validated nothing —
          # the `all([]) == True` failure this repository has already paid for
          # twice (`E2E-01`, `CI-02`).
          if [ "$found" -eq 0 ]; then
            echo "no services/connector/governance-*/governance.yaml matched — nothing was validated" >&2
            exit 1
          fi
          echo "validated $found producer(s)"

      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dataspace-compliance-evidence
          path: |
            reports/compliance/
