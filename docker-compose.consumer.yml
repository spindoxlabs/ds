# Consumer participant stack.
# Requires shared infra (docker compose up -d) running first.
#
#   task consumer:start

networks:
  dataspaces:
    name: dataspaces
    external: true

volumes:
  # Written by the trust anchor's bootstrap in `docker-compose.yml`. Declared
  # here too because `consumer:start` composes this file alone; both declarations
  # name the same project-scoped volume.
  enrolment:

services:
  # ── EDC consumer connector (Java, DCP-enabled) ──────────────────────────────
  edc-consumer:
    build:
      context: .
      dockerfile: services/edc-connector/Dockerfile
    command:
      [
        "sh",
        "-c",
        "java $$JAVA_OPTS -Dedc.fs.config=/config/consumer.properties -jar /connector.jar $$EDC_PROG_ARGS",
      ]
    volumes:
      - ./services/connector/config:/config:ro
    ports:
      - "29193:29193"
      - "29194:29194"
      - "29291:29291"
      - "29195:29195"
    environment:
      # Kept for anything still reading edc.api.key. The Management API key
      # that is actually enforced is WEB_HTTP_MANAGEMENT_AUTH_KEY below — and
      # since the extensions moved onto client credentials, that is now this
      # value's only job. One purpose, one boundary.
      EDC_PROG_ARGS: ${EDC_PROG_ARGS:-}
      EDC_API_KEY: ${EDC_API_KEY:-insecure-dev-key}
      # EDC reads the environment as config, converting ENVIRONMENT_NOTATION to
      # dot.notation (ConfigurationLoader → ConfigFactory.fromEnvironment). The
      # properties files cannot carry these: FsConfigurationExtension does a
      # plain Properties.load() and stores a ${...} placeholder verbatim.
      #
      # The Management API key — enforced now that auth.type=tokenbased is set.
      WEB_HTTP_MANAGEMENT_AUTH_KEY: ${EDC_API_KEY:-insecure-dev-key}
      # How the EDC authenticates to ds-connector: /internal/* during policy
      # evaluation, /webhooks/contract-negotiation to report negotiation state.
      DS_CONNECTOR_INTERNAL_TOKEN_URL: ${KEYCLOAK_TOKEN_URL:-http://172.17.0.1:9080/realms/dataspaces/protocol/openid-connect/token}
      DS_CONNECTOR_INTERNAL_CLIENT_ID: ${SVC_EDC_ID:-svc-edc}
      DS_CONNECTOR_INTERNAL_CLIENT_SECRET: ${SVC_EDC_SECRET:-svc-edc}
    depends_on:
      edc-db-create-consumer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:29191/api/check/health || exit 1"]
      interval: 10s
      start_period: 60s
      retries: 15
    networks: [dataspaces]

  # ── EDC database init (Flyway auto-creates schema on startup) ───────────────
  edc-db-create-consumer:
    image: postgres:17
    command: |
      sh -c 'until pg_isready -h 172.17.0.1 -p 35432 -U postgres; do sleep 1; done &&
      psql -h 172.17.0.1 -p 35432 -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='"'"'edc_consumer'"'"'" |
      grep -q 1 || psql -h 172.17.0.1 -p 35432 -U postgres -c "CREATE DATABASE edc_consumer"'
    environment:
      PGPASSWORD: postgres
    restart: "no"
    networks: [dataspaces]

  # ── Database init ────────────────────────────────────────────────────────────
  connector-db-create-consumer:
    image: postgres:17
    command: |
      sh -c 'until pg_isready -h 172.17.0.1 -p 35432 -U postgres; do sleep 1; done &&
      psql -h 172.17.0.1 -p 35432 -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='"'"'connector_consumer'"'"'" |
      grep -q 1 || psql -h 172.17.0.1 -p 35432 -U postgres -c "CREATE DATABASE connector_consumer"'
    environment:
      PGPASSWORD: postgres
    restart: "no"
    networks: [dataspaces]

  connector-db-init-consumer:
    build:
      context: .
      dockerfile: services/connector/Dockerfile
    command: ["alembic", "--config", "alembic.ini", "upgrade", "head"]
    working_dir: /app
    restart: "no"
    depends_on:
      connector-db-create-consumer:
        condition: service_completed_successfully
    environment:
      CONNECTOR_ROLE: consumer
      CONNECTOR_DATABASE_URL: postgresql+asyncpg://postgres:postgres@172.17.0.1:35432/connector_consumer
    networks: [dataspaces]

  provenance-db-create-consumer:
    image: postgres:17
    command: |
      sh -c 'until pg_isready -h 172.17.0.1 -p 35432 -U postgres; do sleep 1; done &&
      psql -h 172.17.0.1 -p 35432 -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='"'"'provenance_consumer'"'"'" |
      grep -q 1 || psql -h 172.17.0.1 -p 35432 -U postgres -c "CREATE DATABASE provenance_consumer"'
    environment:
      PGPASSWORD: postgres
    restart: "no"
    networks: [dataspaces]

  provenance-db-init-consumer:
    build:
      context: .
      dockerfile: services/provenance/Dockerfile
    command: ["alembic", "--config", "alembic.ini", "upgrade", "head"]
    working_dir: /app
    restart: "no"
    depends_on:
      provenance-db-create-consumer:
        condition: service_completed_successfully
    environment:
      PROVENANCE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@172.17.0.1:35432/provenance_consumer
    networks: [dataspaces]

  # ── Consumer connector (Python orchestration) ───────────────────────────────
  ds-connector-consumer:
    build:
      context: .
      dockerfile: services/connector/Dockerfile
    ports:
      - "31001:31001"
    env_file:
      - path: .env.celine
        required: false
    environment:
      CONNECTOR_ROLE: consumer
      # Drives the server *and* the image's HEALTHCHECK — see the Dockerfile.
      # The check probed 30001 regardless of role, so this container was never
      # healthy no matter how well it served.
      CONNECTOR_PORT: 31001
      EDC_CONSUMER_MANAGEMENT_URL: http://172.17.0.1:29193/management
      EDC_API_KEY: ${EDC_API_KEY:-insecure-dev-key}
      CONNECTOR_PARTICIPANT_ID: consumer
      CONNECTOR_PARTICIPANT_BASE_URL: https://consumer.dataspaces.localhost
      CONNECTOR_PARTICIPANT_DID: did:web:consumer.dataspaces.localhost
      CONNECTOR_CONSUMER_PARTICIPANT_DID: did:web:consumer.dataspaces.localhost
      CONNECTOR_PROVENANCE_URL: http://172.17.0.1:31000
      CONNECTOR_DATABASE_URL: postgresql+asyncpg://postgres:postgres@172.17.0.1:35432/connector_consumer
      CONNECTOR_GOVERNANCE_YAML_PATH: /governance/governance.yaml
      # The registry is committed configuration and rides the read-only
      # `/governance` mount. The fetched copies are cache, so they live under
      # `./data/` (root AGENTS.md) on a second, writable mount — the connector
      # must never be able to rewrite governance.yaml.
      CONNECTOR_VOCABULARIES_PATH: /governance/vocabularies.yaml
      CONNECTOR_VOCABULARY_CACHE_DIR: /data/vocabularies
      CONNECTOR_IDENTITY_REGISTRY_URL: http://172.17.0.1:30005
      CONNECTOR_KEYCLOAK_TOKEN_URL: http://172.17.0.1:9080/realms/dataspaces/protocol/openid-connect/token
      CONNECTOR_SERVICE_CLIENT_SECRET: ${SVC_DS_CONNECTOR_SECRET:-svc-ds-connector}
      # **Dev verifies user credentials for real** (`DID-17`). The key comes from
      # the anchor's DID document over did:web — plain HTTP here, because that is
      # what Caddy serves on :80 — and the trust list says whether that issuer is
      # still accredited. Dev used to skip the signature entirely, which made the
      # production path the only untested one (`T-1`).
      CONNECTOR_TRUST_ANCHOR_DID: did:web:trust-anchor.dataspaces.localhost
      CONNECTOR_TRUST_LIST_URL: http://trust-anchor.dataspaces.localhost/trust
      CONNECTOR_DID_WEB_USE_HTTPS: "false"
      CONNECTOR_VC_INSECURE_DEV: "false"
      # Off the DSP path: "is this negotiation of mine parked on a consent
      # decision?" Unset it and a long REQUESTED simply stays REQUESTED.
      CONNECTOR_PROVIDER_CONNECTOR_URL: http://172.17.0.1:30001
    depends_on:
      edc-consumer:
        condition: service_healthy
      connector-db-init-consumer:
        condition: service_completed_successfully
      ds-provenance-consumer:
        condition: service_healthy
    volumes:
      - ./services/connector/governance:/governance:ro
      # Shared with the host on purpose: `task vocab:fetch` fills it from
      # outside, and anything the container fetches lands there too — so a
      # restart is never the thing that repairs a cache. Narrow by design: `./data`
      # also holds credentials and keys, which this service has no business seeing.
      - ./data/vocabularies:/data/vocabularies
    healthcheck:
      # Same probe as the image's, overridden only for the faster timings that
      # `depends_on: service_healthy` waits on. The port comes from
      # CONNECTOR_PORT so this cannot drift from what the server bound.
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:%s/health' % os.environ['CONNECTOR_PORT'], timeout=2)\""]
      interval: 10s
      start_period: 20s
      retries: 10
    extra_hosts:
      # did:web resolution goes to the host the DID names, not to a configured
      # URL — `did:web:trust-anchor.dataspaces.localhost` resolves at
      # http://trust-anchor.dataspaces.localhost/.well-known/did.json, which
      # Caddy serves on the host's :80.
      - "trust-anchor.dataspaces.localhost:host-gateway"
    networks: [dataspaces]

  # ── Consumer provenance ──────────────────────────────────────────────────────
  ds-provenance-consumer:
    build:
      context: .
      dockerfile: services/provenance/Dockerfile
    command: ["uvicorn", "provenance.main:app", "--host", "0.0.0.0", "--port", "31000"]
    ports:
      - "31000:31000"
    environment:
      PROVENANCE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@172.17.0.1:35432/provenance_consumer
      # See the provider stack: an unset issuer means tokens are accepted without
      # signature, audience or issuer verification.
      PROVENANCE_OIDC_ISSUER_URL: http://keycloak.dataspaces.localhost/realms/dataspaces
      # The same settings as the connector's, for the same reason (`DID-17`):
      # the same credential is presented to both services and must verify
      # identically, so these must not drift.
      PROVENANCE_TRUST_ANCHOR_DID: did:web:trust-anchor.dataspaces.localhost
      PROVENANCE_TRUST_LIST_URL: http://trust-anchor.dataspaces.localhost/trust
      PROVENANCE_DID_WEB_USE_HTTPS: "false"
      PROVENANCE_VC_INSECURE_DEV: "false"
    extra_hosts:
      - "keycloak.dataspaces.localhost:host-gateway"
      # did:web resolution goes to the host the DID names, through Caddy on :80.
      - "trust-anchor.dataspaces.localhost:host-gateway"
    depends_on:
      provenance-db-init-consumer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:31000/health', timeout=2)\""]
      interval: 10s
      start_period: 10s
      retries: 10
    networks: [dataspaces]

  # ── The consumer's own identity registry (`DID-05`) ─────────────────────────
  #
  # One organisation, one instance, one key. This is what makes the split real
  # rather than cosmetic: the provider generates its own DID key here, in its own
  # database, encrypted with its own key, and the trust anchor never sees it.
  #
  # It serves only the holder surface — its own `did.json`, its own STS, its own
  # credential service. Every registry question (who is a participant, what was
  # issued, what was agreed) still goes to the anchor, which is why
  # `CONNECTOR_IDENTITY_REGISTRY_URL` above is unchanged and must stay that way.
  ir-consumer-db-create:
    image: postgres:17
    command: |
      sh -c 'until pg_isready -h 172.17.0.1 -p 35432 -U postgres; do sleep 1; done &&
      psql -h 172.17.0.1 -p 35432 -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='"'"'ir_consumer'"'"'" |
      grep -q 1 || psql -h 172.17.0.1 -p 35432 -U postgres -c "CREATE DATABASE ir_consumer"'
    environment:
      PGPASSWORD: postgres
    restart: "no"
    networks: [dataspaces]

  ir-consumer-db-init:
    build:
      context: .
      dockerfile: services/identity-registry/Dockerfile
    command: ["alembic", "--config", "alembic.ini", "upgrade", "head"]
    working_dir: /app
    restart: "no"
    depends_on:
      ir-consumer-db-create:
        condition: service_completed_successfully
    environment:
      IDENTITY_REGISTRY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@172.17.0.1:35432/ir_consumer
    networks: [dataspaces]

  ir-consumer:
    build:
      context: .
      dockerfile: services/identity-registry/Dockerfile
    restart: unless-stopped
    ports:
      - "30007:30005"
    environment:
      IDENTITY_REGISTRY_ROLE: participant
      IDENTITY_REGISTRY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@172.17.0.1:35432/ir_consumer
      IDENTITY_REGISTRY_PARTICIPANT_DID: did:web:consumer.dataspaces.localhost
      IDENTITY_REGISTRY_PARTICIPANT_DSP_ADDRESS: http://172.17.0.1:29194/protocol/2025-1
      # Its own host. This is the value that goes into its DID document as the
      # `CredentialService` endpoint, so it has to be reachable by a counterparty
      # — an EDC in a container, a host process, or a stranger.
      IDENTITY_REGISTRY_IDENTITY_REGISTRY_PUBLIC_URL: http://consumer.dataspaces.localhost
      IDENTITY_REGISTRY_TRUST_ANCHOR_DOMAIN: trust-anchor.dataspaces.localhost
      IDENTITY_REGISTRY_TRUST_ANCHOR_URL: http://172.17.0.1:30005
      # **Its own**, and different from the anchor's. Sharing one would put every
      # key back in one place and make the split cosmetic (`D-47`).
      IDENTITY_REGISTRY_ENCRYPTION_KEY: ${IR_CONSUMER_ENCRYPTION_KEY:-dev-consumer-encryption-key}
      IDENTITY_REGISTRY_PARTICIPANT_STS_SECRET: ${IR_CONSUMER_STS_SECRET:-insecure-dev-secret}
      IDENTITY_REGISTRY_DID_WEB_USE_HTTPS: "false"
    depends_on:
      ir-consumer-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:30005/health', timeout=2)\""]
      interval: 10s
      start_period: 15s
      retries: 10
    networks: [dataspaces]

  # Generates the key, publishes the document, then enrols with the anchor.
  #
  # **Two prerequisites this file cannot express**, because both live in
  # `docker-compose.yml` and `consumer:start` composes this file alone:
  #
  #   1. Caddy must already route `consumer.dataspaces.localhost` here — the
  #      anchor *fetches this participant's DID document* to verify the enrolment
  #      signature, so an instance that is up but not yet routed fails with a
  #      resolution error that says nothing about Caddy.
  #   2. `identity-registry-bootstrap` must have written the enrolment code.
  #
  # `task start` orders them (`infra:start` → `identity:bootstrap` →
  # `consumer:start`), and that ordering is now load-bearing rather than
  # cosmetic. Starting this stack against a cold anchor fails on the missing
  # code file, loudly, which is the right way round.
  ir-consumer-bootstrap:
    build:
      context: .
      dockerfile: services/identity-registry/Dockerfile
    restart: "no"
    depends_on:
      ir-consumer:
        condition: service_healthy
    environment:
      IDENTITY_REGISTRY_ROLE: participant
      IDENTITY_REGISTRY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@172.17.0.1:35432/ir_consumer
      IDENTITY_REGISTRY_PARTICIPANT_DID: did:web:consumer.dataspaces.localhost
      IDENTITY_REGISTRY_PARTICIPANT_DSP_ADDRESS: http://172.17.0.1:29194/protocol/2025-1
      IDENTITY_REGISTRY_IDENTITY_REGISTRY_PUBLIC_URL: http://consumer.dataspaces.localhost
      IDENTITY_REGISTRY_TRUST_ANCHOR_DOMAIN: trust-anchor.dataspaces.localhost
      IDENTITY_REGISTRY_TRUST_ANCHOR_URL: http://172.17.0.1:30005
      IDENTITY_REGISTRY_ENCRYPTION_KEY: ${IR_CONSUMER_ENCRYPTION_KEY:-dev-consumer-encryption-key}
      IDENTITY_REGISTRY_PARTICIPANT_STS_SECRET: ${IR_CONSUMER_STS_SECRET:-insecure-dev-secret}
      IDENTITY_REGISTRY_DID_WEB_USE_HTTPS: "false"
    volumes:
      - enrolment:/enrolment:ro
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        # Read the code into a variable and **check it**. `--code "$$(cat …)"`
        # looked right and failed open: a missing file made `cat` fail, `set -e`
        # did not trip on a substitution inside an argument, and `--code ""` took
        # the "no code given" branch — so the bootstrap printed *ready* having
        # enrolled nothing. Observed on the first live run of `DID-05`.
        CODE="$$(cat /enrolment/consumer-org.code 2>/dev/null || true)"
        if [ -z "$$CODE" ]; then
          echo "No enrolment code at /enrolment/consumer-org.code." >&2
          echo "The trust anchor writes it — run 'task identity:bootstrap' first." >&2
          exit 1
        fi
        ir-cli participant init --code "$$CODE"
        echo "Consumer identity ready and enrolled"
    networks: [dataspaces]
