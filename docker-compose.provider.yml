# Provider participant stack.
# Requires shared infra (docker compose up -d) running first.
#
#   task provider:start

networks:
  dataspaces:
    name: dataspaces
    external: true

volumes:
  # Written by the trust anchor's bootstrap in `docker-compose.yml`. Declared
  # here too because `provider:start` composes this file alone; both declarations
  # name the same project-scoped volume.
  enrolment:

services:
  # ── EDC provider connector (Java, DCP-enabled) ──────────────────────────────
  edc-provider:
    build:
      context: .
      dockerfile: services/edc-connector/Dockerfile
    command:
      [
        "sh",
        "-c",
        "java $$JAVA_OPTS -Dedc.fs.config=/config/provider.properties -jar /connector.jar $$EDC_PROG_ARGS",
      ]
    volumes:
      - ./services/connector/config:/config:ro
    ports:
      - "19193:19193"
      - "19194:19194"
      - "19291:19291"
      - "19195:19195"
    environment:
      # Kept for anything still reading edc.api.key. The Management API key
      # that is actually enforced is WEB_HTTP_MANAGEMENT_AUTH_KEY below — and
      # since the extensions moved onto client credentials, that is now this
      # value's only job. One purpose, one boundary.
      EDC_PROG_ARGS: ${EDC_PROG_ARGS:-}
      EDC_API_KEY: ${EDC_API_KEY:-insecure-dev-key}
      # EDC reads the environment as config, converting ENVIRONMENT_NOTATION to
      # dot.notation (ConfigurationLoader → ConfigFactory.fromEnvironment). The
      # properties files cannot carry these: FsConfigurationExtension does a
      # plain Properties.load() and stores a ${...} placeholder verbatim.
      #
      # The Management API key — enforced now that auth.type=tokenbased is set.
      WEB_HTTP_MANAGEMENT_AUTH_KEY: ${EDC_API_KEY:-insecure-dev-key}
      # How the EDC authenticates to ds-connector: /internal/* during policy
      # evaluation, /webhooks/contract-negotiation to report negotiation state.
      DS_CONNECTOR_INTERNAL_TOKEN_URL: ${KEYCLOAK_TOKEN_URL:-http://172.17.0.1:9080/realms/dataspaces/protocol/openid-connect/token}
      DS_CONNECTOR_INTERNAL_CLIENT_ID: ${SVC_EDC_ID:-svc-edc}
      DS_CONNECTOR_INTERNAL_CLIENT_SECRET: ${SVC_EDC_SECRET:-svc-edc}
    depends_on:
      edc-db-create-provider:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:19191/api/check/health || exit 1"]
      interval: 10s
      start_period: 60s
      retries: 15
    networks: [dataspaces]

  # ── EDC database init (Flyway auto-creates schema on startup) ───────────────
  edc-db-create-provider:
    image: postgres:17
    command: |
      sh -c 'until pg_isready -h 172.17.0.1 -p 35432 -U postgres; do sleep 1; done &&
      psql -h 172.17.0.1 -p 35432 -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='"'"'edc_provider'"'"'" |
      grep -q 1 || psql -h 172.17.0.1 -p 35432 -U postgres -c "CREATE DATABASE edc_provider"'
    environment:
      PGPASSWORD: postgres
    restart: "no"
    networks: [dataspaces]

  # ── Database init ────────────────────────────────────────────────────────────
  connector-db-create-provider:
    image: postgres:17
    command: |
      sh -c 'until pg_isready -h 172.17.0.1 -p 35432 -U postgres; do sleep 1; done &&
      psql -h 172.17.0.1 -p 35432 -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='"'"'connector_provider'"'"'" |
      grep -q 1 || psql -h 172.17.0.1 -p 35432 -U postgres -c "CREATE DATABASE connector_provider"'
    environment:
      PGPASSWORD: postgres
    restart: "no"
    networks: [dataspaces]

  connector-db-init-provider:
    build:
      context: .
      dockerfile: services/connector/Dockerfile
    command: ["alembic", "--config", "alembic.ini", "upgrade", "head"]
    working_dir: /app
    restart: "no"
    depends_on:
      connector-db-create-provider:
        condition: service_completed_successfully
    environment:
      CONNECTOR_ROLE: provider
      CONNECTOR_DATABASE_URL: postgresql+asyncpg://postgres:postgres@172.17.0.1:35432/connector_provider
    networks: [dataspaces]

  provenance-db-create-provider:
    image: postgres:17
    command: |
      sh -c 'until pg_isready -h 172.17.0.1 -p 35432 -U postgres; do sleep 1; done &&
      psql -h 172.17.0.1 -p 35432 -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='"'"'provenance_provider'"'"'" |
      grep -q 1 || psql -h 172.17.0.1 -p 35432 -U postgres -c "CREATE DATABASE provenance_provider"'
    environment:
      PGPASSWORD: postgres
    restart: "no"
    networks: [dataspaces]

  provenance-db-init-provider:
    build:
      context: .
      dockerfile: services/provenance/Dockerfile
    command: ["alembic", "--config", "alembic.ini", "upgrade", "head"]
    working_dir: /app
    restart: "no"
    depends_on:
      provenance-db-create-provider:
        condition: service_completed_successfully
    environment:
      PROVENANCE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@172.17.0.1:35432/provenance_provider
    networks: [dataspaces]

  # ── Provider connector (Python orchestration) ───────────────────────────────
  ds-connector-provider:
    build:
      context: .
      dockerfile: services/connector/Dockerfile
    ports:
      - "30001:30001"
    env_file:
      - path: .env.celine
        required: false
    environment:
      CONNECTOR_ROLE: provider
      # Drives the server *and* the image's HEALTHCHECK — see the Dockerfile.
      CONNECTOR_PORT: 30001
      EDC_PROVIDER_MANAGEMENT_URL: http://172.17.0.1:19193/management
      EDC_API_KEY: ${EDC_API_KEY:-insecure-dev-key}
      CONNECTOR_PARTICIPANT_ID: provider
      CONNECTOR_PARTICIPANT_BASE_URL: https://provider.dataspaces.localhost
      CONNECTOR_PARTICIPANT_DID: did:web:provider.dataspaces.localhost
      CONNECTOR_CONSUMER_PARTICIPANT_DID: did:web:consumer.dataspaces.localhost
      CONNECTOR_PROVENANCE_URL: http://172.17.0.1:30000
      CONNECTOR_DATABASE_URL: postgresql+asyncpg://postgres:postgres@172.17.0.1:35432/connector_provider
      CONNECTOR_GOVERNANCE_YAML_PATH: /governance/governance.yaml
      # The registry is committed configuration and rides the read-only
      # `/governance` mount. The fetched copies are cache, so they live under
      # `./data/` (root AGENTS.md) on a second, writable mount — the connector
      # must never be able to rewrite governance.yaml.
      CONNECTOR_VOCABULARIES_PATH: /governance/vocabularies.yaml
      CONNECTOR_VOCABULARY_CACHE_DIR: /data/vocabularies
      # The vault seed EDC signs EDR tokens with — /internal/edr-jwks serves
      # its public half so the data plane can verify a token nothing else does.
      CONNECTOR_EDC_VAULT_FILE: /edc-config/provider-vault.properties
      CONNECTOR_OIDC_GROUP_ALIASES: ${CONNECTOR_OIDC_GROUP_ALIASES:-}
      CONNECTOR_IDENTITY_REGISTRY_URL: http://172.17.0.1:30005
      CONNECTOR_KEYCLOAK_TOKEN_URL: http://172.17.0.1:9080/realms/dataspaces/protocol/openid-connect/token
      CONNECTOR_SERVICE_CLIENT_SECRET: ${SVC_DS_CONNECTOR_SECRET:-svc-ds-connector}
    depends_on:
      edc-provider:
        condition: service_healthy
      connector-db-init-provider:
        condition: service_completed_successfully
      ds-provenance-provider:
        condition: service_healthy
    volumes:
      - ./services/connector/config:/edc-config:ro
      - ./services/connector/governance:/governance:ro
      # Shared with the host on purpose: `task vocab:fetch` fills it from
      # outside, and anything the container fetches lands there too — so a
      # restart is never the thing that repairs a cache. Narrow by design: `./data`
      # also holds credentials and keys, which this service has no business seeing.
      - ./data/vocabularies:/data/vocabularies
    healthcheck:
      # Same probe as the image's, overridden only for the faster timings that
      # `depends_on: service_healthy` waits on. The port comes from
      # CONNECTOR_PORT so this cannot drift from what the server bound.
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:%s/health' % os.environ['CONNECTOR_PORT'], timeout=2)\""]
      interval: 10s
      start_period: 20s
      retries: 10
    networks: [dataspaces]

  # ── Provider provenance ──────────────────────────────────────────────────────
  ds-provenance-provider:
    build:
      context: .
      dockerfile: services/provenance/Dockerfile
    ports:
      - "30000:30000"
    environment:
      PROVENANCE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@172.17.0.1:35432/provenance_provider
      # Verify bearer tokens in dev too. With no issuer, PROVENANCE_OIDC_INSECURE_DEV
      # defaults true and ds_auth decodes without checking the signature — so every
      # scope test in this stack was passing on an unverified claim, including the
      # ones that read a data subject's record. Same host + extra_hosts pattern the
      # portal and the celine dataset-api already use.
      PROVENANCE_OIDC_ISSUER_URL: http://keycloak.dataspaces.localhost/realms/dataspaces
    extra_hosts:
      - "keycloak.dataspaces.localhost:host-gateway"
    depends_on:
      provenance-db-init-provider:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:30000/health', timeout=2)\""]
      interval: 10s
      start_period: 10s
      retries: 10
    networks: [dataspaces]

  # ── Dataset API (mock, overridable via DATASET_API_EXTERNAL_QUERY_URL) ──────
  dataset-api-provider:
    build:
      context: .
      dockerfile: services/dataset-api-mock/Dockerfile
    ports:
      # Host port is env-driven so the **real** dataset-api can take 30002 while
      # the mock stays reachable for comparison. Set DATASET_API_MOCK_PORT in
      # .env.local when running `docker-compose.dataset-api.yml`; both services
      # binding 30002 is what makes `docker:restart` fail with "port is already
      # allocated".
      - "${DATASET_API_MOCK_PORT:-30002}:30002"
    environment:
      DATASET_API_CONNECTOR_INTERNAL_URL: http://172.17.0.1:30001
      DATASET_API_EXTERNAL_QUERY_URL: ${DATASET_API_EXTERNAL_QUERY_URL:-}
      # The PEP authenticates to /internal/* as itself, not with the shared
      # X-Api-Key that doubles as EDC's Management API key.
      DATASET_API_KEYCLOAK_TOKEN_URL: ${KEYCLOAK_TOKEN_URL:-http://172.17.0.1:9080/realms/dataspaces/protocol/openid-connect/token}
      DATASET_API_SERVICE_CLIENT_ID: ${SVC_DS_DATASET_API_ID:-svc-ds-dataset-api}
      DATASET_API_SERVICE_CLIENT_SECRET: ${SVC_DS_DATASET_API_SECRET:-svc-ds-dataset-api}
    depends_on:
      ds-connector-provider:
        condition: service_healthy
    networks: [dataspaces]

  # ── Portal (SvelteKit) ────────────────────────────────────────────────────────
  ds-portal:
    build:
      context: .
      dockerfile: services/portal/Dockerfile
    ports:
      - "30004:30004"
    env_file:
      - path: .env.celine
        required: false
    environment:
      CONNECTOR_URL: http://ds-connector-provider:30001
      PROVENANCE_URL: http://ds-provenance-provider:30000
      FEDERATED_CATALOG_URL: http://ds-federated-catalog-provider:30003
      IDENTITY_REGISTRY_URL: http://identity-registry:30005
      CATALOGUE_URL: http://dataset-api-provider:30002
      CONSUMER_CONNECTOR_URL: http://172.17.0.1:31001
      # Explicit, so the portal's in-code fallbacks never decide a participant
      # identity: a wrong assigner fails a negotiation with no useful error.
      CONSUMER_PARTICIPANT_DID: did:web:consumer.dataspaces.localhost
      CONSUMER_DEFAULT_ASSIGNER: did:web:provider.dataspaces.localhost
      CONSUMER_DEFAULT_COUNTER_PARTY_ADDRESS: http://172.17.0.1:19194/protocol/2025-1
      # The realm issuer, used for the portal's own client-credentials grant as
      # `svc-ds-portal` (identity-registry lookups). The portal is no longer an
      # OIDC *login* client — oauth2-proxy holds the browser session — so there is
      # no login client id, no client secret and no AUTH_SECRET here any more.
      KEYCLOAK_ISSUER_URL: http://keycloak.dataspaces.localhost/realms/dataspaces
      # Where to send a browser to start or end a session. Caddy routes /oauth2/*
      # on this host to the proxy.
      OAUTH2_PROXY_BASE_URL: http://sso.dataspaces.localhost
      ORIGIN: http://portal.dataspaces.localhost
      PORTAL_SERVICE_CLIENT_ID: svc-ds-portal
      PORTAL_SERVICE_CLIENT_SECRET: ${SVC_DS_PORTAL_SECRET:-svc-ds-portal}
    depends_on:
      ds-connector-provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:30004/', r => process.exit(r.statusCode < 500 ? 0 : 1))\""]
      interval: 10s
      start_period: 15s
      retries: 10
    extra_hosts:
      - "keycloak.dataspaces.localhost:host-gateway"
    networks: [dataspaces]

  # ── Federated catalog ────────────────────────────────────────────────────────
  ds-federated-catalog-provider:
    build:
      context: .
      dockerfile: services/federated-catalog/Dockerfile
    ports:
      - "30003:30003"
    env_file:
      - path: .env.celine
        required: false
    environment:
      CATALOG_CONNECTOR_URL: http://172.17.0.1:31001
      CATALOG_IDENTITY_REGISTRY_URL: http://172.17.0.1:30005
      CATALOG_BASE_URL: https://federated-catalog.dataspaces.localhost
      CATALOG_KEYCLOAK_TOKEN_URL: http://172.17.0.1:9080/realms/dataspaces/protocol/openid-connect/token
      CATALOG_SERVICE_CLIENT_SECRET: ${SVC_DS_FEDERATED_CATALOG_SECRET:-svc-ds-federated-catalog}
      # Without an issuer, `oidc_insecure_dev` defaults true and `ds_auth`
      # decodes the bearer without checking a signature — so every catalogue
      # authorization decision in dev was asserted against unverified claims,
      # and a forged token carrying `catalog.read` was accepted. Same defect and
      # same fix as `PROVENANCE_OIDC_ISSUER_URL` above. The audience path was
      # checked first: `svc-ds-portal` and `svc-ds-e2e` both carry
      # `svc-ds-federated-catalog` in `extra_audiences`, and user tokens get it
      # from the `scopes_prefix: catalog` mapper on oauth2_proxy.
      CATALOG_OIDC_ISSUER_URL: http://keycloak.dataspaces.localhost/realms/dataspaces
    depends_on:
      ds-connector-provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:30003/health', timeout=2)\""]
      interval: 10s
      start_period: 20s
      retries: 10
    extra_hosts:
      - "keycloak.dataspaces.localhost:host-gateway"
    networks: [dataspaces]

  # ── The provider's own identity registry (`DID-05`) ─────────────────────────
  #
  # One organisation, one instance, one key. This is what makes the split real
  # rather than cosmetic: the provider generates its own DID key here, in its own
  # database, encrypted with its own key, and the trust anchor never sees it.
  #
  # It serves only the holder surface — its own `did.json`, its own STS, its own
  # credential service. Every registry question (who is a participant, what was
  # issued, what was agreed) still goes to the anchor, which is why
  # `CONNECTOR_IDENTITY_REGISTRY_URL` above is unchanged and must stay that way.
  ir-provider-db-create:
    image: postgres:17
    command: |
      sh -c 'until pg_isready -h 172.17.0.1 -p 35432 -U postgres; do sleep 1; done &&
      psql -h 172.17.0.1 -p 35432 -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='"'"'ir_provider'"'"'" |
      grep -q 1 || psql -h 172.17.0.1 -p 35432 -U postgres -c "CREATE DATABASE ir_provider"'
    environment:
      PGPASSWORD: postgres
    restart: "no"
    networks: [dataspaces]

  ir-provider-db-init:
    build:
      context: .
      dockerfile: services/identity-registry/Dockerfile
    command: ["alembic", "--config", "alembic.ini", "upgrade", "head"]
    working_dir: /app
    restart: "no"
    depends_on:
      ir-provider-db-create:
        condition: service_completed_successfully
    environment:
      IDENTITY_REGISTRY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@172.17.0.1:35432/ir_provider
    networks: [dataspaces]

  ir-provider:
    build:
      context: .
      dockerfile: services/identity-registry/Dockerfile
    restart: unless-stopped
    ports:
      - "30006:30005"
    environment:
      IDENTITY_REGISTRY_ROLE: participant
      IDENTITY_REGISTRY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@172.17.0.1:35432/ir_provider
      IDENTITY_REGISTRY_PARTICIPANT_DID: did:web:provider.dataspaces.localhost
      IDENTITY_REGISTRY_PARTICIPANT_DSP_ADDRESS: http://172.17.0.1:19194/protocol/2025-1
      # Its own host. This is the value that goes into its DID document as the
      # `CredentialService` endpoint, so it has to be reachable by a counterparty
      # — an EDC in a container, a host process, or a stranger.
      IDENTITY_REGISTRY_IDENTITY_REGISTRY_PUBLIC_URL: http://provider.dataspaces.localhost
      IDENTITY_REGISTRY_TRUST_ANCHOR_DOMAIN: trust-anchor.dataspaces.localhost
      IDENTITY_REGISTRY_TRUST_ANCHOR_URL: http://172.17.0.1:30005
      # **Its own**, and different from the anchor's. Sharing one would put every
      # key back in one place and make the split cosmetic (`D-47`).
      IDENTITY_REGISTRY_ENCRYPTION_KEY: ${IR_PROVIDER_ENCRYPTION_KEY:-dev-provider-encryption-key}
      IDENTITY_REGISTRY_PARTICIPANT_STS_SECRET: ${IR_PROVIDER_STS_SECRET:-insecure-dev-secret}
      IDENTITY_REGISTRY_DID_WEB_USE_HTTPS: "false"
    depends_on:
      ir-provider-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:30005/health', timeout=2)\""]
      interval: 10s
      start_period: 15s
      retries: 10
    networks: [dataspaces]

  # Generates the key, publishes the document, then enrols with the anchor.
  #
  # **Two prerequisites this file cannot express**, because both live in
  # `docker-compose.yml` and `provider:start` composes this file alone:
  #
  #   1. Caddy must already route `provider.dataspaces.localhost` here — the
  #      anchor *fetches this participant's DID document* to verify the enrolment
  #      signature, so an instance that is up but not yet routed fails with a
  #      resolution error that says nothing about Caddy.
  #   2. `identity-registry-bootstrap` must have written the enrolment code.
  #
  # `task start` orders them (`infra:start` → `identity:bootstrap` →
  # `provider:start`), and that ordering is now load-bearing rather than
  # cosmetic. Starting this stack against a cold anchor fails on the missing
  # code file, loudly, which is the right way round.
  ir-provider-bootstrap:
    build:
      context: .
      dockerfile: services/identity-registry/Dockerfile
    restart: "no"
    depends_on:
      ir-provider:
        condition: service_healthy
    environment:
      IDENTITY_REGISTRY_ROLE: participant
      IDENTITY_REGISTRY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@172.17.0.1:35432/ir_provider
      IDENTITY_REGISTRY_PARTICIPANT_DID: did:web:provider.dataspaces.localhost
      IDENTITY_REGISTRY_PARTICIPANT_DSP_ADDRESS: http://172.17.0.1:19194/protocol/2025-1
      IDENTITY_REGISTRY_IDENTITY_REGISTRY_PUBLIC_URL: http://provider.dataspaces.localhost
      IDENTITY_REGISTRY_TRUST_ANCHOR_DOMAIN: trust-anchor.dataspaces.localhost
      IDENTITY_REGISTRY_TRUST_ANCHOR_URL: http://172.17.0.1:30005
      IDENTITY_REGISTRY_ENCRYPTION_KEY: ${IR_PROVIDER_ENCRYPTION_KEY:-dev-provider-encryption-key}
      IDENTITY_REGISTRY_PARTICIPANT_STS_SECRET: ${IR_PROVIDER_STS_SECRET:-insecure-dev-secret}
      IDENTITY_REGISTRY_DID_WEB_USE_HTTPS: "false"
    volumes:
      - enrolment:/enrolment:ro
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        # Read the code into a variable and **check it**. `--code "$$(cat …)"`
        # looked right and failed open: a missing file made `cat` fail, `set -e`
        # did not trip on a substitution inside an argument, and `--code ""` took
        # the "no code given" branch — so the bootstrap printed *ready* having
        # enrolled nothing. Observed on the first live run of `DID-05`.
        CODE="$$(cat /enrolment/example-org.code 2>/dev/null || true)"
        if [ -z "$$CODE" ]; then
          echo "No enrolment code at /enrolment/example-org.code." >&2
          echo "The trust anchor writes it — run 'task identity:bootstrap' first." >&2
          exit 1
        fi
        ir-cli participant init --code "$$CODE"
        echo "Provider identity ready and enrolled"
    networks: [dataspaces]
