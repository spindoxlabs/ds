version: "3"

# ── Root Taskfile ────────────────────────────────────────────────────────────
#
# Quick start:
#   task start
#
# All local dev defaults live in .env.local (committed).
# Override per-machine in .env (gitignored).
#
# Deployment-specific tasks (paths to pipeline repos, overlay directories)
# go in taskfile.local.yaml — see taskfile.local.example.yaml.
#
includes:
  local:
    taskfile: taskfile.local.yaml
    optional: true
    flatten: true

dotenv: [".env", ".env.local"]

env:
  COMPOSE_PROJECT_NAME: dataspaces

vars:
  # Pinned to a major: the release config in releaserc.toml is written against
  # python-semantic-release 10.x, and its option names move between majors.
  SEMANTIC_RELEASE: uvx --from 'python-semantic-release>=10.5,<11' semantic-release -c releaserc.toml
  # The EDC version, from the one place that holds it. It used to be written out
  # here twice and in five other files; `BuildConsistencyTest` now asserts the
  # copies that remain agree with this source.
  EDC_VERSION:
    sh: sed -n 's/^edcVersion=//p' gradle.properties

tasks:
  # ── Idempotent workspace setup ────────────────────────────────────────────
  setup:
    desc: Prepare local dev environment (installs deps in each service)
    cmds:
      - |
        for dir in services/*/; do
          if [ -f "${dir}Taskfile.yml" ]; then
            echo "→ setup ${dir}"
            task -d "${dir}" setup 2>/dev/null || true
          fi
        done

  # ── Shared infrastructure ────────────────────────────────────────────────
  keycloak:reload:
    desc: Reset keycloak and reinitialize
    cmds:
      - COMPOSE_PROJECT_NAME=dataspaces docker compose down -v keycloak
      - COMPOSE_PROJECT_NAME=dataspaces docker compose up -d keycloak keycloak-org-sync keycloak-sync

  build:
    desc: Rebuild all Docker images (shared infra + every participant stack)
    cmds:
      - COMPOSE_PROJECT_NAME=dataspaces docker compose build
      # **Iterate the stacks, do not list them.** This task named `rec` and
      # `third-party` and stopped there, so from `DID-15` — which added the
      # grid operator as a second provider — `task build` left that stack on its
      # previous image while rebuilding the other two. A rebuild-then-restart
      # then produced a dataspace running half old code, and nothing said so:
      # every container is healthy, and the stale one only misbehaves where the
      # change was. `edc:restart` had the identical defect and its fix is
      # recorded in place (see `edc:restart` below); the same commit did not
      # look here.
      #
      # A glob cannot be forgotten the next time a participant is added, which
      # is the whole reason this is a loop. `test_build_covers_every_stack.py`
      # in `libs/ds-e2e` fails if a stack is skipped without being declared.
      #
      # `docker-compose.dataset-api.yml` is **deliberately** skipped: it builds
      # celine's `rec-registry` and `dataset-api` from sibling checkouts whose
      # paths are optional (`REC_REGISTRY_PATH`, `DATASET_API_PATH`), so on a
      # machine without them this task would fail on somebody else's source.
      # `task dataset-api:start` owns that stack.
      - |
        set -e
        for f in docker-compose.*.yml; do
          case "$f" in
            docker-compose.override.yml|docker-compose.dataset-api.yml) continue ;;
          esac
          echo "→ $f"
          COMPOSE_IGNORE_ORPHANS=true \
            docker compose --env-file .env.local -f "$f" build
        done

  infra:start:
    desc: Start shared infrastructure (postgres, caddy, identity-registry, keycloak)
    cmds:
      # **To completion, and before anything else mounts `./data`.** `up -d` does
      # not wait for a one-shot service, and the participant stacks bind-mount
      # `./data/vocabularies` from their own compose files — so whichever process
      # gets there first decides the owner, and if that is Docker the owner is
      # root and the connector exits 3. Run it as its own step rather than
      # relying on the minutes between this task and `rec:start`: a guarantee
      # that holds because a later task happens to be slow is not a guarantee.
      # A cross-file `depends_on` cannot express this — `rec:start` passes only
      # `-f docker-compose.rec.yml`.
      - COMPOSE_PROJECT_NAME=dataspaces docker compose up data-dirs-init --exit-code-from data-dirs-init
      - COMPOSE_PROJECT_NAME=dataspaces docker compose up -d

  infra:stop:
    desc: Stop shared infrastructure
    cmds:
      - COMPOSE_PROJECT_NAME=dataspaces docker compose down

  # ── Identity Registry bootstrap ──────────────────────────────────────────
  identity:bootstrap:
    desc: Run identity bootstrap init container (trust anchor, owners, enrolment codes)
    cmds:
      # **`--exit-code-from`, or a partial seed reports success.** The seed is a
      # 16-step `sh -euc` script that stops at the first failure, and no service
      # declares `depends_on` on it — so without this, `docker compose up`
      # returned 0 whether the anchor was seeded or the run died on step 2, and
      # the next thing to notice was a flow failing for an unrelated-looking
      # reason. Same rule as the root guide's warning about init containers.
      - COMPOSE_PROJECT_NAME=dataspaces docker compose up identity-registry-bootstrap --exit-code-from identity-registry-bootstrap

  # Deliberately **after** the participants exist. A person's credential is
  # delivered to the organisation that holds it (`DID-11` step 2), and that
  # organisation's DID document — with the CredentialService entry the anchor
  # delivers to — does not exist until it has enrolled. Re-runnable: issuance is
  # idempotent per role and a failed delivery is repaired by running it again.
  identity:users:
    desc: Issue the dev users' credentials to the participants that hold them
    cmds:
      # Same reason as `identity:bootstrap` above: this one issues and delivers
      # every dev user's credential, and a delivery that fails is exactly the
      # state a re-run is meant to repair — which nobody does if the run says 0.
      - COMPOSE_PROJECT_NAME=dataspaces docker compose up identity-users-bootstrap --exit-code-from identity-users-bootstrap

  # ── The REC: a provider that has members (`D-54`) ────────────────────────
  rec:start:
    desc: Start the REC's stack — a provider that has members
    deps: [edc:ensure-base]
    cmds:
      - |
        COMPOSE_IGNORE_ORPHANS=true \
          docker compose --env-file .env.local -f docker-compose.rec.yml up -d --build
        echo "Waiting for provider connector..."
        until curl -fsS http://localhost:30001/health >/dev/null 2>&1; do sleep 2; done
        # `svc-ds-e2e`, not `svc-ds-portal`. Publishing a participant's offers is
        # a *driver's* act, and this used to borrow the portal's client for it —
        # which is precisely why `svc-ds-e2e` exists (see
        # `libs/ds-e2e/src/ds_e2e/config.py`). Borrowing it back meant the portal
        # had to hold `connector.provider.write` for a call the portal never
        # makes, and that grant is what kept `KC-06` open. Dev/CI realms only.
        KC_URL="${KEYCLOAK_TOKEN_URL}"
        TOKEN=$(curl -fsS -X POST "$KC_URL" \
          -d grant_type=client_credentials \
          -d "client_id=${SVC_DS_E2E_ID}" \
          -d "client_secret=${SVC_DS_E2E_SECRET}" \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
        curl -fsS -X POST http://localhost:30001/provider/sync \
          -H "Authorization: Bearer $TOKEN" >/dev/null
        echo "REC started — portal http://portal.dataspaces.localhost — or run it on the host: task rec:portal:run"

  rec:stop:
    desc: Stop the REC's stack
    cmds:
      - |
        COMPOSE_IGNORE_ORPHANS=true \
          docker compose --env-file .env.local -f docker-compose.rec.yml down

  rec:status:
    desc: Show the REC's container status
    cmds:
      - |
        COMPOSE_IGNORE_ORPHANS=true \
          docker compose --env-file .env.local -f docker-compose.rec.yml ps

  rec:logs:
    desc: Follow the REC's logs
    cmds:
      - |
        COMPOSE_IGNORE_ORPHANS=true \
          docker compose --env-file .env.local -f docker-compose.rec.yml logs -f

  # ── The third party: consumes from both providers ────────────────────────
  third-party:start:
    desc: Start the third party's stack — it consumes from both providers
    deps: [edc:ensure-base]
    cmds:
      - |
        COMPOSE_IGNORE_ORPHANS=true \
          docker compose --env-file .env.local -f docker-compose.third-party.yml up -d --build
        echo "Third party started — gateway http://third-party.dataspaces.localhost"

  third-party:stop:
    desc: Stop the third party's stack
    cmds:
      - |
        COMPOSE_IGNORE_ORPHANS=true \
          docker compose --env-file .env.local -f docker-compose.third-party.yml down

  third-party:status:
    desc: Show the third party's container status
    cmds:
      - |
        COMPOSE_IGNORE_ORPHANS=true \
          docker compose --env-file .env.local -f docker-compose.third-party.yml ps

  third-party:logs:
    desc: Follow the third party's logs
    cmds:
      - |
        COMPOSE_IGNORE_ORPHANS=true \
          docker compose --env-file .env.local -f docker-compose.third-party.yml logs -f

  # ── Grid operator: the second provider (`D-54`, `DID-15`) ────────────────
  #
  # A DSO that shares its own grid data and has no members. It exists so that
  # "which provider?" is a real question and so that nothing downstream can
  # assume every participant holds credentials for people.
  grid-operator:start:
    desc: Start the grid-operator (second provider) stack
    deps: [edc:ensure-base]
    cmds:
      - |
        COMPOSE_IGNORE_ORPHANS=true \
          docker compose --env-file .env.local -f docker-compose.grid-operator.yml up -d --build
        echo "Waiting for the grid operator's connector..."
        until curl -fsS http://localhost:32001/health >/dev/null 2>&1; do sleep 2; done
        KC_URL="${KEYCLOAK_TOKEN_URL}"
        TOKEN=$(curl -fsS -X POST "$KC_URL" \
          -d grant_type=client_credentials \
          -d "client_id=${SVC_DS_E2E_ID}" \
          -d "client_secret=${SVC_DS_E2E_SECRET}" \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
        # Same as `rec:start`: publishing the governance-derived assets and
        # policies into this EDC is part of *starting*, not of building. Without
        # it this provider is registered, reachable and has an empty catalogue.
        curl -fsS -X POST http://localhost:32001/provider/sync \
          -H "Authorization: Bearer $TOKEN" >/dev/null
        echo "Grid operator started — gateway http://grid-operator.dataspaces.localhost"

  grid-operator:stop:
    desc: Stop the grid-operator stack
    cmds:
      - |
        COMPOSE_IGNORE_ORPHANS=true \
          docker compose --env-file .env.local -f docker-compose.grid-operator.yml down

  grid-operator:status:
    desc: Show grid-operator container status
    cmds:
      - |
        COMPOSE_IGNORE_ORPHANS=true \
          docker compose --env-file .env.local -f docker-compose.grid-operator.yml ps

  grid-operator:logs:
    desc: Follow grid-operator logs
    cmds:
      - |
        COMPOSE_IGNORE_ORPHANS=true \
          docker compose --env-file .env.local -f docker-compose.grid-operator.yml logs -f

  # ── Full stack aliases ───────────────────────────────────────────────────
  start:
    desc: Start everything (infra, identity, both providers, consumer, users)
    cmds:
      - task: infra:start
      - task: identity:bootstrap
      - task: rec:start
      - task: grid-operator:start
      - task: third-party:start
      # Last, and it has to be: the people's credentials go to the participants,
      # which do not exist until the steps above have enrolled them.
      - task: identity:users

  stop:
    desc: Stop everything
    cmds:
      - task: third-party:stop
      - task: grid-operator:stop
      - task: rec:stop
      - task: infra:stop

  status:
    desc: Show all running containers
    cmds:
      - docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

  # ── Identity registry local dev override ──────────────────────────────────
  identity-registry:run:
    desc: Stop Docker container, run identity-registry locally on :30005
    cmds:
      - docker stop dataspaces-identity-registry-1 2>/dev/null || true
      - |
        cd services/identity-registry
        uv run uvicorn identity_registry.main:app --reload --host 0.0.0.0 --port 30005

  identity-registry:debug:
    desc: Stop Docker container, debug identity-registry on :30005 (debugpy :30905)
    cmds:
      - docker stop dataspaces-identity-registry-1 2>/dev/null || true
      - |
        cd services/identity-registry
        uv run python -m debugpy --listen 0.0.0.0:30905 --wait-for-client \
          -m uvicorn identity_registry.main:app --reload --host 0.0.0.0 --port 30005

  # ── Provider local dev overrides ─────────────────────────────────────────
  provider:connector:run:
    desc: Stop Docker container, run provider connector locally on :30001
    cmds:
      - docker stop dataspaces-ds-connector-rec-1 2>/dev/null || true
      - |
        cd services/connector
        CONNECTOR_ROLE=provider \
        CONNECTOR_PARTICIPANT_ID=provider \
        CONNECTOR_PROVENANCE_URL=$CONNECTOR_PROVENANCE_URL_PROVIDER \
        CONNECTOR_DATABASE_URL=$CONNECTOR_DATABASE_URL_PROVIDER \
        uv run uvicorn connector.main:app --reload --host 0.0.0.0 --port 30001

  provider:connector:debug:
    desc: Stop Docker container, debug provider connector on :30001 (debugpy :30901)
    cmds:
      - docker stop dataspaces-ds-connector-rec-1 2>/dev/null || true
      - |
        cd services/connector
        CONNECTOR_ROLE=provider \
        CONNECTOR_PARTICIPANT_ID=provider \
        CONNECTOR_PROVENANCE_URL=$CONNECTOR_PROVENANCE_URL_PROVIDER \
        CONNECTOR_DATABASE_URL=$CONNECTOR_DATABASE_URL_PROVIDER \
        uv run python -m debugpy --listen 0.0.0.0:30901 --wait-for-client \
          -m uvicorn connector.main:app --reload --host 0.0.0.0 --port 30001

  provider:provenance:run:
    desc: Stop Docker container, run provider provenance locally on :30000
    cmds:
      - docker stop dataspaces-ds-provenance-rec-1 2>/dev/null || true
      - |
        cd services/provenance
        PROVENANCE_DATABASE_URL=$PROVENANCE_DATABASE_URL_PROVIDER \
        uv run uvicorn provenance.main:app --reload --host 0.0.0.0 --port 30000

  provider:dataset-api:run:
    desc: Stop Docker container, run the dataset-api mock locally on :30022
    cmds:
      - docker stop dataspaces-dataset-api-rec-1 2>/dev/null || true
      # This task runs the **mock**, so it takes the mock's port. It hardcoded
      # 30002 — the real celine dataset-api's — so running it while that stack
      # was up bound a port already taken, and running it alone put a stand-in
      # on the address `ds-e2e` uses for the real thing without saying so.
      - |
        cd services/dataset-api-mock
        uv run uvicorn dataset_api_mock.main:app --reload --host 0.0.0.0 --port "${DATASET_API_MOCK_PORT:-30022}"

  provider:federated-catalog:run:
    desc: Stop Docker container, run federated-catalog locally on :30003
    cmds:
      - docker stop dataspaces-ds-federated-catalog-rec-1 2>/dev/null || true
      - |
        cd services/federated-catalog
        uv run uvicorn federated_catalog.main:app --reload --host 0.0.0.0 --port 30003

  # ── Consumer local dev overrides ─────────────────────────────────────────
  consumer:connector:run:
    desc: Stop Docker container, run consumer connector locally on :31001
    cmds:
      - docker stop dataspaces-ds-connector-third-party-1 2>/dev/null || true
      - |
        cd services/connector
        CONNECTOR_ROLE=consumer \
        CONNECTOR_PARTICIPANT_ID=consumer \
        CONNECTOR_PARTICIPANT_DID=did:web:third-party.dataspaces.localhost \
        CONNECTOR_CONSUMER_PARTICIPANT_DID=did:web:third-party.dataspaces.localhost \
        CONNECTOR_PROVENANCE_URL=$CONNECTOR_PROVENANCE_URL_CONSUMER \
        CONNECTOR_DATABASE_URL=$CONNECTOR_DATABASE_URL_CONSUMER \
        uv run uvicorn connector.main:app --reload --host 0.0.0.0 --port 31001

  consumer:connector:debug:
    desc: Stop Docker container, debug consumer connector on :31001 (debugpy :31901)
    cmds:
      - docker stop dataspaces-ds-connector-third-party-1 2>/dev/null || true
      - |
        cd services/connector
        CONNECTOR_ROLE=consumer \
        CONNECTOR_PARTICIPANT_ID=consumer \
        CONNECTOR_PARTICIPANT_DID=did:web:third-party.dataspaces.localhost \
        CONNECTOR_CONSUMER_PARTICIPANT_DID=did:web:third-party.dataspaces.localhost \
        CONNECTOR_PROVENANCE_URL=$CONNECTOR_PROVENANCE_URL_CONSUMER \
        CONNECTOR_DATABASE_URL=$CONNECTOR_DATABASE_URL_CONSUMER \
        uv run python -m debugpy --listen 0.0.0.0:31901 --wait-for-client \
          -m uvicorn connector.main:app --reload --host 0.0.0.0 --port 31001

  consumer:provenance:run:
    desc: Stop Docker container, run consumer provenance locally on :31000
    cmds:
      - docker stop dataspaces-ds-provenance-third-party-1 2>/dev/null || true
      - |
        cd services/provenance
        PROVENANCE_DATABASE_URL=$PROVENANCE_DATABASE_URL_CONSUMER \
        uv run uvicorn provenance.main:app --reload --host 0.0.0.0 --port 31000

  rec:portal:run:
    desc: Stop Docker container, run portal locally on :30004
    cmds:
      - docker stop dataspaces-ds-portal-1 2>/dev/null || true
      - |
        cd services/portal
        CONNECTOR_URL=http://172.17.0.1:30001 \
        PROVENANCE_URL=$CONNECTOR_PROVENANCE_URL_PROVIDER \
        FEDERATED_CATALOG_URL=http://172.17.0.1:30003 \
        IDENTITY_REGISTRY_URL=$CONNECTOR_IDENTITY_REGISTRY_URL \
        PORTAL_SERVICE_CLIENT_SECRET="${SVC_DS_PORTAL_SECRET}" \
        npm run dev

  # ── Lifecycle: two modes ──────────────────────────────────────────────────
  #
  #   task docker:*   everything in containers. The mode that exercises the
  #                   Dockerfiles and the compose `environment:` blocks, so it is
  #                   the one that actually validates a change to either.
  #   task dev:*      local dev: brings the container stack up, then replaces
  #                   most services with host processes under hot-reload, in a
  #                   tmux session named `ds`.
  #
  # Both share `docker:stop`, because both leave containers behind. `dev:*` is
  # docker-then-replace, not an alternative to containers.
  #
  # A change to a Dockerfile, a compose `environment:` block, a pyproject
  # dependency or build.gradle.kts is NOT verified by `dev:*` for any service
  # that mode replaces — those host processes read .env.local through this
  # file's `dotenv` and never see the compose environment.

  docker:stop:
    desc: "Docker: stop everything (failsafe — exits 0 even if nothing is running)"
    cmds:
      - |
        set +e
        # Every EDC port for all THREE participants (19xxx rec, 29xxx
        # third-party, 39xxx grid-operator), plus the Python services. The list
        # used to name 19291/29291 — the `public` context, which no packaged
        # module registers — and no 39xxx port at all, so a `dev:*` teardown left
        # the grid-operator's JVM holding its ports and the next start failed to
        # bind. Keep this in step with the `fuser -k` list in `edc:restart`.
        #
        # **30022, not 30002** (`TASK-04`). `9a8e3e5` moved the stack's own
        # dataset-api mock to 30022 so the real celine one could keep 30002, and
        # this list was not moved with it — so a `dev:*` mock left running on
        # 30022 survived the teardown and the container that wanted the port
        # failed to bind, while 30002 belongs to `docker-compose.dataset-api.yml`,
        # a *different* compose project this task has no business killing.
        # 19195/29195 are deliberately still absent: they name the `version` and
        # `public` contexts no packaged module registers, which is the same
        # reasoning that removed them from `edc:restart`.
        DEV_PORTS="19191 19193 19194 29191 29193 29194 39191 39193 39194 30000 30001 30003 30004 30005 30022 31000 31001"

        # 1. Kill the local-dev watch loops FIRST, by name.
        #    `tmux kill-session` does not reach them: the loops are re-parented
        #    and survive, and each one restarts its JVM the moment the JVM dies.
        #    Killing ports before killing the loops therefore frees a port only
        #    long enough for the loop to grab it again — and the container that
        #    wanted it then fails to bind and exits.
        for pattern in "edc-rec:watch" "edc-third-party:watch" "edc:watch-build"; do
          for pid in $(pgrep -f "$pattern" 2>/dev/null); do
            pgid=$(ps -o pgid= -p $pid 2>/dev/null | tr -d ' ')
            [ -n "$pgid" ] && kill -9 -${pgid} 2>/dev/null
            kill -9 $pid 2>/dev/null
          done
        done

        # 2. Send C-c to every tmux window, wait for graceful shutdown, then kill session
        if tmux has-session -t ds 2>/dev/null; then
          for win in $(tmux list-windows -t ds -F '#W' 2>/dev/null); do
            tmux send-keys -t "ds:${win}" C-c 2>/dev/null
          done
          sleep 3
          tmux kill-session -t ds 2>/dev/null
        fi

        # 3. Kill process groups of anything on known ports
        #    Kills the watcher parent + Java child together so nothing respawns
        kill_port_holders() {
          for port in $DEV_PORTS; do
            for pid in $(lsof -ti tcp:${port} 2>/dev/null); do
              pgid=$(ps -o pgid= -p $pid 2>/dev/null | tr -d ' ')
              [ -n "$pgid" ] && kill -9 -${pgid} 2>/dev/null
              kill -9 $pid 2>/dev/null
            done
          done
        }
        kill_port_holders

        # 4. Docker compose down on all stacks
        COMPOSE_IGNORE_ORPHANS=true docker compose --env-file .env.local -f docker-compose.third-party.yml down -v --remove-orphans 2>/dev/null
        COMPOSE_IGNORE_ORPHANS=true docker compose --env-file .env.local -f docker-compose.rec.yml down -v --remove-orphans 2>/dev/null
        COMPOSE_PROJECT_NAME=dataspaces docker compose down -v --remove-orphans 2>/dev/null

        # 5. Final sweep
        kill_port_holders

        # 6. Wait for ports to be free
        for port in $DEV_PORTS; do
          timeout 5 bash -c "while lsof -ti tcp:${port} >/dev/null 2>&1; do sleep 0.3; done" 2>/dev/null
        done

        echo "All stopped"
        exit 0

  docker:start:
    desc: "Docker: start everything in containers (BUILD=false to skip the image rebuild)"
    vars:
      BUILD: '{{.BUILD | default "true"}}'
    cmds:
      - |
        if [ "{{.BUILD}}" = "true" ]; then
          task build
        else
          echo "BUILD=false — using the existing images (source changes will NOT be picked up)"
        fi
      - task: start

  docker:restart:
    desc: "Docker: full restart in containers (BUILD=false to skip the image rebuild)"
    cmds:
      - task: docker:stop
      - task: docker:start
        vars: {BUILD: '{{.BUILD | default "true"}}'}

  dev:stop:
    desc: "Local dev: stop the tmux session and everything else"
    cmds:
      - task: docker:stop

  dev:start:
    desc: "Local dev: containers up, then hot-reload services in tmux (BUILD=false to skip the image rebuild)"
    cmds:
      - |
        command -v tmux >/dev/null 2>&1 || {
          echo "tmux is not installed. Install it, e.g.:  sudo apt install tmux" >&2
          exit 1
        }
      - task: docker:start
        vars: {BUILD: '{{.BUILD | default "true"}}'}
      - |
        # Each `task <x>:run` window stops its own container first, so the
        # container stack above is the starting point rather than a conflict.
        tmux new-session -d -s ds -n edc-watch-build
        tmux source-file "$(pwd)/dev.tmux.conf"
        tmux send-keys -t ds:edc-watch-build          'task edc:watch-build' Enter
        tmux new-window -t ds -n edc-rec
        tmux send-keys -t ds:edc-rec             'task edc-rec:watch' Enter
        tmux new-window -t ds -n edc-third-party
        tmux send-keys -t ds:edc-third-party             'task edc-third-party:watch' Enter
        tmux new-window -t ds -n identity-registry
        tmux send-keys -t ds:identity-registry        'task identity-registry:run' Enter
        tmux new-window -t ds -n provider-connector
        tmux send-keys -t ds:provider-connector       'task provider:connector:run' Enter
        tmux new-window -t ds -n provider-provenance
        tmux send-keys -t ds:provider-provenance      'task provider:provenance:run' Enter
        tmux new-window -t ds -n provider-dataset-api
        tmux send-keys -t ds:provider-dataset-api     'task provider:dataset-api:run' Enter
        tmux new-window -t ds -n provider-fed-catalog
        tmux send-keys -t ds:provider-fed-catalog     'task provider:federated-catalog:run' Enter
        tmux new-window -t ds -n provider-portal
        tmux send-keys -t ds:provider-portal          'task rec:portal:run' Enter
        tmux new-window -t ds -n consumer-connector
        tmux send-keys -t ds:consumer-connector       'task consumer:connector:run' Enter
        tmux new-window -t ds -n consumer-provenance
        tmux send-keys -t ds:consumer-provenance      'task consumer:provenance:run' Enter
        tmux attach -t ds

  dev:restart:
    desc: "Local dev: full restart (BUILD=false to skip the image rebuild)"
    cmds:
      - task: dev:stop
      - task: dev:start
        vars: {BUILD: '{{.BUILD | default "true"}}'}

  # ── Utilities ────────────────────────────────────────────────────────────

  reset-demo-state:
    desc: Clear runtime requests, consents, agreements, transfers and provenance events
    cmds:
      - |
        set -euo pipefail
        compose() {
          COMPOSE_PROJECT_NAME=dataspaces COMPOSE_IGNORE_ORPHANS=true docker compose "$@"
        }
        for db in connector_rec connector_third_party connector_grid_operator; do
          compose exec -T postgres psql -U postgres -d "$db" -v ON_ERROR_STOP=1 -c "
            TRUNCATE TABLE
              consumer_access_requests,
              consumer_transfers,
              contract_agreements,
              consent_requests
            RESTART IDENTITY CASCADE;
          " 2>/dev/null || true
        done
        for db in provenance_rec provenance_third_party provenance_grid_operator; do
          compose exec -T postgres psql -U postgres -d "$db" -v ON_ERROR_STOP=1 -c "
            TRUNCATE TABLE
              domain_events,
              prov_relations,
              prov_nodes,
              access_log
            RESTART IDENTITY CASCADE;
          " 2>/dev/null || true
        done
        for db in edc_rec edc_third_party; do
          compose exec -T postgres psql -U postgres -v ON_ERROR_STOP=1 -c "
            DROP DATABASE IF EXISTS $db;
            CREATE DATABASE $db;
          " 2>/dev/null || true
        done
        KC_URL="${KEYCLOAK_TOKEN_URL}"
        TOKEN=$(curl -fsS -X POST "$KC_URL" \
          -d grant_type=client_credentials \
          -d "client_id=${SVC_DS_E2E_ID}" \
          -d "client_secret=${SVC_DS_E2E_SECRET}" \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])" 2>/dev/null) || true
        curl -fsS -X POST http://localhost:30001/provider/sync \
          -H "Authorization: Bearer $TOKEN" >/dev/null 2>&1 || true
        echo "Demo state cleared"

  # ── EDC build ────────────────────────────────────────────────────────────
  edc:base:
    desc: Build EDC base image with cached deps (run once per version bump)
    cmds:
      - docker build -f services/edc-connector/Dockerfile.base -t ds-edc-base:{{.EDC_VERSION}} .

  edc:ensure-base:
    desc: Build EDC base image only when missing
    cmds:
      - docker image inspect ds-edc-base:{{.EDC_VERSION}} >/dev/null 2>&1 || task edc:base

  edc:test:
    desc: Run the Java unit tests — both edc-extensions and edc-connector
    # The Java was invoked by no task and no workflow, so the constraint
    # functions that decide every access were untested *and* unrunnable without
    # knowing the Docker incantation. `task -d services/edc-extensions test` is
    # the same command.
    #
    # edc-connector is the second half: it has no source, so what it tests is the
    # assembly — that every web context configured has a module behind it and
    # every setting has a reader. Both used to be false and nothing said so.
    cmds:
      - task -d services/edc-extensions test -- {{.CLI_ARGS}}
      - task -d services/edc-extensions test:report
      - task -d services/edc-connector test -- {{.CLI_ARGS}}
      - task -d services/edc-connector test:report

  edc:build:
    desc: Build EDC connector fat JAR via Docker (caches in data/gradle)
    cmds:
      - mkdir -p data/gradle
      - >-
        docker run --rm
        -v "{{.ROOT_DIR}}:/project"
        -v "{{.ROOT_DIR}}/data/gradle:/home/gradle/.gradle"
        -w /project
        gradle:8.12-jdk21
        gradle :edc-connector:shadowJar --no-daemon

  edc:docker:
    desc: Build EDC connector Docker image (requires the ds-edc-base image)
    cmds:
      - docker build -f services/edc-connector/Dockerfile -t ds-edc-connector:local .

  edc:restart:
    desc: Rebuild EDC fat JAR + Docker image and force-recreate every EDC container
    deps: [edc:ensure-base]
    cmds:
      - task: edc:build
      - task: edc:docker
      # All three roles. `grid-operator` was added by the participant rename and
      # this task was not updated with it, so a rebuilt JAR reached two of the
      # three EDCs — a stack that is half old code and says nothing about it,
      # which is the worst state to verify a policy change in.
      - |
        docker stop dataspaces-edc-rec-1 dataspaces-edc-third-party-1 dataspaces-edc-grid-operator-1 2>/dev/null || true
        docker rm -f dataspaces-edc-rec-1 dataspaces-edc-third-party-1 dataspaces-edc-grid-operator-1 2>/dev/null || true
        # Same set as DEV_PORTS' EDC half, and for the same reason: 19191/29191/
        # 39191 host the health endpoint every wait loop below polls, and were
        # missing here, while 19195/19291 and their twins named the `version` and
        # `public` contexts that no packaged module registers.
        fuser -k 19191/tcp 19193/tcp 19194/tcp 29191/tcp 29193/tcp 29194/tcp 39191/tcp 39193/tcp 39194/tcp 2>/dev/null || true
        sleep 1
        COMPOSE_IGNORE_ORPHANS=true \
          docker compose --env-file .env.local -f docker-compose.rec.yml up -d --build --force-recreate --no-deps edc-rec
        COMPOSE_IGNORE_ORPHANS=true \
          docker compose --env-file .env.local -f docker-compose.third-party.yml up -d --build --force-recreate --no-deps edc-third-party
        COMPOSE_IGNORE_ORPHANS=true \
          docker compose --env-file .env.local -f docker-compose.grid-operator.yml up -d --build --force-recreate --no-deps edc-grid-operator
        for edc in rec third-party grid-operator; do
          echo "Waiting for EDC $edc (timeout 90s)..."
          timeout 90 bash -c "until docker inspect dataspaces-edc-$edc-1 --format '{{.State.Health.Status}}' 2>/dev/null | grep -q healthy; do sleep 3; done" \
            && echo "EDC $edc ready" || echo "EDC $edc failed to start"
        done

  # ── EDC local dev overrides ─────────────────────────────────────────────
  edc-rec:run:
    desc: Stop Docker container, run EDC provider locally from fat JAR
    cmds:
      - docker stop dataspaces-edc-rec-1 2>/dev/null || true
      - |
        jar="{{.ROOT_DIR}}/services/edc-connector/build/libs/connector.jar"
        if [ ! -f "$jar" ]; then
          echo "No connector.jar found — building..."
          task edc:build
        fi
        exec java -Xms256m -Xmx512m \
          -Dedc.fs.config={{.ROOT_DIR}}/services/connector/config/rec.properties \
          -Dds.vault.seed.file={{.ROOT_DIR}}/services/connector/config/rec-vault.properties \
          -jar "$jar"

  edc-third-party:run:
    desc: Stop Docker container, run EDC consumer locally from fat JAR
    cmds:
      - docker stop dataspaces-edc-third-party-1 2>/dev/null || true
      - |
        jar="{{.ROOT_DIR}}/services/edc-connector/build/libs/connector.jar"
        if [ ! -f "$jar" ]; then
          echo "No connector.jar found — building..."
          task edc:build
        fi
        exec java -Xms256m -Xmx512m \
          -Dedc.fs.config={{.ROOT_DIR}}/services/connector/config/third-party.properties \
          -Dds.vault.seed.file={{.ROOT_DIR}}/services/connector/config/third-party-vault.properties \
          -jar "$jar"

  edc:watch-build:
    desc: Continuously rebuild EDC fat JAR on source changes (Gradle --continuous)
    cmds:
      - mkdir -p data/gradle
      - >-
        docker run --rm -it
        --init
        -v "{{.ROOT_DIR}}:/project"
        -v "{{.ROOT_DIR}}/data/gradle:/home/gradle/.gradle"
        -w /project
        gradle:8.12-jdk21
        gradle :edc-connector:shadowJar --continuous --no-daemon

  edc-rec:watch:
    desc: Run EDC provider locally, auto-restart on fat JAR rebuild
    cmds:
      - docker stop dataspaces-edc-rec-1 2>/dev/null || true
      - |
        set +e
        jar="{{.ROOT_DIR}}/services/edc-connector/build/libs/connector.jar"
        if [ ! -f "$jar" ]; then
          echo "No connector.jar found — building..."
          task edc:build
        fi
        PID=

        # Stop the JVM without ever blocking forever.
        #
        # The old loop did `kill $PID; wait $PID`. An EDC that is slow to run its
        # shutdown hooks — or does not act on SIGTERM at all — left `wait`
        # blocked for good: the watcher printed "restarting", then never
        # restarted, and the stale JVM kept serving the *old* JAR while every
        # rebuild appeared to do nothing. Losing a watcher silently is worse
        # than a hard kill, so escalate and move on.
        stop_edc() {
          [ -z "$PID" ] && return 0
          kill "$PID" 2>/dev/null
          i=0
          while [ $i -lt 20 ]; do
            kill -0 "$PID" 2>/dev/null || { PID=; return 0; }
            sleep 0.5
            i=$((i + 1))
          done
          echo "EDC provider ignored SIGTERM for 10s — sending SIGKILL"
          kill -9 "$PID" 2>/dev/null
          i=0
          while [ $i -lt 10 ]; do
            kill -0 "$PID" 2>/dev/null || { PID=; return 0; }
            sleep 0.5
            i=$((i + 1))
          done
          echo "EDC provider survived SIGKILL — port 19191/19193/19194 may still be held" >&2
          PID=
        }

        cleanup() { stop_edc; exit 0; }
        trap cleanup INT TERM EXIT

        conf="{{.ROOT_DIR}}/services/connector/config/rec.properties"

        # An EDC that outlived its watcher still holds the ports, so every boot
        # after it fails to bind and the loop spins — 200+ restarts with nothing
        # in the log but BindException. Reap our own strays before starting.
        kill_stale() {
          for stale in $(pgrep -f "edc.fs.config=$conf" 2>/dev/null); do
            [ "$stale" = "$PID" ] && continue
            echo "Reaping stale EDC provider JVM $stale (it still holds the ports)"
            kill -9 "$stale" 2>/dev/null
          done
          sleep 1
        }

        FAILS=0
        while true; do
          kill_stale
          MTIME=$(stat -c %Y "$jar" 2>/dev/null)
          STARTED=$(date +%s)
          echo "Starting EDC provider (JAR mtime: $MTIME)..."
          java -Xms256m -Xmx512m \
            -Dedc.fs.config={{.ROOT_DIR}}/services/connector/config/rec.properties \
            -Dds.vault.seed.file={{.ROOT_DIR}}/services/connector/config/rec-vault.properties \
            -jar "$jar" &
          PID=$!

          while true; do
            sleep 2
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "EDC provider exited on its own — restarting..."
              break
            fi
            NOW=$(stat -c %Y "$jar" 2>/dev/null)
            # An empty mtime means the JAR is mid-write: wait for the new one
            # rather than restarting onto a file that is not there yet.
            if [ -n "$NOW" ] && [ "$NOW" != "$MTIME" ]; then
              echo "JAR changed ($MTIME → $NOW) — restarting EDC provider..."
              break
            fi
          done

          stop_edc

          # Back off when the JVM dies almost immediately. A crash loop is a
          # configuration problem, not something to retry 200 times a minute —
          # slow down so the reason stays readable in the log.
          if [ $(( $(date +%s) - STARTED )) -lt 20 ]; then
            FAILS=$((FAILS + 1))
            BACKOFF=$((FAILS * 5))
            [ $BACKOFF -gt 60 ] && BACKOFF=60
            echo "EDC provider died after <20s (attempt $FAILS) — waiting ${BACKOFF}s before retrying"
            sleep $BACKOFF
          else
            FAILS=0
            sleep 1
          fi
        done
  edc-third-party:watch:
    desc: Run EDC consumer locally, auto-restart on fat JAR rebuild
    cmds:
      - docker stop dataspaces-edc-third-party-1 2>/dev/null || true
      - |
        set +e
        jar="{{.ROOT_DIR}}/services/edc-connector/build/libs/connector.jar"
        if [ ! -f "$jar" ]; then
          echo "No connector.jar found — building..."
          task edc:build
        fi
        PID=

        # Stop the JVM without ever blocking forever.
        #
        # The old loop did `kill $PID; wait $PID`. An EDC that is slow to run its
        # shutdown hooks — or does not act on SIGTERM at all — left `wait`
        # blocked for good: the watcher printed "restarting", then never
        # restarted, and the stale JVM kept serving the *old* JAR while every
        # rebuild appeared to do nothing. Losing a watcher silently is worse
        # than a hard kill, so escalate and move on.
        stop_edc() {
          [ -z "$PID" ] && return 0
          kill "$PID" 2>/dev/null
          i=0
          while [ $i -lt 20 ]; do
            kill -0 "$PID" 2>/dev/null || { PID=; return 0; }
            sleep 0.5
            i=$((i + 1))
          done
          echo "EDC consumer ignored SIGTERM for 10s — sending SIGKILL"
          kill -9 "$PID" 2>/dev/null
          i=0
          while [ $i -lt 10 ]; do
            kill -0 "$PID" 2>/dev/null || { PID=; return 0; }
            sleep 0.5
            i=$((i + 1))
          done
          echo "EDC consumer survived SIGKILL — port 29191/29193/29194 may still be held" >&2
          PID=
        }

        cleanup() { stop_edc; exit 0; }
        trap cleanup INT TERM EXIT

        conf="{{.ROOT_DIR}}/services/connector/config/third-party.properties"

        # An EDC that outlived its watcher still holds the ports, so every boot
        # after it fails to bind and the loop spins — 200+ restarts with nothing
        # in the log but BindException. Reap our own strays before starting.
        kill_stale() {
          for stale in $(pgrep -f "edc.fs.config=$conf" 2>/dev/null); do
            [ "$stale" = "$PID" ] && continue
            echo "Reaping stale EDC consumer JVM $stale (it still holds the ports)"
            kill -9 "$stale" 2>/dev/null
          done
          sleep 1
        }

        FAILS=0
        while true; do
          kill_stale
          MTIME=$(stat -c %Y "$jar" 2>/dev/null)
          STARTED=$(date +%s)
          echo "Starting EDC consumer (JAR mtime: $MTIME)..."
          java -Xms256m -Xmx512m \
            -Dedc.fs.config={{.ROOT_DIR}}/services/connector/config/third-party.properties \
            -Dds.vault.seed.file={{.ROOT_DIR}}/services/connector/config/third-party-vault.properties \
            -jar "$jar" &
          PID=$!

          while true; do
            sleep 2
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "EDC consumer exited on its own — restarting..."
              break
            fi
            NOW=$(stat -c %Y "$jar" 2>/dev/null)
            # An empty mtime means the JAR is mid-write: wait for the new one
            # rather than restarting onto a file that is not there yet.
            if [ -n "$NOW" ] && [ "$NOW" != "$MTIME" ]; then
              echo "JAR changed ($MTIME → $NOW) — restarting EDC consumer..."
              break
            fi
          done

          stop_edc

          # Back off when the JVM dies almost immediately. A crash loop is a
          # configuration problem, not something to retry 200 times a minute —
          # slow down so the reason stays readable in the log.
          if [ $(( $(date +%s) - STARTED )) -lt 20 ]; then
            FAILS=$((FAILS + 1))
            BACKOFF=$((FAILS * 5))
            [ $BACKOFF -gt 60 ] && BACKOFF=60
            echo "EDC consumer died after <20s (attempt $FAILS) — waiting ${BACKOFF}s before retrying"
            sleep $BACKOFF
          else
            FAILS=0
            sleep 1
          fi
        done
  # ── Schema ───────────────────────────────────────────────────────────────
  #
  # Alembic owns every schema. Services verify the revision at startup and
  # refuse to run against one they did not expect, so these tasks are the only
  # way a database changes shape.

  db:migrate:
    desc: Apply pending migrations to every service database
    cmds:
      - task: db:migrate:identity-registry
      - task: db:migrate:connector
      - task: db:migrate:provenance

  db:migrate:identity-registry:
    desc: Migrate every identity-registry database (anchor + one per participant)
    cmds:
      - |
        cd services/identity-registry
        # **Three databases since `DID-05`**, not one: the anchor's and one per
        # participant instance. Migrating only the anchor leaves the participants
        # at an older head, and each refuses to start against a revision it did
        # not expect — a failure that reads as a broken service rather than a
        # half-applied migration.
        for url in "{{.IR_DB | default "postgresql+asyncpg://postgres:postgres@172.17.0.1:35432/identity_registry"}}" \
                   "postgresql+asyncpg://postgres:postgres@172.17.0.1:35432/ir_rec" \
                   "postgresql+asyncpg://postgres:postgres@172.17.0.1:35432/ir_third_party" \
                   "postgresql+asyncpg://postgres:postgres@172.17.0.1:35432/ir_grid_operator"; do
          echo "→ ${url##*/}"
          IDENTITY_REGISTRY_DATABASE_URL="$url" uv run alembic upgrade head
        done

  db:migrate:connector:
    desc: Migrate every connector database (one per participant)
    cmds:
      - |
        cd services/connector
        for db in connector_rec connector_third_party connector_grid_operator; do
          echo "→ $db"
          CONNECTOR_ROLE=provider \
          CONNECTOR_DATABASE_URL="postgresql+asyncpg://postgres:postgres@172.17.0.1:35432/$db" \
            uv run alembic upgrade head
        done

  db:migrate:provenance:
    desc: Migrate every provenance database (one per participant)
    cmds:
      - |
        cd services/provenance
        for db in provenance_rec provenance_third_party provenance_grid_operator; do
          echo "→ $db"
          PROVENANCE_DATABASE_URL="postgresql+asyncpg://postgres:postgres@172.17.0.1:35432/$db" \
            uv run alembic upgrade head
        done

  db:status:
    desc: Report the schema revision of every service database
    cmds:
      - |
        for db in identity_registry ir_rec ir_third_party ir_grid_operator \
                  connector_rec connector_third_party connector_grid_operator \
                  provenance_rec provenance_third_party provenance_grid_operator; do
          rev=$(docker exec dataspaces-postgres-1 psql -U postgres -d "$db" -tAc \
            "select version_num from alembic_version" 2>/dev/null || echo "MISSING")
          printf '  %-24s %s\n' "$db" "${rev:-<no revision>}"
        done

  db:reset:
    desc: "DESTRUCTIVE: drop every service database and rebuild it from migrations"
    prompt: This deletes all local dataspace data. Continue?
    cmds:
      - |
        for db in identity_registry ir_rec ir_third_party ir_grid_operator \
                  connector_rec connector_third_party connector_grid_operator \
                  provenance_rec provenance_third_party provenance_grid_operator \
                  edc_rec edc_third_party edc_grid_operator; do
          echo "→ dropping $db"
          docker exec dataspaces-postgres-1 psql -U postgres -d postgres -q \
            -c "DROP DATABASE IF EXISTS $db WITH (FORCE)" \
            -c "CREATE DATABASE $db"
        done
      - task: db:migrate
      - |
        echo
        echo "Databases rebuilt at head. Next:"
        echo "  1. task identity:bootstrap    (trust anchor, owners, enrolment codes)"
        echo "  2. restart identity-registry, ir-rec, ir-third-party, ds-connector"
        echo "     and ds-provenance — each verifies the schema revision at startup"
        echo "     and holds stale connections"
        echo "  3. task rec:start / third-party:start   (they re-enrol: the anchor"
        echo "     no longer holds their keys, so their identities are recreated)"
        echo "  4. task identity:users       (the people, once their organisations exist)"
        echo "  5. task e2e:scenario:apply    (use-case fixtures, if you run the chains)"

  # ── E2E verification ─────────────────────────────────────────────────────
  e2e:
    desc: Run E2E smoke test
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e run --flow smoke

  e2e:clean:
    desc: Reset runtime state for clean E2E run
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e clean

  e2e:wait-ready:
    desc: "E2E: block until both EDCs and the federated catalogue can answer"
    cmds:
      - |
        set +e
        # The management API is the readiness signal, not /health: it answers
        # (401 without a key) only once the control plane is actually serving.
        # A flow that starts on a half-booted EDC gets a 502 from
        # /consumer/catalog and reads as a product failure.
        probe() { curl -so /dev/null -w '%{http_code}' -m 3 -X POST "$1" \
          -H 'Content-Type: application/json' -d '{}' 2>/dev/null; }
        for i in $(seq 1 120); do
          p=$(probe http://172.17.0.1:19193/management/v3/assets/request)
          c=$(probe http://172.17.0.1:29193/management/v3/assets/request)
          [ "$p" != "000" ] && [ "$c" != "000" ] && break
          sleep 2
        done
        if [ "$p" = "000" ] || [ "$c" = "000" ]; then
          echo "EDCs did not become ready (provider=$p consumer=$c)" >&2
          exit 1
        fi
        echo "EDCs ready (provider=$p consumer=$c)"

        # The catalogue is crawled on a timer, so an empty one right after a
        # restart means "not yet", not "broken".
        TOKEN_URL="${KEYCLOAK_TOKEN_URL:-http://172.17.0.1:9080/realms/dataspaces/protocol/openid-connect/token}"
        tok=$(curl -s -X POST "$TOKEN_URL" -d grant_type=client_credentials \
          -d client_id="${SVC_DS_E2E_ID:-svc-ds-e2e}" -d client_secret="${SVC_DS_E2E_SECRET:-svc-ds-e2e}" \
          | python3 -c 'import sys,json;print(json.load(sys.stdin).get("access_token",""))' 2>/dev/null)
        # Wait for the **expected** dataset, not merely a non-zero count.
        #
        # `ds-e2e clean` deletes and re-syncs the provider's assets, so right after
        # it the catalogue still holds the *previous* crawl. A count check passes
        # instantly against that stale result — and with more than one dataset in
        # governance it passes even when the one the flows assert on has not been
        # crawled yet. That is a race the `catalog-discovery` flow reports as a
        # missing dataset and `smoke` as a query with no authorized rows, i.e. as
        # two product failures rather than as "not yet".
        want="${E2E_ASSET_ID:-datasets.silver.meters_15m}"
        for i in $(seq 1 60); do
          body=$(curl -s -H "Authorization: Bearer $tok" http://172.17.0.1:30003/catalog)
          n=$(printf '%s' "$body" | python3 -c 'import sys,json;print(len(json.load(sys.stdin).get("dcat:dataset") or []))' 2>/dev/null)
          if printf '%s' "$body" | grep -q "$want"; then break; fi
          sleep 3
        done
        if ! printf '%s' "$body" | grep -q "$want"; then
          echo "federated catalogue never listed ${want} (datasets: ${n:-0}) — flows that assert on it will fail" >&2
        fi
        echo "federated catalogue datasets: ${n:-0} (contains ${want}: $(printf '%s' "$body" | grep -qc "$want" && echo yes || echo no))"
        exit 0

  e2e:prepare:
    desc: "E2E: clean state, restart the EDCs, wait for readiness, apply fixtures"
    cmds:
      # `ds-e2e clean` runs DROP DATABASE / CREATE DATABASE on edc_rec and
      # edc_third_party. The EDCs hold open connections and only run their schema
      # migration at boot, so anything that keeps running afterwards is talking
      # to a control plane whose schema was pulled out from under it. Restarting
      # them is not optional — it is what makes a clean run mean anything.
      - task: e2e:clean
      - |
        set +e
        if docker ps --format '{{"{{"}}.Names{{"}}"}}' | grep -q '^dataspaces-edc-rec-1$'; then
          echo "Restarting EDC containers after the database reset..."
          # All three: the grid operator's control plane holds connections to a
          # database `ds-e2e clean` has just dropped and recreated, exactly like
          # the other two (`DID-15`).
          docker restart dataspaces-edc-rec-1 dataspaces-edc-third-party-1 \
            dataspaces-edc-grid-operator-1 >/dev/null 2>&1
        else
          # Local dev mode: the EDCs are host JVMs owned by `edc-*:watch` loops,
          # which restart them on exit. Killing them is the restart.
          echo "Restarting local EDC JVMs after the database reset..."
          for port in 19193 29193 39193; do
            for pid in $(lsof -ti tcp:${port} 2>/dev/null); do
              [ "$(ps -p "$pid" -o comm= 2>/dev/null)" = "java" ] && kill "$pid" 2>/dev/null
            done
          done
        fi
        # **Wait for the management API, do not sleep at it.** This was `sleep 5`,
        # and five seconds is not a property of anything — it is how long a JVM
        # happened to take to boot, migrate its schema and bind :x9193 on the
        # machine where it was written. `e2e:sync-providers` runs next and talks
        # to exactly this port, so when the guess is short the sync reports
        # `0 asset(s)` and the whole run fails on "published nothing", three
        # tasks away from the cause.
        #
        # Exposed by adding the OpenTelemetry Java agent: ~5s of extra startup
        # turned a race that usually passed into one that always failed. The
        # agent did not break this; it stopped hiding it.
        #
        # **Any HTTP answer counts, including 401** — the management API requires
        # auth, and "it refused me" is proof it is listening, which is the only
        # question here. The health endpoint is on a *different* port (x9191), so
        # a container reporting healthy says nothing about this one.
        for port in 19193 29193 39193; do
          echo -n "Waiting for EDC management API on :${port}... "
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 \
              "http://172.17.0.1:${port}/management/v3/assets/request" -X POST 2>/dev/null)
            [ "$code" != "000" ] && break
            sleep 1
          done
          if [ "$code" = "000" ]; then
            echo "not listening after 60s" >&2
            exit 1
          fi
          echo "ready (HTTP $code)"
        done
        exit 0
      # **After the restart, not before** (`E2E-12`). `e2e:clean` syncs as its
      # last step and the restart above then replaces the store it published
      # into, so that catalogue does not survive. The REC provider usually
      # recovered because `e2e:wait-ready` polls the federated catalogue for its
      # asset; nothing waited for the grid operator, so `two-providers` failed
      # or passed depending on where the restart fell — observed both ways on
      # the same build, minutes apart.
      #
      # The flows now assert against a catalogue this task *caused*.
      - task: e2e:sync-providers
      - task: e2e:wait-ready
      - task: e2e:scenario:apply

  e2e:sync-providers:
    desc: "E2E: re-publish every provider's catalogue to its EDC"
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e sync-providers

  e2e:all:
    desc: Run all E2E flows (clean state, EDC restart, fixtures, then every flow)
    cmds:
      - task: e2e:prepare
      - cd libs/ds-e2e && uv run ds-e2e run --flow all

  e2e:uc1:
    desc: "E2E: UC-1 delegated consent"
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e run --flow uc1

  e2e:uc2:
    desc: "E2E: UC-2+UC-3 owner-scoped negotiation"
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e run --flow uc2

  e2e:uc3:
    desc: "E2E: UC-4 open/external data"
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e run --flow uc3

  e2e:security:
    desc: "E2E: API contract, authz perimeter and DCP trust chain (no EDC needed)"
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e run --flow security

  e2e:user-authority:
    desc: "E2E: every dev user's token reaches what its bundle grants, and no more"
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e run --flow user-authority

  # Takes ~3 minutes and **stops ds-connector-rec for most of it** — the EDC's
  # decision cache has to expire before a refusal means anything, and again
  # before service resumes. Needs the Docker topology: under `task dev:*` the
  # connector is a host process and the flow fails rather than skipping.
  e2e:fail-closed:
    desc: "E2E: the PDP is stopped, and the negotiation gate must refuse (~3 min)"
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e run --flow fail-closed

  # One task per chain. `e2e:chains` runs all three; these exist because a
  # failing chain is debugged one at a time, and `--flow` already accepts each
  # name — the tasks were simply never written (`E2E-08`).
  e2e:chain-community:
    desc: "E2E: the community delegation chain"
    deps: [e2e:scenario:apply]
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e run --flow chain-community

  e2e:chain-partner:
    desc: "E2E: the partner delegation chain"
    deps: [e2e:scenario:apply]
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e run --flow chain-partner

  e2e:chain-unbundling:
    desc: "E2E: the unbundling delegation chain"
    deps: [e2e:scenario:apply]
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e run --flow chain-unbundling

  e2e:fast:
    desc: "E2E: every flow that runs without the EDC"
    # `FAST_FLOWS` includes `CHAIN_FLOWS`, and those need the delegation
    # scenario applied — the same dependency `e2e:chains` already declares.
    # Without it the three chain flows failed on missing fixtures whenever
    # `e2e:fast` was the first thing run on a fresh stack (`E2E-08`).
    deps: [e2e:scenario:apply]
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e run --flow fast

  e2e:api-contract:
    desc: "E2E: public perimeter, anonymous/wrong-scope refusal, input validation"
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e run --flow api-contract

  e2e:authz:
    desc: "E2E: cross-subject isolation, role confusion, enumeration resistance"
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e run --flow authz-perimeter

  e2e:dcp:
    desc: "E2E: STS, presentation-query binding, did:web and StatusList"
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e run --flow dcp-trust

  e2e:consent-purpose:
    desc: "E2E: consent vocabulary, purpose taxonomy and offer expansion"
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e run --flow consent-purpose

  e2e:consent-request:
    desc: "E2E: interactive consent — request, approve, reject, revoke"
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e run --flow consent-request

  e2e:org-onboarding:
    desc: "E2E: organisation onboarding lifecycle and gates"
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e run --flow org-onboarding

  e2e:catalog:
    desc: "E2E: federated catalogue crawl freshness, discovery and search"
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e run --flow catalog-discovery

  e2e:semantic-model:
    desc: "E2E: the declared payload model and the one every data plane renders agree"
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e run --flow semantic-model

  e2e:lineage:
    desc: "E2E: provenance graph connectivity, idempotency and audit log"
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e run --flow lineage

  e2e:scenario:apply:
    desc: "E2E: provision use-case fixtures (idempotent)"
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e scenario apply

  e2e:scenario:show:
    desc: "E2E: report current use-case fixture state (read-only)"
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e scenario show

  e2e:scenario:destroy:
    desc: "E2E: remove the use-case fixtures this scenario created"
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e scenario destroy

  e2e:chains:
    desc: "E2E: the three delegation chains (community, partner, unbundling)"
    deps: [e2e:scenario:apply]
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e run --flow chains

  e2e:health:
    desc: Check reachability of all platform services
    cmds:
      - cd libs/ds-e2e && uv run ds-e2e health

  # ── Production secrets ──────────────────────────────────────────────────────
  secrets:generate:
    desc: Generate a production .env from .env.example (idempotent — never overwrites)
    summary: |
      Renders .env.production with every CHANGE_ME replaced by a freshly
      generated secret, and every EC P-256 key material written under
      secrets/.

      Idempotent: existing values and existing key files are preserved, so
      re-running only fills what is still missing. Nothing is ever overwritten
      — rotate explicitly with `task secrets:rotate KEY=<VAR>`.

      Output is gitignored. Feed it to the Helm chart, do not commit it.
    vars:
      OUT: '{{.OUT | default ".env.production"}}'
    cmds:
      - |
        set -eu
        OUT="{{.OUT}}"
        mkdir -p secrets

        if [ ! -f "$OUT" ]; then
          echo "→ creating $OUT from .env.example"
          cp .env.example "$OUT"
        else
          echo "→ $OUT exists; filling only missing values"
        fi

        gen() { openssl rand -hex 32; }

        # Replace each remaining CHANGE_ME with a distinct generated secret.
        # Non-secret CHANGE_ME placeholders (hostnames, DIDs) are left alone —
        # they need human input, and the guard will name them at startup.
        SECRET_VARS="EDC_API_KEY IDENTITY_REGISTRY_ENCRYPTION_KEY \
          KEYCLOAK_ADMIN_PASSWORD POSTGRES_PASSWORD \
          SVC_DS_IDENTITY_REGISTRY_SECRET SVC_DS_ONBOARDING_SECRET \
          SVC_DS_PORTAL_SECRET SVC_DS_CONNECTOR_SECRET \
          SVC_DS_FEDERATED_CATALOG_SECRET SVC_DS_DATASET_API_SECRET \
          SVC_DS_PROVENANCE_SECRET \
          SVC_DS_E2E_SECRET SVC_REC_REGISTRY_SECRET \
          SVC_EDC_SECRET KEYCLOAK_CLIENT_SECRET \
          OAUTH2_PROXY_CLIENT_SECRET OAUTH2_PROXY_COOKIE_SECRET"
        # No `PORTAL_SERVICE_CLIENT_SECRET`. It names the same client as
        # `SVC_DS_PORTAL_SECRET`, so generating both handed the realm one secret
        # and the portal another — a client that cannot authenticate, produced
        # by the tool meant to make a deployment safe. Compose and Helm derive
        # the service-side name from the `SVC_*` one; see `.env.example`.

        for var in $SECRET_VARS; do
          if grep -qE "^${var}=CHANGE_ME$" "$OUT"; then
            value="$(gen)"
            tmp="$(mktemp)"
            sed "s|^${var}=CHANGE_ME$|${var}=${value}|" "$OUT" > "$tmp"
            mv "$tmp" "$OUT"
            echo "  generated ${var}"
          fi
        done

        # Usernames need a value but not entropy.
        tmp="$(mktemp)"
        sed -e "s|^KEYCLOAK_ADMIN_USERNAME=CHANGE_ME$|KEYCLOAK_ADMIN_USERNAME=ds-admin|" \
            -e "s|^POSTGRES_USER=CHANGE_ME$|POSTGRES_USER=dataspaces|" "$OUT" > "$tmp"
        mv "$tmp" "$OUT"

        chmod 600 "$OUT"
        echo
        echo "✓ $OUT ready (mode 600)"
        echo
        remaining="$(grep -cF 'CHANGE_ME' "$OUT" || true)"
        if [ "$remaining" -gt 0 ]; then
          echo "  $remaining value(s) still need human input (hostnames, DIDs, URLs):"
          grep -nF 'CHANGE_ME' "$OUT" | grep -v '^\s*#' | sed 's/^/    /'
        fi

  secrets:keygen:
    desc: Generate EC P-256 keys for the EDC vaults and trust anchor (idempotent)
    summary: |
      Writes EC P-256 key material used by the EDC EDR signing path and the
      trust anchor into secrets/. Existing files are never overwritten, so
      this is safe to re-run as part of a bootstrap.

      The dev stack ships placeholder keys in
      services/connector/config/*-vault.properties. Those are zero-config dev
      material; a production deployment mounts the files generated here (or
      Kubernetes Secrets rendered from them) instead.
    cmds:
      - |
        set -eu
        mkdir -p secrets
        for name in provider-edr consumer-edr trust-anchor; do
          if [ -f "secrets/${name}.jwk.json" ]; then
            echo "  secrets/${name}.jwk.json exists — leaving it alone"
            continue
          fi
          uv run --with cryptography python - "$name" <<'PY'
        import json, sys, base64
        from cryptography.hazmat.primitives.asymmetric import ec

        name = sys.argv[1]

        def b64(n: int) -> str:
            return base64.urlsafe_b64encode(n.to_bytes(32, "big")).rstrip(b"=").decode()

        key = ec.generate_private_key(ec.SECP256R1())
        pub = key.public_key().public_numbers()
        priv = {
            "kty": "EC", "crv": "P-256", "kid": f"{name}-key-1",
            "x": b64(pub.x), "y": b64(pub.y),
            "d": b64(key.private_numbers().private_value),
        }
        public = {k: v for k, v in priv.items() if k != "d"}

        with open(f"secrets/{name}.jwk.json", "w") as fh:
            json.dump(priv, fh, indent=2)
        with open(f"secrets/{name}.public.jwk.json", "w") as fh:
            json.dump(public, fh, indent=2)
        print(f"  generated secrets/{name}.jwk.json (+ .public)")
        PY
        done
        chmod 600 secrets/*.jwk.json 2>/dev/null || true
        echo
        echo "✓ key material in secrets/ (gitignored, mode 600)"
        echo "  private keys → EDC vault / identity-registry"
        echo "  *.public.jwk.json → nothing to distribute since DID-17:"
        echo "     verifiers resolve the anchor's DID document for its key"

  secrets:bootstrap:
    desc: Full production secret bootstrap (env + keys), idempotent
    cmds:
      - task: secrets:generate
      - task: secrets:keygen

  secrets:check:
    desc: Fail if any CHANGE_ME or known dev default remains in a production env file
    vars:
      FILE: '{{.FILE | default ".env.production"}}'
    cmds:
      - |
        set -eu
        FILE="{{.FILE}}"
        [ -f "$FILE" ] || { echo "✗ $FILE not found — run: task secrets:bootstrap"; exit 1; }
        rc=0
        # Only inspect assignments; comment lines legitimately name the dev
        # defaults they are warning about.
        values="$(grep -vE '^\s*(#|$)' "$FILE" || true)"
        if printf '%s\n' "$values" | grep -nF 'CHANGE_ME'; then
          echo "✗ unresolved CHANGE_ME placeholders above"; rc=1
        fi
        for bad in insecure-dev-key insecure-dev-control-key \
                   dev-encryption-key-change-in-production \
                   ds-local-dev-secret dev-secret-change-in-prod \
                   change-me-local-client-secret insecure-dev-secret; do
          if printf '%s\n' "$values" | grep -nE "=${bad}\$"; then
            echo "✗ known dev default present: $bad"; rc=1
          fi
        done
        # ── Client secrets that are still their own client id ─────────────────
        #
        # Dev sets every client's secret equal to its own client_id, on both
        # sides at once, so *configured* and *never configured* look identical.
        #
        # This used to be a literal `svc-ds-[a-z-]+` pattern, which missed three
        # of the eleven clients: `svc-edc`, `svc-rec-registry` and — the one the
        # row names — `oauth2_proxy`, the deployment's single human login
        # surface. The pattern is now derived from
        # `services/keycloak/clients.effective.yaml`, which declares each client
        # as `secret: ${VAR:-<dev default>}`, so it covers every client the
        # realm is synced from and cannot go stale when one is added.
        clients_file="services/keycloak/clients.effective.yaml"
        if [ -f "$clients_file" ]; then
          pairs="$(grep -oE '\$\{[A-Z0-9_]+:-[^}]+\}' "$clients_file" | sort -u || true)"
          if [ -z "$pairs" ]; then
            echo "✗ no \${VAR:-default} secrets found in $clients_file — this check is not checking anything"; rc=1
          fi
          for pair in $pairs; do
            var="${pair#\$\{}"; var="${var%%:-*}"
            dev="${pair##*:-}"; dev="${dev%\}}"
            if printf '%s\n' "$values" | grep -qE "^${var}=${dev}\$"; then
              echo "✗ ${var} is still '${dev}' — the client id, i.e. this client's secret was never overridden"; rc=1
            fi
          done
        else
          echo "✗ $clients_file not found — run: task keycloak:merge"; rc=1
        fi
        # oauth2_proxy is declared in the realm import rather than by the syncer,
        # so it has no ${VAR:-default} above and needs naming here.
        #
        # This check was vacuous until `O2P-01`: the compose service passed
        # neither `OAUTH2_PROXY_CLIENT_SECRET` nor `OAUTH2_PROXY_COOKIE_SECRET`
        # to the container, because both were literals in the mounted
        # `oauth2-proxy.cfg`. So it demanded a value the dev topology could not
        # consume — the same shape the `POSTGRES_PASSWORD` note above records.
        # Both are environment variables in both modes now.
        if printf '%s\n' "$values" | grep -qE '^OAUTH2_PROXY_CLIENT_SECRET=oauth2_proxy$'; then
          echo "✗ OAUTH2_PROXY_CLIENT_SECRET is still 'oauth2_proxy' — the dev default for the one client every human logs in through"; rc=1
        fi
        # The dev realm ships nine users whose password is their username, a
        # literal client secret and open self-registration. Nothing in `helm/`
        # imports any realm — Keycloak is externally managed — so this is a
        # tripwire for a hand-rolled deployment, not a chart defect.
        if printf '%s\n' "$values" | grep -qF 'realm-dataspaces-dev'; then
          echo "✗ a production env file references realm-dataspaces-dev.json — it ships 9 users whose password equals their username and registrationAllowed=true"; rc=1
        fi
        if printf '%s\n' "$values" | grep -nE '^(KEYCLOAK_ADMIN_PASSWORD|POSTGRES_PASSWORD)=(admin|postgres)$'; then
          echo "✗ weak credential above"; rc=1
        fi
        # The extension this refers to was deleted (`DID-03`): real DCP works and
        # the whole suite runs on it. The check stays as a never-reintroduce
        # guard — the variable is cheap to re-add and a signature bypass is not
        # something to rediscover twice.
        if printf '%s\n' "$values" | grep -nE '^DS_DEMO_IDENTITY_ENABLED=true$'; then
          echo "✗ DS_DEMO_IDENTITY_ENABLED is set — the demo identity bypass was removed; a deployment that re-adds it bypasses DSP authentication"; rc=1
        fi
        # `DS_ENV` now defaults to production, so an absent one is safe and is
        # no longer worth failing on. What IS worth failing on is a production
        # env file that explicitly asks for dev — the only value that downgrades
        # every guard to a warning.
        if printf '%s\n' "$values" | grep -qE '^DS_ENV=dev$'; then
          echo "✗ DS_ENV=dev in a production env file — every ProductionGuard degrades to a warning"; rc=1
        fi

        # ── The EDC vault: key material this check could not see at all ───────
        #
        # `services/connector/config/*-vault.properties` are committed dev
        # fixtures carrying a PUBLISHED EC P-256 private key per participant —
        # the key its data plane signs Endpoint Data References with — and
        # `insecure-dev-secret` as its STS client secret. Nothing above reaches
        # them: they are not env vars, and the values that replace them in
        # production live in `helm/secrets.sops.yaml`, not in "$FILE".
        #
        # The chart never mounts the fixtures (ds-edc's Secret renders
        # vault.properties from `secrets.*`), so the exposure is not the
        # fixture existing — it is the fixture being COPIED into a real values
        # or secrets file, which nothing detected. The `d` values are read out
        # of the fixtures rather than pasted here, so this cannot go stale when
        # they are rotated.
        vault_dir="services/connector/config"
        dev_keys="$(sed -n 's/.*"d":"\([^"]*\)".*/\1/p' "$vault_dir"/*-vault.properties 2>/dev/null | sort -u)"
        if [ -z "$dev_keys" ]; then
          echo "✗ no dev EDR keys found in $vault_dir/*-vault.properties — this check is not checking anything"; rc=1
        fi
        # Everywhere a deployment's real values could be written. The fixtures
        # themselves are excluded; they are meant to contain these.
        for candidate in helm/secrets.sops.yaml helm/secrets.yaml helm/secrets.dec.yaml helm/values.yaml "$FILE"; do
          [ -f "$candidate" ] || continue
          for key in $dev_keys; do
            if grep -qF "$key" "$candidate"; then
              echo "✗ $candidate carries the committed dev EDR signing key — every EDR it signs is forgeable by anyone with this repository"; rc=1
            fi
          done
          if grep -qF 'insecure-dev-secret' "$candidate"; then
            echo "✗ $candidate carries the dev STS client secret 'insecure-dev-secret'"; rc=1
          fi
          if grep -qF 'CHANGE_ME' "$candidate"; then
            echo "✗ $candidate still has CHANGE_ME placeholders"; rc=1
          fi
        done
        # An encrypted secrets file is unreadable here, and a check that quietly
        # passes because it could not look is the failure this ledger keeps
        # finding. Say so.
        if [ -f helm/secrets.sops.yaml ] && grep -q '^sops:' helm/secrets.sops.yaml 2>/dev/null; then
          echo "  helm/secrets.sops.yaml is encrypted — decrypt it to helm/secrets.dec.yaml and re-run to have its values checked"
        fi

        [ "$rc" -eq 0 ] && echo "✓ $FILE and the EDC vault material carry no dev defaults"
        exit $rc

  # ── Documentation ────────────────────────────────────────────────────────
  docs:serve:
    desc: Serve docs locally with live reload (http://127.0.0.1:8000)
    cmds:
      - >-
        uv run
        --with mkdocs-material
        --with mkdocs-awesome-pages-plugin
        mkdocs serve

  docs:build:
    desc: Build docs site to site/
    cmds:
      - >-
        uv run
        --with mkdocs-material
        --with mkdocs-awesome-pages-plugin
        mkdocs build --strict

  # ── Compliance (governance validation + audit evidence) ─────────────────────
  compliance:validate:
    desc: Validate every governance file before importing it into a connector
    cmds:
      # **One per producer** (`DID-15`). A producer owns its own governance, so
      # validating only the first one leaves the second free to name a purpose
      # outside the profile or an owner that does not resolve — and the failure
      # would surface as a refused negotiation, three services away.
      - |
        cd libs/governance
        for dir in governance-rec governance-grid-operator; do
          echo "→ $dir"
          uv run ds-governance validate \
            --file ../../services/connector/$dir/governance.yaml \
            --owners ../../services/identity-registry/seed/owners.dev.yaml
        done

  compliance:validate:runtime:
    desc: Validate governance against the running identity-registry (owners + participants)
    cmds:
      # **Iterate, never name.** This validated `governance-rec` alone, which is
      # the same by-name-instead-of-by-iteration shape `TASK-09` fixed for
      # `build` and `compliance.yml` fixed for the offline gate — and it means
      # `owner-participant` and `controller_role`, the two checks that exist
      # *only* here, never ran against the grid-operator at all.
      #
      # A loop matching nothing is a hard failure, not a green run: `all([])` is
      # `True`, and that has cost this repository twice (`E2E-01`, `CI-02`).
      #
      # **A token is not optional.** Both routes the runtime path reads —
      # `/admin/participants` and `/owners/resolve` — are guarded by
      # `require_admin_or_read_scope`, so this task ran anonymously and got 401s
      # for as long as it has existed. That was invisible while the CLI answered
      # `None` and skipped; the CLI now refuses, so the task has to bring a
      # credential. `IDENTITY_REGISTRY_TOKEN` overrides for a deployment that
      # mints its own; the fallback is the dev/CI harness client, which holds
      # `identity-registry.read` and is the same identity `rec:start` already
      # uses for driver-side calls.
      - |
        set -euo pipefail
        registry="${IDENTITY_REGISTRY_URL:-http://172.17.0.1:30005}"
        token="${IDENTITY_REGISTRY_TOKEN:-}"
        if [ -z "$token" ]; then
          token=$(curl -fsS -X POST "${KEYCLOAK_TOKEN_URL}" \
            -d grant_type=client_credentials \
            -d "client_id=${SVC_DS_E2E_ID}" \
            -d "client_secret=${SVC_DS_E2E_SECRET}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
        fi
        cd libs/governance
        shopt -s nullglob
        producers=(../../services/connector/governance-*/governance.yaml)
        if [ ${#producers[@]} -eq 0 ]; then
          echo "✗ no services/connector/governance-*/governance.yaml matched" >&2
          exit 1
        fi
        for file in "${producers[@]}"; do
          echo "→ $(basename "$(dirname "$file")")"
          uv run ds-governance validate \
            --file "$file" \
            --identity-registry-url "$registry" \
            --token "$token"
        done

  compliance:conformity:
    desc: "Assess every participant against the rulebook (DSSC-TRF-02…-04)"
    cmds:
      # **Exits non-zero when anybody is non-conformant**, which is what makes
      # it runnable as the periodic check the blueprint asks for. Reads only:
      # suspension is a decision, and this is the evidence for it.
      - |
        cd services/identity-registry && uv run ir-cli conformity check

  compliance:evidence:
    desc: Write DCAT-AP catalog and ODRL offers to reports/compliance
    cmds:
      - |
        cd libs/governance && uv run ds-governance evidence \
          --file ../../services/connector/governance-rec/governance.yaml \
          --owners ../../services/identity-registry/seed/owners.dev.yaml \
          --name core --out-dir ../../reports/compliance

  compliance:test:
    desc: Run the governance validator test suite
    cmds:
      # `tests/`, not `tests/tests/` — see the note in libs/governance/Taskfile.yml.
      - cd libs/governance && uv run pytest tests/ -q

  rulebook:status:
    desc: Regenerate docs/rulebook/status.md from the blueprints, the rulebook and the tests
    cmds:
      # Static: reads markdown and source, never runs a suite and never needs a
      # stack — so the answer is a function of the checked-out tree and two
      # people on one commit get the same bytes. `status.md` is committed for
      # exactly that reason: drift shows up as a diff.
      - cd libs/ds-conformance && uv run ds-conformance status --repo ../..

  rulebook:check:
    desc: Fail if docs/rulebook/status.md is stale, or if the rulebook has a structural defect
    cmds:
      - cd libs/ds-conformance && uv run ds-conformance status --repo ../.. --check

  rulebook:summary:
    desc: Print the conformance counts without rewriting docs/rulebook/status.md
    cmds:
      # The exit criteria in .agents/plans/conformance-closeout.md are fields of this
      # output, so a workstream is finished when a number here says so.
      - cd libs/ds-conformance && uv run ds-conformance summary --repo ../..

  rulebook:unevidenced:
    desc: List the rulebook rules that claim enforcement and no test names
    cmds:
      - cd libs/ds-conformance && uv run ds-conformance unevidenced --repo ../..

  rulebook:rule:
    desc: "Show one rule and every test that evidences it (RULE=A-11)"
    cmds:
      - cd libs/ds-conformance && uv run ds-conformance rule {{.RULE}} --repo ../..

  rulebook:test:
    desc: Run the ds-conformance test suite
    cmds:
      - task -d libs/ds-conformance test

  auth:test:
    desc: Run the ds-auth test suite (role bundles, permissions, JWT verification)
    cmds:
      - cd libs/ds-auth && uv run pytest tests/ -q

  auth:bundles:generate:
    desc: Regenerate the portal's copy of the role-bundle table from ds_auth.bundles
    cmds:
      - task -d libs/ds-auth bundles:generate

  keycloak:merge:
    desc: "Regenerate the effective clients.yaml the sync applies (OVERLAYS=energy)"
    vars:
      OVERLAYS: '{{.OVERLAYS | default "energy"}}'
    cmds:
      - cd services/identity-registry && uv run ir-cli keycloak merge {{range $o := splitList "," .OVERLAYS}}--overlay {{$o}} {{end}}

  vocab:fetch:
    desc: "Cache the registered semantic vocabularies the connector serves at /ns/{slug}"
    cmds:
      # The connector does this at startup and refuses to boot when it cannot.
      # This is the deliberate version: run it before a restart to see every
      # failure at once rather than one boot at a time.
      #
      # REFRESH=true re-fetches copies that are already cached. Off by default —
      # a cached copy is what the deployment is serving, and replacing it changes
      # what a running catalogue's `dct:conformsTo` IRIs resolve to.
      - >-
        cd libs/governance && uv run ds-governance fetch-vocabularies
        --file ../../services/connector/governance-rec/vocabularies.yaml
        --cache-dir ../../data/vocabularies
        {{if eq .REFRESH "true"}}--refresh{{end}}
    vars:
      REFRESH: '{{.REFRESH | default "false"}}'

  keycloak:mirror:
    desc: Regenerate the ds section a host realm's clients.yaml must carry
    cmds:
      - cd services/identity-registry && uv run ir-cli keycloak mirror

  keycloak:mirror:diff:
    desc: "Report what a host realm is missing: HOST=<path to its clients.yaml>"
    cmds:
      - cd services/identity-registry && uv run ir-cli keycloak mirror --diff {{.HOST}}

  # ── Release ─────────────────────────────────────────────────────────────────
  #
  # One version for the whole repository — see releaserc.toml for why and for
  # what carries it. Cutting a release is a deliberate local act; publishing is
  # not. `task release` only writes and pushes a tag; the tag is what makes
  # .github/workflows/release.yml build and push the images.
  #
  # Requires a clean tree on `main`, up to date with origin.
  release:dry:
    desc: Show the version the next release would take and every file it would stamp
    cmds:
      - "{{.SEMANTIC_RELEASE}} --noop version --no-vcs-release --no-push"

  release:next:
    desc: Print just the version the next release would take
    cmds:
      - "{{.SEMANTIC_RELEASE}} version --print"

  release:
    desc: "Cut a release: stamp every version, write CHANGELOG.md, commit, tag, push"
    cmds:
      # --no-push so the commit and the tag can be inspected before anything
      # leaves the machine; the push below is what triggers the image build.
      - "{{.SEMANTIC_RELEASE}} -v version --no-vcs-release --no-push"
      - git --no-pager show --stat HEAD
      - git push --follow-tags
