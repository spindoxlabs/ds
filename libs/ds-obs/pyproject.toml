[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ds-obs"
version = "0.1.0"
description = "Shared logging configuration and HTTP metrics for the dataspaces platform"
requires-python = ">=3.12"
# Deliberately dependency-free at runtime. The Prometheus exposition format is
# rendered by hand rather than through `prometheus_client`, which is what the
# four per-service copies this replaces already did — adding a client library
# would also drag in its multiprocess registry model, and every service here
# runs `--workers 1`. `fastapi` is an extra, so a CLI can configure logging
# without pulling a web framework in.
dependencies = []

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.115",
]
# Tracing is an **extra**, for the same reason `fastapi` is: the base package
# stays importable by a CLI that will never emit a span. It is also the only part
# of ds-obs with runtime dependencies, and they are not small — an OTLP exporter
# and three instrumentations — so a service that does not trace should not carry
# them.
#
# `-proto-http` rather than gRPC: one fewer transitive stack, it traverses the
# same ingress every other call does, and every collector accepts both.
#
# **No SQLAlchemy instrumentation, deliberately.** It would need the ORM as a
# dependency of a library that has no business holding one, and it hooks engine
# *creation* — while `connector.db.engine` builds its engine at module import,
# before any application factory runs. Installing it there would produce a
# working import, no spans, and nothing saying so, which is the failure this
# repository keeps finding rather than a smaller version of the feature. DB spans
# are worth having; they want the engine passed in, per service, as its own
# change.
tracing = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "fastapi>=0.115",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ds_obs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
