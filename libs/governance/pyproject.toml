[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ds-governance"
version = "0.1.0"
description = "Shared governance models, ODRL mapper, and resolver for the dataspaces platform"
requires-python = ">=3.12"
dependencies = [
    # **The governance shape is defined upstream and imported, not restated**
    # (ADR-0013). `celine.governance` is the reference implementation of
    # `governance.yaml`; `ds.governance.models` subclasses it and adds what is ds's.
    #
    # Core only — **never an extra**. `[pipelines]` drags in dbt, Meltano, Prefect
    # and a Keycloak client, and needing that to parse a YAML file is the reason
    # four consumers each wrote their own parser and then disagreed about what the
    # same file meant. The core is `pydantic` + `pyyaml` + `jsonschema`, and a
    # dedicated upstream CI job installs it bare and imports `celine.governance` so
    # that a regained dependency fails there rather than here.
    #
    # **`>=2.5.0`, and the floor is load-bearing.** 2.4 modelled the shared shape
    # but every entry point into it named a class: `parse_rule` validated into
    # `GovernanceRule`, `merge_rules` and `merge_dataspace` validated back into
    # `GovernanceRule` / `DataspaceConfig`. Since those models are `extra="ignore"`
    # — which is what *lets* ds subclass them — passing a `GovernanceRuleV2`
    # through any of them returned a rule with `policy`, the EDC sub-objects and
    # `sharing_offers` silently dropped. Against 2.4 ds had to restate the parse
    # and the three merges to keep its own fields; 2.5 takes the model class from
    # its operands, so the restatements are gone and only ds's `policy` overlay
    # remains. Installing 2.4 under this code would not fail to import — it would
    # drop ds's fields on every merge, which is the exact defect ADR-0013 exists
    # to end.
    "celine-utils>=2.5.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
ds-governance = "ds.governance.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    # Stubs for `pyyaml`, which ships none. Without them mypy reads every
    # `yaml.safe_load` as `Any` and stops checking what is done with the result —
    # in a repository whose central shape is parsed from YAML, that is the
    # checking that matters most.
    "types-PyYAML>=6.0",
    # Validates this repo's governance files against the vendored canonical
    # schema (see schema/README.md). A dev dependency, not a runtime one: the
    # library parses governance, the test suite is what asserts the shape.
    "jsonschema>=4.19",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ds"]

[tool.mypy]
strict = true

# A `[[tool.mypy.overrides]]` for `celine.*` with `follow_untyped_imports` stood
# here: 2.4 shipped no `py.typed`, so mypy read every name in `celine.governance`
# as `Any`, and under `strict` that cascaded into "cannot subclass DataspaceConfig
# (has type Any)" for each subclass in `models.py`. **2.5 ships the marker**, so
# the override is not merely unnecessary — it was suppressing the checking of the
# subclasses, and the `>=2.5.0` floor above is what makes removing it safe.

[tool.pytest.ini_options]
# `rule` names the rulebook rule a test is evidence for. `ds-conformance`
# collects it to derive each rule's enforcement status, so the status column
# in `docs/rulebook/` is measured rather than asserted. Registered here so a
# typo warns instead of silently evidencing nothing.
markers = ["rule: names the rulebook rule id this test is evidence for"]
