[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ds-governance"
version = "0.1.0"
description = "Shared governance models, ODRL mapper, and resolver for the dataspaces platform"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
ds-governance = "ds.governance.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    # Validates this repo's governance files against the vendored canonical
    # schema (see schema/README.md). A dev dependency, not a runtime one: the
    # library parses governance, the test suite is what asserts the shape.
    "jsonschema>=4.19",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ds"]

[tool.mypy]
strict = true
