version: "3"

tasks:
  setup:
    desc: Install library in editable mode (idempotent)
    # `--extra dev`, not a bare `uv sync`: without it there is no `jsonschema`,
    # and the two schema tests fail at *collection* — pytest then reports
    # "2 errors" having run nothing, which reads as a broken suite rather than a
    # missing dependency. Same defect, same fix, as `libs/ds-auth`.
    cmds:
      - uv sync --extra dev
    sources: [pyproject.toml]

  test:
    # A test suite is a development context, and it has to say so: since
    # `DS_ENV` defaults to `production`, a suite that builds the app hits the
    # ProductionGuard and the whole module fails to *collect*. Declared here for
    # the same reason compose declares it — this is the dev topology, so it opts
    # out explicitly rather than relying on the variable being absent.
    env:
      DS_ENV: dev
    deps: [setup]
    cmds:
      # `tests/`, **not** `tests/tests/`. This unit has two test roots — the
      # nested one, and `tests/test_dataplane_contract.py` beside it — and every
      # runner pointed at the nested one, so the 10 contract tests pinning
      # `/internal/dataplane/authorize` (the CON-05 / DAM-03 defect) were run by
      # the unit task, the root task and CI alike: never. Collect the whole tree,
      # so a file added at either level is run without anyone remembering to
      # widen a path.
      - uv run pytest tests/ -v --cov=src/ds/governance --cov-report=term-missing

  characterise:refresh:
    desc: Rewrite the governance characterisation snapshot (ADR-0013, phase 0)
    cmds:
      # The snapshot is what says the migration to `celine.governance` changed no
      # behaviour, so it is generated by the same code that checks it — one
      # implementation, no chance of the two drifting. **Read the diff**: during
      # the migration a diff means the resolver moved, and every field but the
      # divergences the test declares is meant to be identical.
      - DS_CHARACTERISATION_REFRESH=1 uv run pytest tests/tests/test_characterisation.py -q
      - uv run pytest tests/tests/test_characterisation.py -q

  schema:refresh:
    desc: Copy the governance schema out of the installed celine-utils
    cmds:
      # governance.yaml is the ONE shape celine-utils defines, and `../../schemas/`
      # holds a copy only so ds can **publish** it for producers to author against.
      # Never edit that copy.
      #
      # **From the installed wheel, not from the network** (`ADR-0013`, phase 5).
      # This used to `curl` https://celine-eu.github.io/schema/governance.schema.json,
      # which is the same document but not the same *version*: the published site
      # tracks upstream's main, the dependency is pinned, and by the time phase 5
      # looked they had come apart by three root properties with nothing failing.
      # Copying from `celine-utils` makes the schema ds serves the schema ds
      # validates against, and `uv sync` is the only way to move it.
      #
      # The bytes, not a re-serialisation: `load_schema` parses, and dumping the
      # result back would make the published file differ from upstream's in
      # whitespace and key order for no reason. A copy should be a copy.
      - >-
        uv run python -c "import pathlib;
        from importlib import resources;
        pathlib.Path('../../schemas/governance.schema.json').write_text(
        resources.files('celine.governance.schema')
        .joinpath('governance.schema.json').read_text('utf-8'), encoding='utf-8')"
      - uv run pytest tests/tests/test_schema_conformance.py -q

  schema:generate:
    desc: Regenerate the schemas ds owns from their Pydantic models
    cmds:
      # Everything else in ../../schemas is generated, never hand-written — the
      # models are the definition. test_schema_export.py fails on drift.
      - uv run python -c "from pathlib import Path; from ds.governance.schema_export import write_all; [print(p) for p in write_all(Path('../../schemas'))]"
      - uv run pytest tests/tests/test_schema_export.py -q

  lint:
    cmds:
      - uv run ruff format --check src/ tests/
      - uv run ruff check src/ tests/

  format:
    cmds:
      - uv run ruff format src/ tests/

  type-check:
    cmds:
      - uv run mypy src/
