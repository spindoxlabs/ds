[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ds-edc"
version = "0.1.0"
description = "Shared EDC Management API v3 client and Pydantic models for the dataspaces platform"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ds_edc"]

[tool.pytest.ini_options]
# `rule` names the rulebook rule a test is evidence for. `ds-conformance`
# collects it to derive each rule's enforcement status, so the status column
# in `docs/rulebook/` is measured rather than asserted. Registered here so a
# typo warns instead of silently evidencing nothing.
markers = ["rule: names the rulebook rule id this test is evidence for"]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
