version: "3"

# This unit had **no Taskfile at all**, against the per-unit contract in the root
# guide, while configuring pytest, ruff and mypy in `pyproject.toml`. So nothing
# ran its 42 tests — which is why `test_config.py::test_defaults` sat red on
# `main` from the commit that renamed the harness's client (`a6e6e34`) until it
# was found by reading rather than by running.
#
# `test` here is the **unit** suite: it mocks the database and the HTTP client
# and needs no stack. The flows that drive a running dataspace are the root
# `e2e:*` tasks, and they are a different thing with a different cost.

tasks:
  setup:
    desc: Install the harness in editable mode (idempotent)
    cmds:
      - uv sync --extra dev
    sources: [pyproject.toml]

  test:
    deps: [setup]
    desc: Run the ds-e2e unit suite (no running stack required)
    cmds:
      - uv run pytest tests/ -q

  lint:
    # **`mypy` runs here** (`E2E-11`, issue #8). It was configured
    # `strict = true` in `pyproject.toml` and invoked by no task and no
    # workflow — coverage that read as real and was not. `libs/ds-edc` is the
    # counter-example: clean under `--strict` and gating in CI since the day it
    # got a `tests/` directory.
    #
    # **`src/` only, and that is the ratchet.** `src/` is clean under strict as
    # of 2026-08-28; `tests/` carries 334 errors and `ruff` carries 184 across
    # both, which is why `tests.yml` still has this unit on `lint: false`.
    # Widening the path is how the next tranche lands.
    #
    # Both checkers run even when the first fails, and the exit code is the
    # combination — one red checker must not hide the state of the other, the
    # same reason the root `setup` collects its failures.
    cmds:
      - |
        status=0
        uv run mypy src/ || status=1
        uv run ruff check src/ tests/ || status=1
        exit $status

  format:
    cmds:
      - uv run ruff format src/ tests/
