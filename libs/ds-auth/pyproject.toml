[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ds-auth"
version = "0.1.0"
description = "Shared JWT authentication and unified scope/group authorization for the dataspaces platform"
requires-python = ">=3.12"
# Everything imported at module level by `src/ds_auth/**` belongs here, and
# `tests/test_declared_dependencies.py` fails if one does not. Two were missing:
#
#   httpx    — `service_token.ServiceTokenProvider`, imported by four services.
#              It was `dev`-only, so the provider was unimportable from a plain
#              install and only the test venv ever proved otherwise.
#   fastapi  — `user_credentials.py` raises `HTTPException` from 24 call sites
#              and imports it at module level, so it is a real dependency of the
#              library as shipped, not an optional one. The `fastapi` extra that
#              claimed otherwise was named in no Dockerfile and no pyproject.
#
# "Core stays framework-free" is still true of `errors`/`config`/`jwt`/
# `permissions`/`principal`; it stopped being true of the package the day the VC
# verifier landed, and the packaging now says so rather than the docstring.
dependencies = [
    "pyjwt[crypto]>=2.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    # user_credentials verifies ES256 VC-JWTs against the trust anchor key
    # directly, rather than through pyjwt, because a VC carries its own
    # credentialStatus that has to be checked in the same pass.
    "cryptography>=42",
    "fastapi>=0.115",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    # test_vocabulary.py reconciles the bundle table against
    # services/keycloak/clients.yaml. Test-only: the library itself never reads
    # the realm's declaration at runtime.
    "pyyaml>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ds_auth"]

[tool.pytest.ini_options]
# `rule` names the rulebook rule a test is evidence for. `ds-conformance`
# collects it to derive each rule's enforcement status, so the status column
# in `docs/rulebook/` is measured rather than asserted. Registered here so a
# typo warns instead of silently evidencing nothing.
asyncio_mode = "auto"
# `tests/integration` needs a running Keycloak realm, so it is never collected
# by `task test` — the unit suite stays fast and dependency-free.
# `task test:integration` names the directory explicitly.
norecursedirs = ["tests/integration"]
markers = ["integration: needs a running Keycloak with the dataspaces realm", "rule: names the rulebook rule id this test is evidence for"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true

[tool.ruff.lint.per-file-ignores]
# `bundles_export.py` writes the portal's TypeScript copy of the bundle table,
# and the long lines flagged here are TypeScript **emitted verbatim** into
# `services/portal/src/lib/server/bundles.generated.ts`. Rewrapping the Python
# source rewrites the artifact, which `test_bundles_export.py` then reports as
# drift. The generated file has its own formatter; this one is not it.
"src/ds_auth/bundles_export.py" = ["E501"]
