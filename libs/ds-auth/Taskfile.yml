version: "3"

tasks:
  setup:
    desc: Install library in editable mode (idempotent)
    cmds:
      - uv sync --extra dev
    sources: [pyproject.toml]

  test:
    # **No `env: DS_ENV: dev` here.** `tests/conftest.py` pins it, on the route
    # every invocation takes — a bare `pytest` included. A second pin here would
    # keep `task test` green after the first was deleted, and the two routes
    # would then disagree (`verify_user_vc_jwt` reads the posture).
    desc: Run the ds-auth test suite
    # `setup` first: without the dev extra there is no pyyaml, and
    # test_vocabulary.py — the check that the bundle table and
    # services/keycloak/clients.yaml agree — fails at *collection*. pytest then
    # reports "1 error" and runs nothing, which reads as a broken suite rather
    # than a missing dependency. Observed on a venv synced without extras.
    deps: [setup]
    cmds:
      - uv run pytest tests/ -q

  test:integration:
    desc: |
      ds_auth against a **real Keycloak realm** — needs a running stack
      (`task docker:restart`). Proves what the unit suite structurally cannot:
      it signs its own tokens and compares clients.yaml with bundles.py, so
      neither the shape of a real Keycloak token nor the result of the realm
      sync has ever been checked. Skips cleanly when no realm is reachable.
    deps: [setup]
    cmds:
      - uv run pytest tests/integration -v

  bundles:generate:
    desc: Regenerate the portal's copy of the role-bundle table from ds_auth.bundles
    cmds:
      # The Python table is the definition; the TypeScript is a build artifact.
      # test_bundles_export.py fails on drift.
      - uv run python -c "from pathlib import Path; from ds_auth.bundles_export import write_typescript; print(write_typescript(Path('../..')))"
      - uv run pytest tests/test_bundles_export.py -q

  lint:
    cmds:
      - uv run ruff format --check src/ tests/
      - uv run ruff check src/ tests/

  format:
    cmds:
      - uv run ruff format src/ tests/
